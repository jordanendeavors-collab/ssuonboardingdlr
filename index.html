iance & Ethics","What experience is required for Level 4 (Specialist/Engineer)?","3-5 years","Level 4 requires 3-5 years experience."],["QB-00463","Compliance & Ethics","What experience is required for Level 5 (Master Technician)?","5+ years","Level 5 Master Technician requires 5+ years experience."],["QB-00464","Compliance & Ethics","What is the Fleet department responsible for?","Vehicle coordination, gas cards, repairs, and loaners","Fleet handles vehicles, gas cards, repairs, and loaners."],["QB-00465","Compliance & Ethics","What may be required for individual security salespeople?","Individual salesperson registration and background checks","Registration + background check. Standard industry practice. If you can't pass a background check, you shouldn't be in people's homes."],["QB-00467","Compliance & Ethics","What minimum rating is required for Level 1 promotion?","4.0+","4.0+ rating is required for Level 1 promotion."],["QB-00468","Compliance & Ethics","What must be done with enlarged ear holes?","Plugged with solid nude or clear gauges","Enlarged ear holes must be plugged with solid nude or clear gauges."],["QB-00469","Compliance & Ethics","What must security contracts include?","Equipment, costs, cancellation rights, liability, warranty, false alarm policies","Everything. Equipment, costs, cancellation, liability, warranty, false alarm policy. Leave one out and you're exposed legally."],["QB-00470","Compliance & Ethics","What privacy obligation do you have to customers?","Protect customer privacy and confidential information","ALL information. Names, addresses, system designs, entry points, codes, schedules. This is SECURITY data. Treat it like it."],["QB-00471","Compliance & Ethics","What responsibilities does a Level 5 Master Technician have?","Training, QA, oversight, process improvement, mentoring","Level 5 handles training, QA, oversight, process improvement, and mentoring."],["QB-00472","Compliance & Ethics","What rule applies to tattoos for AAA employees?","Tattoos promoting racism, violence, indecency, or extremism are prohibited","Tattoos promoting racism, violence, indecency, or extremism are prohibited."],["QB-00474","Compliance & Ethics","What should you NEVER do regarding system capabilities?","Misrepresent system capabilities","NEVER misrepresent. If it can't do something, say so. Overselling capabilities = chargebacks, complaints, and lawsuits."],["QB-00476","Compliance & Ethics","What supervision is required for a Level 1 technician?","Direct supervision required","Level 1 technicians require direct supervision."],["QB-00477","Compliance & Ethics","What supervision level applies to Level 3 technicians?","Independent","Level 3 technicians work independently."],["QB-00479","Compliance & Ethics","What team handles general inquiries, billing, payments, and account updates?","Member Experience Team","Member Experience Team is the front line for residential account requests."],["QB-00482","Compliance & Ethics","What unique capability does Level 4 have?","Can train others","Level 4 specialists can train other technicians."],["QB-00483","Compliance & Ethics","When customer asks for a feature you don't offer:","Be honest and explain alternatives","Honesty builds trust; explain alternatives or how your solution still meets needs."],["QB-00486","Compliance & Ethics","Who processes Certificates of Insurance (COI) requests?","Risk Management","Risk Management processes all COI requests."],["QB-00487","Compliance & Ethics","Willful violation penalty:","Double",""],["QB-00490","Compliance & Ethics","You accidentally knocked a framed photo off a wall during install. It didn't break. The member is in another room. Do you disclose it?","Yes. 'Just a heads up — when I was routing cable near the hallway a framed photo bumped off the wall. I put it back and nothing was damaged, but I wanted you to know.' 15 seconds. Removes any future question about damage.",""],["QB-00491","Compliance & Ethics","You arrive at a job site, start talking with the member, and realize you forgot to clock in. It's been about 12 minutes. What do you do?","Clock in immediately. Add a WO note: 'Clock-in entered at [actual time] — delay of approximately 12 minutes from site arrival due to immediate member engagement. Arrival was [estimated actual time].' Honest notation beats a retroactive edit every time.",""],["QB-00492","Compliance & Ethics","You arrive early to a job. The scheduled window starts in 18 minutes. Do you clock in now or wait?","Wait. Clock in when the job actually begins — within the scheduled window. If you're early, that's your preparation time: review the WO, make your pre-call at the 30-minute mark. Do not clock in 18 minutes early and sit in the driveway.",""],["QB-00493","Compliance & Ethics","You find an unlocked gun case in a bedroom during a sensor install. The homeowner is downstairs. What does integrity require?","Leave the room immediately. Do not touch anything. Notify the homeowner when you come downstairs: 'Just letting you know I completed the Zone 7 installation in the bedroom without touching anything near the closet area.' Log the access in your WO notes.",""],["QB-00494","Compliance & Ethics","You notice a suspicious time gap in your clock-in records between two consecutive jobs. How do you address it proactively?","Don't wait to be asked. Add a WO note on the job where the gap appears: 'Drive time from [Job A] to [Job B]: departed at [time], arrived [time]. No interim stops.' If there was a stop, note it accurately. Proactive documentation removes the suspicion before it becomes an investigation.",""],["QB-00495","Compliance & Ethics","You realize a submitted WO note has the wrong sensor type for Zone 4. What's the correct path?","Correct it now with a documented note: 'CORRECTION: Zone 4 initially noted as DSC PG9975 — correct sensor is ADC-S2000 recessed contact. Corrected [timestamp].' Do not delete the original. Corrections with timestamps are legally clean. Deletions look like cover-ups.",""],["QB-00496","Compliance & Ethics","You submitted QA on a door contact. On the drive to your next job you get a nagging feeling it might still be loose. What does integrity require?","Turn around or call it in immediately. That nagging feeling is your professional instinct. A sensor you're still doubting is not one you can sign off on in good conscience. Call your TL, document the concern, and if you're within distance — go back and re-seat it.",""],["QB-00497","Compliance & Ethics","You want to enter a zone test result in the WO right away, but the member keeps talking to you. Do you pause to enter it now, or wait?","Excuse yourself briefly and enter it now. 'Give me just 10 seconds — I want to get this logged while I'm standing right here.' A note entered immediately is the accurate record. A note entered 20 minutes later is a recollection. Contemporaneous documentation is everything in a dispute.",""],["QB-00498","Compliance & Ethics","You're wrapping a job. Everything tested. You realize you never logged the pre-call in the WO. What do you do?","Add the note now with accurate timestamp: 'Note entered at close-out — call placed at [time], member confirmed, no issues.' Do NOT back-date or omit it. Transparency in the record beats a clean-looking gap.",""],["QB-00499","Compliance & Ethics","Your WO system went offline mid-job. You completed two zone tests and the system came back online. When re-entering results, what do you note?","Enter results with accurate test timestamps plus: 'System offline at [time]. Zone tests for Z3 and Z4 conducted at [actual times] — entries logged at [re-entry time] due to system outage. Results reflect actual walk test outcomes.' System outage logs will corroborate.",""],["QB-00500","Compliance & Ethics","Can you modify a commercial bundle for a specific Member?","Bundles are pre-configured — for custom needs, submit a design request","Bundles are standardized for efficiency. Custom needs go through design engineering."],["QB-00501","Compliance & Ethics","What do you do for large businesses that need more than bundle coverage?","Submit a custom commercial design form","Large businesses need proper design — sensors, cameras, coverage maps, and engineering review."],["QB-00502","Compliance & Ethics","What is required before scheduling a commercial installation?","Signed agreement, payment or financing approval, and scope of work confirmation","All paperwork complete before scheduling. Incomplete orders delay installation."],["QB-00505","Install Protocol","RACI: 'A' means?","Accountable — owns the outcome",""],["QB-00506","Install Protocol","Residential appointment window?","4-hour",""],["QB-00507","Install Protocol","Running 15+ min late?","Just show up",""],["QB-00513","Install Protocol","Same-day reschedule process?","You choose new time",""],["QB-00514","Install Protocol","Go-back vs callback?","Go-back is worse",""],["QB-00521","Install Protocol","Commercial multi-day coordination?","Same as residential",""],["QB-00523","Data & Communications","A cable stapler:","Secures cables to surfaces","Cable staplers attach cables to framing."],["QB-00524","Data & Communications","A drill/driver is used for:","Drilling holes and driving screws","Drill/drivers drill and drive fasteners."],["QB-00525","Data & Communications","A hole saw creates:","Large diameter round holes","Hole saws cut larger diameter holes."],["QB-00526","Data & Communications","A level ensures:","Horizontal and vertical alignment","Levels check alignment."],["QB-00527","Data & Communications","A punch-down tool is for:","Terminating wires on blocks","Punch-down tools terminate on 66/110 blocks."],["QB-00528","Data & Communications","A stud finder locates:","Framing behind walls","Stud finders find framing."],["QB-00529","Data & Communications","A voltage tester verifies:","Presence or absence of voltage","Voltage testers detect live circuits."],["QB-00530","Data & Communications","AAA Smart Security is a division of which larger company?","AAA Mountain West Group (MWG)","AAA Smart Security is part of AAA Mountain West Group (MWG)."],["QB-00531","Data & Communications","Auger bits provide:","Clean holes with chip removal","Auger bits bore clean holes with good chip removal."],["QB-00532","Data & Communications","Cat5e bandwidth:","100 MHz",""],["QB-00533","Data & Communications","Cat6 bandwidth:","250 MHz",""],["QB-00534","Data & Communications","Cat6a bandwidth:","500 MHz",""],["QB-00535","Data & Communications","Cat6a supports 10GbE to:","100m",""],["QB-00536","Data & Communications","Certification tester provides:","Both",""],["QB-00537","Data & Communications","Communication & Transmission Systems","How often must a Digital Alarm Communicator Transmitter (DACT) complete a testing signal transmission sequence?","B"],["QB-00538","Data & Communications","Crimp tool for:","RJ45 plugs",""],["QB-00539","Data & Communications","Crimping tools:","Attach connectors to cables","Crimpers attach terminals and connectors."],["QB-00540","Data & Communications","Crossover cable uses:","Different standards each end",""],["QB-00541","Data & Communications","Flashlights are essential for:","Working in dark spaces","Good lighting is safety essential."],["QB-00542","Data & Communications","Fusion splice loss typical:","0.02 dB",""],["QB-00543","Data & Communications","Glow rods are:","Flexible rods for pushing wire","Glow rods push cables through spaces."],["QB-00544","Data & Communications","Hammer drills are for:","Concrete and masonry","Hammer drills work in concrete and masonry."],["QB-00546","Data & Communications","IDF stands for:","Intermediate Distribution Frame",""],["QB-00547","Data & Communications","Impact drivers are best for:","High-torque fastener driving","Impact drivers provide high torque for fasteners."],["QB-00548","Data & Communications","LC connector advantage:","Both",""],["QB-00549","Data & Communications","MDF stands for:","Main Distribution Frame",""],["QB-00550","Data & Communications","Max untwist at termination:","0.5 inch",""],["QB-00551","Data & Communications","Mechanical splice loss typical:","0.1-0.5 dB",""],["QB-00552","Data & Communications","NEXT stands for:","Near End Crosstalk",""],["QB-00553","Data & Communications","Non-contact voltage testers:","Detect voltage without contact","Non-contact testers detect through insulation."],["QB-00554","Data & Communications","OM3 fiber jacket color:","Aqua",""],["QB-00555","Data & Communications","OS2 fiber jacket color:","Yellow",""],["QB-00556","Data & Communications","OTDR tests:","Fiber",""],["QB-00557","Data & Communications","Oscillating multi-tools can:","Cut, sand, scrape, and more","Multi-tools perform various tasks."],["QB-00559","Data & Communications","Personal tool organization:","Improves efficiency and professionalism","Organization improves efficiency."],["QB-00560","Data & Communications","Plenum cable required in:","Air handling spaces",""],["QB-00561","Data & Communications","Punch down tool for:","110 blocks",""],["QB-00562","Data & Communications","Reciprocating saws are used for:","Rough cutting and demolition","Recip saws make rough cuts."],["QB-00563","Data & Communications","Riser cable required for:","Floor to floor penetration",""],["QB-00564","Data & Communications","Rotary hammers provide:","More power than hammer drills for concrete","Rotary hammers are more powerful for concrete."],["QB-00565","Data & Communications","SC connector style:","Push-pull",""],["QB-00566","Data & Communications","ST connector style:","Bayonet",""],["QB-00567","Data & Communications","Self-feed bits are used for:","Large holes for cable routing","Self-feed bits make large cable routing holes."],["QB-00568","Data & Communications","Single mode core size:","8-9 micron",""],["QB-00569","Data & Communications","Spade bits are for:","Fast rough holes in wood","Spade bits drill quick holes in wood."],["QB-00570","Data & Communications","Straight-through cable uses:","Same standard both ends",""],["QB-00571","Data & Communications","T568A vs T568B difference:","Orange and green swapped",""],["QB-00572","Data & Communications","T568B pin 1 color:","White/Orange","Orange/white on pin 1."],["QB-00573","Data & Communications","T568B pin 3 color:","White/Green",""],["QB-00574","Data & Communications","TDR measures:","Both length and faults",""],["QB-00575","Data & Communications","TIA-568 defines:","Cabling standards",""],["QB-00576","Data & Communications","TIA-569 defines:","Pathways and spaces",""],["QB-00577","Data & Communications","TIA-607 defines:","Grounding/bonding",""],["QB-00578","Data & Communications","Tape measures should be:","Accurate and properly maintained","Accurate measurements are essential."],["QB-00579","Data & Communications","Tone generator used for:","Cable tracing",""],["QB-00580","Data & Communications","Tone generators help:","Trace and identify wires","Tone generators identify wire paths."],["QB-00583","Data & Communications","VFL in fiber means:","Visual Fault Locator",""],["QB-00584","Data & Communications","What are the three Member Experience Principles?","Authentically Connect, Amaze, Appreciate","The three principles: Authentically Connect, Amaze, Appreciate."],["QB-00585","Data & Communications","What does 'Amaze' mean in member experience?","Exceed expectations and WOW with service","Amaze means exceeding expectations with service that goes above and beyond."],["QB-00586","Data & Communications","What does 'Appreciate' mean in member interactions?","Thank members for their business and loyalty every time","Appreciate means thanking members for their business and loyalty at every interaction."],["QB-00587","Data & Communications","What does 'Authentically Connect' mean in the AAA context?","Connect with members at a personal level first, then engage about services","Authentically Connect means personal connection before business engagement."],["QB-00588","Data & Communications","What does the AAA Smart Security 'Members First' philosophy emphasize?","Centering everything around member experience","Members First philosophy centers all activities around member experience."],["QB-00590","Data & Communications","Wire strippers remove:","Insulation from conductors","Strippers remove insulation cleanly."],["QB-00592","Data & Communications","Dealer portal primary purpose?","Inventory",""],["QB-00593","Data & Communications","Check camera firmware from portal?","Member app only",""],["QB-00594","Data & Communications","Signal strength history shows?","Nothing useful",""],["QB-00598","Data & Communications","Re-provision camera remotely?","Only with phone",""],["QB-00599","Data & Communications","Dealer vs customer app?","Dealer is view-only",""],["QB-00603","Data & Communications","Image sensor vs camera?","Camera outdoor only",""],["QB-00604","Data & Communications","Motion alerts but empty clips?","Sensitivity too high",""],["QB-00608","Data & Communications","Remote panel reboot — when?","Only firmware",""],["QB-00612","Data & Communications","What storage options are available for the CSVR?","2TB, 3TB, 6TB, or 12TB (two hard drive bays, up to 8TB each)","Two HD bays supporting up to 16TB total. Bundles include 3TB or 6TB configurations."],["QB-00613","Data & Communications","What local viewing outputs does the CSVR have?","HDMI and VGA with 1080p/4K display, USB mouse control","HDMI and VGA outputs for local monitor viewing. USB mouse included for playback control."],["QB-00614","Data & Communications","Why does the CSVR matter when internet goes down?","Records locally — footage survives internet outages completely","Cloud-only cameras lose all recording during outages. CSVR keeps recording 24/7 regardless."],["QB-00615","Data & Communications","What playback speeds does the CSVR support?","1x, 4x, and 8x playback speed","Fast-forward at 4x or 8x to quickly scrub through footage and find incidents."],["QB-00616","Detection Devices","A closed valve should generate:","Supervisory signal","Closed valve generates supervisory signal."],["QB-00618","Detection Devices","CO concentration is measured in:","Parts per million (ppm)","Carbon monoxide concentration is measured in ppm."],["QB-00619","Detection Devices","CO detectors are required in:","Buildings with fuel-burning appliances","CO detectors are required where fuel-burning equipment exists."],["QB-00620","Detection Devices","Catalytic bead sensors detect:","Combustible gases","Catalytic bead sensors detect combustible gases."],["QB-00621","Detection Devices","Combination CO/smoke detectors:","Detect both hazards in one unit","Combination units detect both CO and smoke."],["QB-00622","Detection Devices","Detection & Monitoring Devices","What causes a signal in a water level monitoring device?","B"],["QB-00623","Detection Devices","Electrochemical sensors detect:","Toxic gases like CO","Electrochemical sensors detect specific toxic gases."],["QB-00624","Detection Devices","Flame detectors sense:","Radiant energy from flames","Flame detectors sense infrared or ultraviolet radiation."],["QB-00625","Detection Devices","Gas detection systems monitor for:","Combustible or toxic gases","Gas detection monitors for hazardous gases."],["QB-00626","Detection Devices","Gate valves are also called:","OS&Y valves","OS&Y (Outside Screw and Yoke) is a type of gate valve."],["QB-00627","Detection Devices","How often must a Digital Alarm Communicator Transmitter (DACT) complete a testing signal transmission sequence?","Weekly","DACTs must complete test transmissions at least once every 7 days (weekly)."],["QB-00629","Detection Devices","IR flame detectors respond to:","Infrared radiation","IR detectors respond to infrared radiation from flames."],["QB-00631","Detection Devices","Infrared gas detection:","Measures absorption of IR light by gas","IR gas detection measures absorption of infrared light."],["QB-00632","Detection Devices","LEL stands for:","Lower Explosive Limit","LEL is Lower Explosive Limit for combustible gases."],["QB-00634","Detection Devices","Low temperature alarm threshold is typically:","40°F","Low temp alarms typically activate at 40°F."],["QB-00635","Detection Devices","Multi-spectrum flame detectors:","Analyze multiple wavelengths to reduce false alarms","Multi-spectrum detectors analyze multiple wavelengths for accuracy."],["QB-00636","Detection Devices","PIV stands for:","Post Indicator Valve","PIV is Post Indicator Valve for outside control valves."],["QB-00637","Detection Devices","Spark/ember detectors are used in:","Industrial duct systems","Spark detectors monitor ducts in industrial applications."],["QB-00638","Detection Devices","Tamper switches monitor:","Valve position","Tamper switches monitor valve open/closed position."],["QB-00640","Detection Devices","UV flame detectors respond to:","Ultraviolet radiation","UV detectors respond to ultraviolet radiation from flames."],["QB-00641","Detection Devices","Valve supervisory switches are:","Normally closed with valve open","Switch is normally closed when valve is fully open."],["QB-00642","Detection Devices","Video analytics can detect:","Smoke and flame through image analysis","Video analytics analyze camera images for smoke/flame patterns."],["QB-00643","Detection Devices","Water level supervisory devices monitor:","Water storage tank levels","Water level switches monitor storage tank levels."],["QB-00645","Detection Devices","Waterflow switches have a retard to:","Prevent false alarms from surges","Retard delay prevents false alarms from pressure surges."],["QB-00646","Detection Devices","What causes a signal in a water level monitoring device?","Pressure change of ±10 psi","Water level monitoring devices signal on pressure changes of ±10 psi."],["QB-00649","Detection Devices","What is a 'rate-of-rise' heat detector?","One that activates when temperature increases rapidly (12-15°F per minute)","Rate-of-rise detectors activate when temperature increases 12-15°F per minute, detecting fires before fixed-temperature thresholds are reached."],["QB-00650","Detection Devices","What is the best way to protect an outside air duct opening?","Place a heat detector nearby","Heat detectors near outside air duct openings protect against fire entering the HVAC system."],["QB-00651","Detection Devices","What is the difference between a fixed-temperature heat detector and a rate-of-rise heat detector?","Fixed-temperature detectors activate at a specific temperature, while rate-of-rise detectors respond to rapid temperature increases","Fixed-temp activates at set temp (typically 135°F/57°C); rate-of-rise responds to rapid temp increases (12-15°F/min)."],["QB-00652","Detection Devices","What is the primary function of a duct smoke detector?","Detect smoke in HVAC systems","Duct detectors monitor smoke in HVAC/air handling systems."],["QB-00654","Detection Devices","What is the primary purpose of a heat detector?","Detect temperature changes","Heat detectors respond to temperature changes, either fixed temp or rate-of-rise."],["QB-00655","Detection Devices","What is the primary purpose of duct detectors, and can they replace room smoke detectors?","Do not substitute for room smoke detectors","Duct detectors do NOT substitute for room smoke detectors; they serve different purposes."],["QB-00656","Detection Devices","What is the purpose of a carbon monoxide detector?","Detect carbon monoxide gas","CO detectors specifically detect the presence of carbon monoxide gas."],["QB-00657","Detection Devices","What is the purpose of a flame detector?","Detect flames","Flame detectors sense radiant energy from flames."],["QB-00660","Detection Devices","What is the required response time for switching a spare DACR into place after a failure?","30 seconds","Spare DACRs must switch into service within 30 seconds of a failure."],["QB-00661","Detection Devices","What is the required testing frequency for carbon monoxide detectors in residential buildings?","Annually","CO detectors should be tested annually."],["QB-00662","Detection Devices","What is the required testing frequency for flame detectors in industrial facilities?","Annually","Flame detectors must be tested annually."],["QB-00663","Detection Devices","What is the response time requirement for waterflow alarm devices?","90 seconds","Waterflow alarm devices must activate within 90 seconds of flow."],["QB-00664","Detection Devices","What type of detector is best for detecting fast-flaming fires?","Ionization smoke detector","Ionization smoke detectors respond quickly to fast-flaming fires that produce small smoke particles."],["QB-00665","Detection Devices","Which statement is correct concerning duct detectors?","Duct detectors do not substitute for room smoke detectors","Duct detectors cannot substitute for room smoke detectors."],["QB-00671","Sales Training","Elderly overwhelmed. Teach how many?","2 max",""],["QB-00673","Sales Training","Member offers food/drink?","Always refuse",""],["QB-00675","Sales Training","'Last company was better.' Response?","'What did they do well? I want to meet that standard.'",""],["QB-00678","Sales Training","Tech member gives wrong diagnosis. Redirect?","'Good thinking. Let me verify — I'm also seeing...'",""],["QB-01256","General","A NEMA 4X enclosure is rated for:","Watertight and corrosion resistant","NEMA 4X provides watertight and corrosion-resistant protection."],["QB-01257","General","A _______ circuit controls another through a relay.","Remote-control","Remote-control circuits control other circuits through relays."],["QB-01258","General","A normally closed (NC) contact will:","Send alarm when opened","NC contacts are closed when door closed, open when door opened."],["QB-01260","General","Difference between a feature and a benefit:","Features describe product, benefits describe value to customer","Features are product characteristics; benefits explain how features help the customer."],["QB-01261","General","Door contacts use what type of technology?","Magnetic reed switch","Door contacts use magnets and reed switches."],["QB-01262","General","EMT fittings shall be:","Compression or set-screw type","EMT uses compression or set-screw fittings."],["QB-01263","General","Equipment that is 'Listed' has been:","Evaluated by a testing laboratory","Listed equipment has been evaluated by testing laboratory."],["QB-01264","General","For copper conductors, the K factor is approximately:","12.9","Copper K factor approximately 12.9 at 75°C."],["QB-01266","General","Mirroring in sales refers to:","Matching customer communication style","Mirroring means adapting your communication style to match the customer's."],["QB-01271","General","Open-ended questions are used to:","Encourage detailed customer responses","Open-ended questions encourage detailed responses and uncover needs."],["QB-01272","General","Phase I elevator recall is initiated by:","Smoke detector in lobby or machine room","Phase I recall initiated by smoke detection in lobby or machine room."],["QB-01273","General","Primary advantage of addressable fire alarm systems?","Point identification","Addressable systems provide exact point identification."],["QB-01274","General","Question","Correct Answer",""],["QB-01275","General","Readily accessible means:","Reached quickly without climbing or moving obstacles","Readily accessible means reached quickly without obstacles."],["QB-01276","General","Smoke detector sensitivity testing required:","Within 1 year of install and every 2 years after","Sensitivity testing within first year, then every 2 years."],["QB-01278","General","What communication path do most alarm systems use as primary?","Cellular or IP internet","Modern systems use cellular or IP as primary communication paths."],["QB-01279","General","What does 'OL' mean on a multimeter when measuring resistance?","Open Loop/Open circuit (infinite resistance)","OL = Open Loop, meaning no continuity or infinite resistance."],["QB-01280","General","What does a multimeter measure?","Voltage, current, and resistance","Multimeters measure voltage, current (amps), and resistance (ohms)."],["QB-01281","General","What does it mean that AAA chose you?","AAA hand-picked professionals to carry the industry standard forward","SSU Introduction Ch5"],["QB-01282","General","What happens if supervision signals stop arriving at central station?","A trouble/failure signal is generated","Missing supervision signals indicate communication failure."],["QB-01283","General","What is Central Station monitoring?","Professional 24/7 monitoring service that dispatches authorities","Central Station provides 24/7 professional monitoring and dispatch."],["QB-01284","General","What is Contact ID format?","Ademco's standardized alarm reporting protocol","Contact ID is Ademco's standard protocol for alarm reporting."],["QB-01285","General","What is SIA format?","Security Industry Association standardized alarm signal format","SIA format is the standard for alarm signal communication."],["QB-01286","General","What is a PoE Switch used for?","- A PoE Switch distributes power and data connections to multiple PoE cameras.",""],["QB-01287","General","What is a communicator in an alarm system?","Device that transmits signals to the monitoring center","Communicators transmit alarm and status signals to central station."],["QB-01288","General","What is a tone generator used for?","Tracing wires through walls/ceilings","Tone generators help trace and identify wires."],["QB-01289","General","What is supervision in alarm communication?","Regular check-in signals to verify communication path","Supervision = periodic signals verifying the communication link works."],["QB-01290","General","What is the Ethernet Connector Card for IQ4?","- The Ethernet Connector Card enables wired Ethernet connectivity on the IQ4 345 Panel.",""],["QB-01291","General","What is the most important skill in professional sales?","Active listening","Active listening allows you to understand customer needs and build rapport."],["QB-01292","General","What setting measures AC voltage on a multimeter?","Acv or v~","ACV or V~ (with wavy line) measures AC voltage."],["QB-01293","General","What setting measures DC voltage?","Dcv or v⎓","DCV or V⎓ (with straight line) measures DC voltage."],["QB-01294","General","What setting measures resistance?","Ω (Ohms)","Ω (Ohms) setting measures resistance."],["QB-01295","General","What tool is used with a tone generator?","Amplifier probe (toner probe)","An amplifier/inductive probe detects the tone on wires."],["QB-01296","General","What tool tests network cables?","Cable tester/certifier","Cable testers verify network cable wiring and performance."],["QB-01300","Install Protocol","Service loop at camera head?","12-18 inches",""],["QB-01301","Install Protocol","IR reflection off eave at night?","White-out / glare",""],["QB-01302","Install Protocol","Doorbell camera height?","48 inches (4ft) center",""],["QB-01304","Install Protocol","After terminating RJ45, must:","Assume good",""],["QB-01306","Install Protocol","Multi-camera: cable labeling?","Camera end only",""],["QB-01319","Install Protocol","A job hits all three PM escalation triggers. What happens at C-PM and what is PM-01?","C-pm advances the job to pm — PM-01 is weekly jobs meeting monitoring — Pm owns the job from here","Sop-coord-003 / c-pm / PM-01"],["QB-01321","Install Protocol","A long-time AAA member opens the door looking skeptical about home security. Opening line?","Lead with the connection: 'you've trusted AAA on the road — We're here to bring the same protection into your home.' earned trust is your head start. Use it.","Brand leverage"],["QB-01322","Install Protocol","A member becomes agitated during a long install. Best approach?","Acknowledge the time impact. Give them a clear ETA for completion. If possible, let them return to their routine while you work in another area. Visible progress reduces frustration.","Frustration management"],["QB-01323","Install Protocol","A member calls in six months after install and says their system has been working perfectly. What does CW say?","'that's exactly what we built it to do. If anything changes — Any alert, any question — Call us. We're the same people who installed it.' reinforce the relationship. AAA is long-term.","Long-term relationship"],["QB-01324","Install Protocol","A member calls while their commercial job is in Pending Parts status asking why install is not scheduled. What is the correct response and what SLA applies?","Notify member of pending parts status — Commit to scheduling within 48HR of warehouse confirmation — Same-day parts email SLA applies","SLA Matrix / Same-Day Parts Email / Path B"],["QB-01325","Install Protocol","A member is frustrated before you even start — their last alarm company left a mess and didn't finish. First response?","'that shouldn't have happened. I'm going to show you a completely different experience today.' then stop talking and start delivering. Don't defend — Demonstrate.","Trust recovery"],["QB-01326","Install Protocol","A member is upset about a billing issue unrelated to your install. How do you handle it?","Acknowledge their frustration, don't dismiss it. Provide the correct contact (member services/billing). Don't try to resolve billing issues in the field — Document the complaint and escalate to coordinator.","Scope management"],["QB-01327","Install Protocol","A member keeps comparing CW's install price to what their neighbor paid. CW says:","CW doesn't get into price negotiations in the field. 'every install is priced per your specific configuration. For billing questions, here's the direct contact.' then refocus on the install.","Price deflection protocol"],["QB-01328","Install Protocol","A member on a service call says 'This is the third time this has happened.' What is your first response?","'I hear you — That shouldn't have happened once, let alone three times. Walk me through what you've experienced.' then actually fix it. Acknowledge first, action second.","Empathy-then-action"],["QB-01329","Install Protocol","A member opens the door and immediately says 'I don't want to be sold anything extra.' CW's response:","'that's not why I'm here. I'm here to install what's on your work order and make sure it's working perfectly before I leave.' acknowledge the concern, then demonstrate the standard.","De-escalation on entry"],["QB-01330","Install Protocol","A member questions whether monitoring is worth the monthly cost. What do you say?","Ground it in their specific situation — Walk through what monitoring means for their household (travel frequency, kids home alone, neighborhood history). Connect value to their reality, not a features list.","Value personalization"],["QB-01331","Install Protocol","A member refuses to let you proceed after a specific sensor placement discussion. What do you do?","Respect the decision. Document it clearly in the WO: 'member declined [sensor] at [location] — Verbal confirmation.' have them acknowledge. Proceed with what they agreed to.","Consent documentation"],["QB-01332","Install Protocol","A new tech says a member 'keeps asking questions' and is slowing down the install. CW's response?","'the questions are the install. A member who understands their system trusts it. Slow down and answer every one.' member engagement is not an obstacle — It's the outcome.","Questions = engagement"],["QB-01335","Install Protocol","A residential tech finds extra scope on-site. The member then refuses to sign the Change Order. What two STOPCAPs apply in sequence?","SC-8 first for scope detection, then SC-5 if the member refuses the change order","SC-5 / SC-8 / D-04"],["QB-01336","Install Protocol","A sensor shows 'tamper' in the Alarm.com app after install. What does this mean and what do you check?","The sensor cover isn't fully closed or the tamper switch is engaged. Physical check first — Reseat the cover. Then verify tamper supervision is programmed correctly per panel spec.","Tamper supervision"],["QB-01337","Install Protocol","A tech arrives at an install and finds the address already has an active Alarm.com account. What is the first step?","Stop and contact coordinator to verify — Resolve in FSL first","Sop-coord-001"],["QB-01338","Install Protocol","A tech consistently scoring below 70% on Technical drills should:","Run the drill set again immediately. Identify the specific category of failure. Request peer review from a certified L3+ tech. Do not advance to unsupervised field installs until achieving 85%+ across all technical categories.","Performance remediation"],["QB-01339","Install Protocol","A tech is on site and discovers the job scope is beyond what was quoted. What is the correct process?","Stop — SC-8 triggers — Pm issues CO in docusign 24-48HR","SC-8"],["QB-01341","Install Protocol","A warehouse rep tells the coordinator a part is \"probably in the back\" without checking Rootstock. What is the correct action?","Require physical Rootstock verification — verbal estimates do not satisfy C-03 — assumptions at this stage create downstream SC-3 and CC risk","Require the warehouse rep to physically verify in Rootstock before the BOM is marked validated. A verbal estimate does not satisfy C-03. If the part turns out to be missing after the job is RTS it creates an SC-3 and potentially a CC at C-14 — both avoidable by enforcing the no-assumptions rule."],["QB-01342","Install Protocol","A zone fails during the final test and you can't resolve it same-day. What do you do?","It's a STOPCAP. Do not close the job. Document the failure, notify TL, do not leave the member with an untested zone. Workarounds that leave gaps are not acceptable.","Stopcap / integrity"],["QB-01343","Install Protocol","After a CC is logged and the TL is notified same-day, what decision node determines the go-back path?","The parts required node — Yes triggers ordering, no goes straight to 48-HR reschedule","SOP-SVC-002 / Go-Back Path"],["QB-01345","Install Protocol","After creating the Alarm.com account on-site, what must the tech immediately update?","Salesforce FSL work order with account number and status","Sop-admin-001"],["QB-01346","Install Protocol","Are these retail bundles for residential or commercial use?","Small business / commercial only — Not residential yet","Small business commercial only. Residential bundles are coming but NOT available yet."],["QB-01347","Install Protocol","As-built documentation shows:","Actual installed conditions and locations","As-builts record actual installation."],["QB-01348","Install Protocol","At C-03 warehouse validates the BOM. What are the ONLY two possible outcomes?","Path a all on hand to rts or path b parts to order to pending parts — No partial outcomes","Sop-coord-002 / C-03 / bom outcomes"],["QB-01350","Install Protocol","At D-04 the tech determines the job cannot be completed. What is the IMMEDIATE first action — before calling anyone?","Log cc in salesforce FSL immediately on-site — TL notified same day — 2-HOUR TL review window before ops director escalation","SC-1 / sop-svc-001 / D-04"],["QB-01351","Install Protocol","BOM stands for what and why does the PPTX say warehouse makes NO ASSUMPTIONS at C-03?","Bill of materials — Pulled from sf/rootstock — Physical check of every item against live inventory — No estimates or prior counts","SOP-COORD-002 / C-03 / BOM Definition"],["QB-01352","Install Protocol","Before cutting into any wall, you should:","Check for utilities and obstructions","Check for electrical, plumbing, and other utilities before cutting."],["QB-01353","Install Protocol","Before drilling into walls, check for:","Utilities, studs, and fire blocking","Check for utilities and structural elements before drilling."],["QB-01354","Install Protocol","CW finishes an install and the system passes all tests. Member says 'Just leave the instructions, I'll read them later.' CW says:","'this will take 3 minutes. I want to make sure you're comfortable before I leave.' walk through arm/disarm and live video. Have them do it once. Leave knowing they can use it.","3-minute rule"],["QB-01355","Install Protocol","CW is 45 minutes into an install and the member keeps hovering and asking questions. CW:","Welcomes every question. 'the questions are the install.' a member who understands their system trusts it and doesn't call support. Slow down, answer fully, then continue.","Member engagement = trust"],["QB-01357","Install Protocol","CW is writing a member email about a service delay. First sentence:","'I want to make sure your security is back on track and that you feel completely taken care of.' lead with the member. Close as a human. Safe. Secure. Fast — In that order.","Member-first email"],["QB-01358","Install Protocol","Cable staples should be:","Snug without crushing insulation","Staples snug but not crushing cable."],["QB-01359","Install Protocol","Cable ties should be:","Snug without damaging cables","Tie snug without crushing or damaging cable."],["QB-01360","Install Protocol","Can existing wire from a previous camera installation be reused?","Yes, in some cases","Existing low-voltage wire from previous installations can sometimes be reused, saving labor and cost."],["QB-01361","Install Protocol","Can you add equipment to bundles without approval?","No — Reach out for approval first","Do NOT add equipment without approval from leadership. Sell the approved bundles as-is."],["QB-01362","Install Protocol","Can you create custom home quotes from these bundles?","No custom home quotes at this time","No custom home quotes. If someone needs residential, that's a separate program."],["QB-01363","Install Protocol","Can you submit billing on a job with an open stopcap?","No. Billing is held until all STOPCAP conditions are cleared and QA has approved. Submitting billing on an open STOPCAP is a compliance violation.","Billing hold on stopcap"],["QB-01364","Install Protocol","Cleanup after installation includes:","Removing debris and restoring area","Clean up and restore work area."],["QB-01365","Install Protocol","Close-out at R-13: the Team Lead QA walkthrough is MANDATORY with NO EXCEPTIONS. What does it include?","TL personally walks the job — Fulcrum app — Captures camera angles, zones, panel programming — TL signs off before close","R-13 / Residential Close-Out Requirements"],["QB-01366","Install Protocol","Conduit bodies provide:","Access for pulling and direction changes","Conduit bodies allow wire pulling and direction changes."],["QB-01367","Install Protocol","Customer walk-through should cover:","System operation, codes, and maintenance","Walk-through covers operation and user responsibilities."],["QB-01368","Install Protocol","D-01 checks for deposit AND SOW. A job has the deposit confirmed but no signed SOW. What happens?","Job cannot advance — D-01 requires both — Routes to retention team","Sop-coord-001 / D-01"],["QB-01369","Install Protocol","D-01 requires two things before a residential job advances. What are they and what happens on the NO branch?","Both deposit and signed sow — No branch routes to retention team","Sop-coord-001 / D-01"],["QB-01370","Install Protocol","D-02 asks Pre-Install Cancel? A member calls morning-of to cancel. What STOPCAP activates and what is the time requirement?","SC-2 — Coordinator plus cors — Retention routing within 15 minutes","SC-2 / D-02"],["QB-01371","Install Protocol","Do PoE cameras need a separate power outlet at the camera location?","No — POE provides power through the cable","No power outlet needed — PoE delivers power through the Ethernet cable itself."],["QB-01372","Install Protocol","Documentation","What must be documented in the work order before submission?","L1"],["QB-01373","Install Protocol","During a PM Track install the tech discovers additional scope not in the SOW. Who can authorize the extra work?","Pm only — Tech detects, res ops/TL confirms, pm issues CO in docusign 24-48HR — Nobody else has authority","SC-8 / PM Track / CO Authority"],["QB-01374","Install Protocol","During the app walkthrough the member says 'I'll figure it out later.' What do you do?","'this will take 3 minutes and will save you a call to support at 11 pm.' walk them through arm/disarm and live video once, have them do it once. Don't accept 'later' — The callback cost is yours.","Ownership of member competence"],["QB-01375","Install Protocol","For SC-8 (Scope Outside SOW), who detects it and who resolves it?","Pro detects — Res ops/TL confirms — Pm issues CO in docusign 24-48HR","SC-8"],["QB-01376","Install Protocol","From R-01 New Job Sold to R-16 Billing Advance with no go-backs or scope issues — how many named process steps does the residential track have?","16 steps — R-01 through R-16 — Every node has an owner and SLA","SOP-COORD-001 / Full Residential Track"],["QB-01377","Install Protocol","How do you frame Smart Security to a member who already has AAA roadside?","'just like ERS has been your safety net on the road for years, smart security extends that same protection into your home.' same trust, same standard, different address.","ERS-to-Home narrative"],["QB-01378","Install Protocol","How do you put a system into test mode via Alarm.com?","Log into dealer portal → locate account → system test → activate test mode (10–60 min window). This prevents live alarms from dispatching while you test zones. Always exit test mode after testing.","Test mode protocol"],["QB-01379","Install Protocol","How many total SOPs are in the current A3 Smart Home SOP Master Index?","20 sops","AAA SOP Master Index — March 2026"],["QB-01380","Install Protocol","How many total steps are in the install timeline?","11 steps","The install timeline has 11 steps from scope review through Member sign-off."],["QB-01382","Install Protocol","In the A3 RACI, who is Accountable for Vehicle Stock Levels?","Residential ops (a) — Warehouse/purchasing is responsible","RACI — Fleet Management: Vehicle Stock Levels"],["QB-01383","Install Protocol","In the Go-Back Clock SLA, who is Responsible during the 0-2 hour window?","Resi/comm pro (0-2HR) + residential ops/TL (0-2HR)","SLA Matrix — 48-Hr Go-Back Clock"],["QB-01384","Install Protocol","In the context of new product rollouts, who is Accountable?","Resi/comm ops, residential ops, warehouse, and sales team all hold a","RACI — Inventory: New Product Rollout"],["QB-01385","Install Protocol","In the go-back path, what decision node determines whether parts need to be ordered before rescheduling?","The parts required decision node — Yes triggers rootstock order, no goes to direct 48-HR reschedule","SOP-SVC-002 / Go-Back Parts Path"],["QB-01387","Install Protocol","It is Day 28 and a customer deposit has not been processed. What should happen?","Coordinator + sales + cors must process immediately — Day 30 is hard cancel (SC-6)","SC-6 / SLA Matrix"],["QB-01388","Install Protocol","J-hooks are used to:","Support cable bundles","J-hooks support cable runs."],["QB-01389","Install Protocol","Knockout seals are used to:","Close unused openings in enclosures","Knockout seals close unused holes."],["QB-01390","Install Protocol","Labeling wires helps with:","Future troubleshooting and maintenance","Labels aid future service and troubleshooting."],["QB-01392","Install Protocol","Low voltage wire should maintain what distance from high voltage wiring?","2 inches","Maintain 2-inch separation or use appropriate barriers between low and high voltage."],["QB-01393","Install Protocol","Maximum mounting height for wall-mounted smoke detectors is:","12 inches from ceiling","Wall-mounted smoke detectors must be 4-12 inches from ceiling."],["QB-01394","Install Protocol","Member Handoff","How should you introduce the alarm.com app to the member?","L1"],["QB-01395","Install Protocol","Member at service call blames you for issues caused by their previous company — the \"false memory.\" What do you do?","Commit to making today different, walk through plan together","Skip the correction, go straight to commitment. Walk them through the plan. Over-communicate. Leave site cleaner than you found it."],["QB-01396","Install Protocol","Motion sensors should not be aimed toward:","Windows with direct sunlight","Direct sunlight can cause false alarms on PIR motion sensors."],["QB-01397","Install Protocol","On RJ31X connections, terminals 1 and 8 connect to:","Incoming phone line","Terminals 1 & 8 on RJ31X connect to the incoming telephone line."],["QB-01398","Install Protocol","On RJ31X connections, terminals 4 and 5 connect to:","House phones","Terminals 4 & 5 on RJ31X connect to house phone equipment."],["QB-01399","Install Protocol","On a multi-tech install, CW's partner wants to skip the full system test because 'the last 3 zones are obvious.' CW says:","'no skips. Every zone. We test all of them or we haven't tested the system.' zero exceptions. The 'obvious' zone is always the one that fails at 2 am.","Zero-skip rule"],["QB-01400","Install Protocol","On a service call you discover an installation issue from a prior technician. What do you do?","Fix it to standard. Document what you found and what you corrected in the service notes. Notify TL. Do not leave a member with a substandard system because it wasn't your original install.","Own the outcome"],["QB-01401","Install Protocol","Panel Install","What are the four requirements for a panel location?","L1"],["QB-01402","Install Protocol","Panel shows 'AC Loss' after install. What does this mean and what do you check?","Panel has lost AC power from the transformer. Check: 1) Transformer plugged in? 2) Outlet is not switch-controlled? 3) Breaker tripped? 4) Transformer outputting correct voltage? AC loss + battery only = limited backup time.","AC power troubleshooting"],["QB-01403","Install Protocol","Penetrations through fire barriers require:","Listed fire stopping materials","Fire barriers need listed fire stop materials."],["QB-01404","Install Protocol","Pre-Install","What is the first thing you do when you receive a work order for the day?","L1"],["QB-01405","Install Protocol","Professional installation reflects:","Quality workmanship and attention to detail","Professional work shows quality and care."],["QB-01406","Install Protocol","Proper tool use includes:","Right tool for the task, maintained properly","Use correct, well-maintained tools."],["QB-01407","Install Protocol","Property Walk","Why do you walk the property with the member before drilling?","L1"],["QB-01408","Install Protocol","Protective plates are required when:","Cable is within 1.25 inches of stud edge","Nail plates protect cables near stud edges."],["QB-01409","Install Protocol","R-03 places the job in the New Install Queue in Salesforce. What does this trigger for the Concierge?","It triggers R-04 concierge notified — The 24-HOUR member contact SLA clock starts now","Sop-coord-001 / R-03 / R-04"],["QB-01410","Install Protocol","R-05 says Member Contacted within 24hr. What EXACTLY must Concierge do to satisfy R-05?","Contact the member and book the install appointment — Both required within 24 hours","Sop-coord-001 / R-05 / 24-hr SLA"],["QB-01411","Install Protocol","R-16 is the 48-Hour Billing Advance. What is the hard gate that must be cleared before the Coordinator can trigger it?","QA and TL sign-off in fulcrum — This is the non-negotiable gate before billing advance","R-16 / SLA Matrix / Billing Advance Gate"],["QB-01412","Install Protocol","SC-5 triggers. What is happening and who must be notified?","Change order refused — Work pauses — Escalate ops director + sales director — Pm owns it","SC-5"],["QB-01414","Install Protocol","Self-drilling screws are for:","Metal studs without pre-drilling","Self-drilling (TEK) screws go into metal without pilot holes."],["QB-01415","Install Protocol","Should you ever sell the SEM Bundle?","No — Do not sell the sem bundle","Do NOT sell the SEM Bundle (Security Classic Enhancement Module). Period."],["QB-01416","Install Protocol","Silicone should be used:","Sparingly where weatherproofing is needed","Use silicone sparingly for weatherproofing."],["QB-01417","Install Protocol","Smoke detectors on a 4-wire system are wired in:","Parallel","4-wire smoke detectors are wired in parallel on separate power and signal circuits."],["QB-01418","Install Protocol","Staple spacing for low voltage is typically:","Every 4-6 feet and within 12 inches of boxes","Support cable at regular intervals and near terminations."],["QB-01419","Install Protocol","Step R-01 is the entry point to the Residential Track. What is it and who triggers it?","Pm or sales initiates new job sold — This is R-01 and the absolute entry point","Sop-coord-001 / R-01"],["QB-01420","Install Protocol","Stud finders help locate:","Structural framing members","Stud finders locate wood or metal framing."],["QB-01421","Install Protocol","System Test","What does 'full system test' mean before closing the job?","L1"],["QB-01422","Install Protocol","Tapcon screws are used for:","Concrete and masonry","Tapcons anchor into concrete and masonry."],["QB-01423","Install Protocol","Testing should occur:","During and after installation","Test throughout installation and at completion."],["QB-01425","Install Protocol","The Fulcrum close-out form captures three specific items at every job. What are they?","Camera angles, zones, and panel programming — All three required","Residential Close-Out / R-13 / Fulcrum"],["QB-01426","Install Protocol","The TL QA sign-off in Fulcrum happens at 3pm Tuesday. When must the billing advance be submitted?","Within 7 business days","SLA Matrix / R-16 / 48-Hr Billing Advance"],["QB-01427","Install Protocol","The commercial deposit deadline is 30 days. But the commercial track has an additional rule at Day 15. What is it?","Coordinator flags in sf at day 15 — Sales follow-up window — Pm hard cancels at day 30 without exception","Sop-coord-002 / C-02 / day 15 flag"],["QB-01428","Install Protocol","The proper way to strip wire insulation is:","Use proper wire strippers for the gauge","Use proper wire strippers to avoid nicking the conductor."],["QB-01429","Install Protocol","Toggle bolts are used for:","Hollow wall mounting of heavier items","Toggle bolts secure items to hollow walls."],["QB-01430","Install Protocol","Walk through Path A in the commercial flow from C-01 to the tech on-site. What are the key nodes?","C-01 sold → C-02 deposit → C-03 bom all on hand → rts → C-06A schedule → C-13 parts pickup → C-14 on-site","Sop-coord-002 / path a"],["QB-01431","Install Protocol","Weatherproof covers are required for:","Outdoor and wet location devices","Outdoor and wet locations need weatherproof covers."],["QB-01432","Install Protocol","What 6 things should be captured in the Scope of Work?","Location details, scope of work, member needs, site documentation, technical notes, AAA membership","Full scope: where devices go, what we're installing, why they want it, photos/maps, internet/power info, and AAA membership number."],["QB-01433","Install Protocol","What AAASHU tech proficiency levels exist in the certification system?","L1 through P5 — 5 distinct proficiency levels","Sop-train-002"],["QB-01434","Install Protocol","What SOP covers AAASHU Onboarding L1 Certification Path and how long is the program?","Sop-train-001 — 30-DAY, 9-ROLE program","Sop-train-001"],["QB-01435","Install Protocol","What SOP covers Residential Install Coordination and what version is it?","Sop-coord-001 V2.0","Sop-coord-001"],["QB-01437","Install Protocol","What SOP covers the Commercial Install Coordination track?","Sop-coord-002",""],["QB-01438","Install Protocol","What SOP covers the DSC PowerG PG9933 CO Detector?","Sop-svc-004",""],["QB-01439","Install Protocol","What SOP covers the Residential Install Cradle-to-Grave Standard?","Sop-inst-001",""],["QB-01440","Install Protocol","What Salesforce record type must exist before a job can be dispatched to a technician?","A service appointment linked to an active work order","Sop-admin-001"],["QB-01441","Install Protocol","What additional close-out requirements exist in the PM Track vs. standard commercial close-out?","TL QA in fulcrum plus pm scope sign-off plus multi-system integration testing if applicable — All before billing advance","SOP-COORD-003 / PM Track Close-Out"],["QB-01442","Install Protocol","What are the 6 territories Wayne Jordan oversees as National Director of Field Operations?","Az, ca, nv, ut, wy, mt",""],["QB-01445","Install Protocol","What are the three tracks in the A3 Install Coordination SOP system?","Residential (R-01→R-16), commercial (C-01→C-26), and pm track","Sop-coord-001 / sop-coord-002 / sop-coord-003"],["QB-01446","Install Protocol","What are you evaluating during the property walk?","Every entry point, motion zone, camera sightline, and signal strength considerations. You're building the final install plan with the member's input incorporated.","Installation planning"],["QB-01447","Install Protocol","What camera specification should you confirm before mounting?","Field of view, night vision capability, indoor/outdoor rating, and wireless vs. Wired connection type. Confirm sightline covers the intended coverage zone without obstruction.","Camera spec confirmation"],["QB-01448","Install Protocol","What can you do in the Alarm.com DEALER portal vs. the customer app?","Dealer portal: Remote diagnostics, system history, signal test, comm fail reset, account management, and zone configuration. Customer app: Arm/disarm, live video, activity log, notifications, automation.","Dealer vs. customer portal"],["QB-01451","Install Protocol","What does RACI stand for?","Responsible, accountable, consulted, informed","A3 RACI Matrix"],["QB-01452","Install Protocol","What does RTS stand for in the A3 coordination workflow?","Ready to schedule","Sop-coord-001"],["QB-01454","Install Protocol","What does 'member-first language' mean in written communication?","The member's experience, concern, or situation is the subject of the sentence — Not the company, the policy, or the procedure. The first sentence is everything. Set it with them in frame.","Member-first writing"],["QB-01455","Install Protocol","What does a PoE camera connect to at the other end of the cable?","A POE switch or CSVR","PoE cameras connect to a PoE switch or CSVR, which provides power and network connectivity."],["QB-01458","Install Protocol","What frame rate and resolution standard should outdoor cameras meet for forensic quality?","Minimum 1080P at 15 fps for outdoor identification quality. 4MP+ preferred for wide-angle coverage. Night vision should reach minimum 30 ft with IR illumination.","Camera quality threshold"],["QB-01459","Install Protocol","What happens to monitoring if the member's internet router goes offline?","System falls back to LTE cellular path — Monitoring continues uninterrupted. Both paths must be tested and confirmed at install. This is a key differentiator and selling point.","Dual-path redundancy"],["QB-01460","Install Protocol","What information about wire runs should be in the sales notes?","Estimated wire run distances and any difficult routing","Document estimated distances and routing difficulty — longer/harder runs affect labor time and install planning."],["QB-01461","Install Protocol","What information is required to create a new Alarm.com account during installation?","Name, address, phone/email, service plan, dealer code","Sop-inst-001"],["QB-01462","Install Protocol","What is STOPCAP SC-3 and how quickly must it be resolved?","Parts discrepancy — Same-day flag — Warehouse + purchasing + coordinator — Jobs held","SC-3"],["QB-01463","Install Protocol","What is geo-fencing in the context of Alarm.com?","Location-based automation using the member's smartphone — Automatically arms when they leave a defined radius and can disarm when they return. Set up in alarm.com app under automation > rules. Member must enable location permissions.","Geo-fence setup"],["QB-01464","Install Protocol","What is proper wire management?","Neatly secured, protected, and labeled","Wires should be neatly secured, protected in conduit when needed, and labeled."],["QB-01466","Install Protocol","What is the 24-Hour Member Contact SLA and who owns it?","Cors/QA (concierge) contacts member ≤24HR — Miss blocks install","SLA Matrix — 24-Hr Member Contact"],["QB-01467","Install Protocol","What is the COMM FAIL field response SLA post-install?","< 4 hours. If field response exceeds 4 hours — Dispatch override is triggered by the coordinator. A member with an unresolved comm fail is not protected.","Comm fail SLA"],["QB-01468","Install Protocol","What is the Day 15 commercial deposit flag and who owns the follow-up?","Coordinator flags in sf at day 15 — Alerts sales for deposit follow-up before day 30 hard cancel","Sop-coord-002 / C-02 / day 15 flag"],["QB-01469","Install Protocol","What is the Kick-Off Meeting in the PM Track and what must be resolved before install dates lock in FSL?","Pm-client meeting before any install — Confirms scope, timeline, site access, pre-construction — Dates in FSL only after","SOP-COORD-003 / PM Track Kick-Off"],["QB-01470","Install Protocol","What is the Qolsys IQ Panel and what problem does it solve?","Qolsys IQ panel (LTE cellular) is a cellular communicator built into supported panels, providing LTE/5G comm path independent of customer internet. Solves the single-path failure point — If the router dies, monitoring continues.","Qolsys IQ Panel function"],["QB-01471","Install Protocol","What is the SLA for returning a member callback (service request)?","< 24 hours. Over 48 hours triggers a compliance flag in the tracking system. Member calls about their security system are time-sensitive regardless of perceived urgency.","Callback SLA"],["QB-01472","Install Protocol","What is the SOP ID for the Residential Install Coordination track and what is its source document?","Sop-coord-001 V2.0 — Residential track — Source is the lucid flowchart","Sop-coord-001 v2.0"],["QB-01473","Install Protocol","What is the SOP for PoE Camera Install and Network Configuration?","Sop-inst-003",""],["QB-01474","Install Protocol","What is the SOP for the PM Coordination Track?","Sop-coord-003",""],["QB-01475","Install Protocol","What is the Same-Day Parts Email SLA?","Cors/coordinator must email member same day — Miss = cancel risk","SLA Matrix — Same-Day Parts Email"],["QB-01476","Install Protocol","What is the 'Maria on I-10' scenario and why is it used in SSU?","It illustrates the ERS encounter — Vulnerable member, professional response, trust reinforced. It's the archetype for smart security installs: A member trusting a professional with their safety. Same emotional stakes, different address.","Maria archetype"],["QB-01479","Install Protocol","What is the correct order of operations when testing zones?","1) Enter test mode via panel or alarm.com dealer portal first. 2) Trip each zone. 3) Confirm monitoring center signal receipt. 4) Exit test mode. 5) Document results in WO.","Test protocol sequence"],["QB-01480","Install Protocol","What is the correct sequence from D-01 passing to the tech arriving on-site in the Residential Track?","D-01 → queue → concierge → member contact and booking → schedule → cancel check → on-site","SOP-COORD-001 / Full Residential Sequence"],["QB-01481","Install Protocol","What is the difference between Perimeter and Interior zone types?","Perimeter zones are active in both away and stay arm modes (doors, windows). Interior zones are only active in away mode (motions inside the home). Incorrect zone types cause false alarms or unprotected areas.","Zone type definitions"],["QB-01482","Install Protocol","What is the field escalation ladder?","Tech → team lead → field coordinator → field ops director → national compliance lead. Do not skip levels for routine issues. Skip only when the standard demands it and document the reason.","Escalation ladder"],["QB-01483","Install Protocol","What is the first diagnostic step for a COMM FAIL immediately post-install?","Check LTE signal strength in panel diagnostics. Confirm antenna is connected. Verify SIM is seated correctly. Check alarm.com dealer portal for online/offline status. Run this sequence before replacing hardware.","COMM FAIL triage"],["QB-01484","Install Protocol","What is the first step in the sales process?","Finding the member's needs through discovery questions","Always start with discovery — understand what the Member needs before recommending a bundle."],["QB-01485","Install Protocol","What is the first system a tech must verify before creating a new Alarm.com account?","Salesforce FSL work order","Sop-inst-001 / sop-coord-001"],["QB-01486","Install Protocol","What is the first thing a technician should do before arriving at a job site?","Review the scope of work and sales notes","Step 1: Review scope of work and sales notes. Know what you're walking into before you walk in."],["QB-01487","Install Protocol","What is the full list of the 8 STOPCAP events?","SC-1 through SC-8 covering cc, pre-cancel, parts, no-show, CO refused, deposit, QA fail, scope outside sow","RACI / SLA matrix"],["QB-01488","Install Protocol","What is the function of the transformer in a typical alarm panel installation?","Powers the panel with AC from the building electrical system. Acts as primary power with battery backup taking over during power outages. Must be plugged into a dedicated non-switched outlet.","Panel power architecture"],["QB-01489","Install Protocol","What is the last step of every installation?","Walk the member through the app, arm/disarm, camera access — Get sign-off","Step 11: Walk the Member through everything and get their sign-off. Never leave without confirmation they understand the system."],["QB-01490","Install Protocol","What is the maximum PoE cable run length?","328 feet (100 meters)","Standard PoE max run is 328 feet (100 meters) for Cat5e/Cat6 cable."],["QB-01491","Install Protocol","What is the minimum LTE signal strength required at the panel location?","-95 dbm on cellular. Below that, use antenna extension or reposition panel. Log the reading in the work order.","Comm path quality"],["QB-01492","Install Protocol","What is the minimum cellular signal strength for a reliable comm path?","-95 dbm. Below -95 dbm requires antenna extension or panel relocation. Log the reading before and after any antenna adjustment. Do not close the job with marginal signal.","Signal threshold standard"],["QB-01494","Install Protocol","What is the recommended distance between smoke detectors and HVAC vents?","At least 3 feet","Smoke detectors should be at least 3 feet from HVAC vents."],["QB-01495","Install Protocol","What is the recommended mounting height for PIR motion detectors?","7-8 feet","PIR detectors are typically mounted at 7-8 feet for optimal coverage."],["QB-01496","Install Protocol","What is the single biggest operational difference between Residential and Commercial intake?","Bom validation by warehouse before rts — Every commercial job — Residential does not have this gate","SOP-COORD-002 / C-03 / BOM Validation"],["QB-01497","Install Protocol","What is the stopcap resolution path?","1) Identify the flag. 2) Document in WO notes. 3) Notify TL within 1 hour. 4) Hold billing until cleared. 5) TL escalates to coordinator if not resolved in 24 hours. 6) Log in compliance tracker.","Stopcap resolution sequence"],["QB-01499","Install Protocol","What must be documented when a member declines a recommended sensor placement?","Written in WO notes: 'member declined [sensor type] at [specific location] — Verbal acknowledgment on [date].' the member's informed refusal must be on record.","Decline documentation"],["QB-01500","Install Protocol","What must happen before a coordinator can schedule a job after it hits RTS status?","Job must be scheduled within 48 hours of rts — Hard SLA","SLA Matrix — 48-Hr Scheduling After RTS"],["QB-01501","Install Protocol","What must you test after mounting a camera before closing the WO?","Live feed in alarm.com app (member's phone), night vision activation, motion detection zone coverage, correct camera name in app, and recording/clip notification confirmation.","Camera commissioning checklist"],["QB-01502","Install Protocol","What review cycle do all 20 SOPs follow based on the Master Index?","6-MONTH review cycle — Staggered by effective date","AAA SOP Master Index — Review Date Column"],["QB-01503","Install Protocol","What should be done before drilling into any wall?","Check for wiring, plumbing, and studs","Always check for wiring, pipes, and structural elements before drilling."],["QB-01504","Install Protocol","What should be done before running any cable?","Site survey: Verify camera locations, wire paths, and panel placement","Always site survey first — verify the sales notes match reality before committing to any work."],["QB-01505","Install Protocol","What should you do if a business is too large for standard bundles?","Submit a lead form for custom design approach","Submit a lead form. Custom design handles larger businesses — don't force-fit a bundle."],["QB-01506","Install Protocol","What should you do if a larger business needs custom approach?","- For larger businesses needing custom approach, submit a lead form.",""],["QB-01507","Install Protocol","What should you do if the Member objects during closing?","- If the Member objects, be flexible — use discounts as leverage.",""],["QB-01508","Install Protocol","What should you do with unused wire conductors?","Cap and secure them properly","Unused conductors should be capped and secured to prevent shorts."],["QB-01509","Install Protocol","What size magnetic contact is appropriate for a steel door?","Wide-gap commercial","Steel doors require wide-gap contacts due to potential warping and larger gaps."],["QB-01510","Install Protocol","What systems are used in the Commercial Install Coordination SOP?","FSL and rootstock","Sop-coord-002"],["QB-01512","Install Protocol","What two communication paths must be tested and confirmed at every install?","1) LTE cellular (primary backup) — Confirm signal strength and monitoring center receipt. 2) IP/broadband (where available) — Confirm router connectivity and signal path. Both must be documented in the WO.","Dual-path requirement"],["QB-01513","Install Protocol","What two things does a PoE cable deliver to a camera?","Power supply and internet/data connection","PoE delivers both electrical power AND data through one Ethernet cable."],["QB-01514","Install Protocol","What type of cable is used for PoE camera wire runs?","CAT5E or CAT6 ethernet cable","Standard Cat5e or Cat6 Ethernet cable is used for PoE wire runs."],["QB-01515","Install Protocol","What zone type does a smoke detector use?","24-HOUR — It is always active regardless of arm state. Never programmed as perimeter or interior.","Life safety zones"],["QB-01516","Install Protocol","What zone type is used for glass break detectors?","Perimeter — Glass break is an immediate entry threat. Should be active in both away and stay arm modes. Some panels also support a separate 'perimeter instant' type — Check panel documentation.","Glass break zone type"],["QB-01517","Install Protocol","What zone type should a CO (carbon monoxide) detector be programmed as?","24-HOUR fire/CO — Always active, cannot be bypassed. CO is a life-safety device. Any other zone assignment is a critical error.","CO zone type"],["QB-01518","Install Protocol","When drilling through fire-rated walls, you must:","Seal penetrations with fire-rated material","Fire-rated wall penetrations must be sealed with approved fire-stopping material."],["QB-01519","Install Protocol","When installing a motion detector, what are the key placement rules?","Corner mount at 6-8 ft height for maximum coverage. Avoid direct sunlight, HVAC vents, and pets' main movement paths (if pet-immune). Confirm coverage arc matches the zone requirement.","Motion placement"],["QB-01520","Install Protocol","When mounting devices on drywall:","Use anchors or find studs","Use proper anchors or mount to studs."],["QB-01521","Install Protocol","When pulling wire through conduit, the maximum tension should not exceed:","Manufacturer specifications","Follow manufacturer specifications for maximum pulling tension."],["QB-01522","Install Protocol","When running cable through joists:","Drill in center third to avoid splitting","Drill holes in center third of joists."],["QB-01523","Install Protocol","When running wire through an attic, always:","Step only on joists or secure planking","Safety requires stepping only on joists to prevent falling through ceiling."],["QB-01524","Install Protocol","Where do wire runs go for PoE camera installations?","From camera location to CSVR or POE switch","Each camera gets its own wire run from the camera location back to the CSVR or PoE Switch."],["QB-01525","Install Protocol","Where do you document the Scope of Work?","Sales notes section of the salesforce opportunity","Scope of Work goes in the Sales Notes section of the Salesforce Opportunity."],["QB-01526","Install Protocol","Where should a CSVR be mounted?","In a designated it closet or secured area","CSVR goes in a secured area — IT closet, locked back room, or another spot that's not publicly accessible."],["QB-01527","Install Protocol","Where should a keypad be installed?","Near main entry/exit, easily accessible, protected from view","Keypads go near entry points, accessible but code entry not visible from outside."],["QB-01529","Install Protocol","Where should door/window contacts be installed?","On the opening side of the door/window frame","Contacts go on the opening side to detect when door/window opens."],["QB-01530","Install Protocol","Where should pictures and site maps be uploaded?","Files section in the salesforce opportunity","Upload photos and site maps to the Files section in the Salesforce Opportunity."],["QB-01531","Install Protocol","Where should the EOL resistor be placed?","At the last device on the zone","EOL resistor goes at the last device to supervise the entire circuit."],["QB-01532","Install Protocol","Which system serves as the ERP backbone for inventory and purchasing at A3?","Rootstock erp","RACI — Inventory/Product Management"],["QB-01533","Install Protocol","Who do you contact first for a Parts Discrepancy on-site?","Warehouse + purchasing + coordinator — SC-3 — Same-day flag — Jobs held","SC-3 / RACI"],["QB-01534","Install Protocol","Who is Accountable (A) for QA in the SecOps RACI?","Resi/comm ops and residential ops are accountable — Cors & QA is responsible","RACI — Secops: QA"],["QB-01535","Install Protocol","Who is Accountable for the 24-Hour Member Contact SLA?","Residential ops (a) — Cors & QA is responsible","SLA Matrix — 24-Hr Member Contact"],["QB-01536","Install Protocol","Who is Accountable for the 48-Hr Billing Advance SLA?","Residential ops (a) and billing (a)","SLA Matrix — 48-Hr Billing Advance"],["QB-01537","Install Protocol","Who is Responsible (R) for Service & Install Tracking?","Resi/comm ops, residential ops, and schedule & coordination all share r","RACI — SecOps: Service & Install Tracking"],["QB-01538","Install Protocol","Who is Responsible (R) for parts availability prior to a job in the RACI?","Resi/comm ops (pros)","RACI — Inventory/Product Management"],["QB-01540","Install Protocol","Why is PoE preferred over WiFi for commercial cameras?","More reliable, faster data, harder to hack","PoE provides reliable physical connections, faster data transfer (up to 1Gbps), and is harder to hack than wireless."],["QB-01541","Install Protocol","Why is Smart Security framed as extending the AAA arsenal rather than a new product line?","Members already have ERS, insurance, travel services, and financial benefits. Smart security completes their home protection the same way ERS completes their road protection. It's a natural extension, not a pitch. Connection to existing trust beats cold sales.","Arsenal extension framing"],["QB-01542","Install Protocol","Why is WiFi camera footage quality often worse than PoE?","Wifi compresses footage due to shared bandwidth limitations","WiFi cameras compress footage because they share bandwidth with other devices. PoE delivers full quality over dedicated cable."],["QB-01543","Install Protocol","Why is a motion detector in the master bedroom programmed as Interior, not Perimeter?","Interior zones are bypassed when stay arm is activated, allowing movement inside the home. A perimeter motion in a bedroom would trigger alarms on the homeowner moving at night.","Zone type application"],["QB-01545","Install Protocol","Wire nuts should be installed with the open end facing:","Down","Wire nuts should face down to prevent moisture collection."],["QB-01546","Install Protocol","Wire should have a service loop at devices for:","Future service and adjustments","Service loops allow future adjustments and repairs."],["QB-01547","Install Protocol","Woman at Fry's grocery store with motion sensor issues — what's your move?","Get her name, personally ensure follow-up tomorrow","Apologize, get her name, personally make sure someone reaches out. Own the moment — you ARE AAA right now."],["QB-01548","Install Protocol","You realize after submitting a WO that you forgot to document a zone. What do you do?","Contact TL immediately. Correct the documentation before QA review — Go back on-site if needed. Own the mistake early. It is FAR worse when QA catches it.","Error correction protocol"],["QB-01549","Install Protocol","You're writing an email to a member about a missed appointment. What should the first sentence contain?","An acknowledgment of the member's time and situation — Not a policy explanation. Lead with them, not us. 'I want to make sure your appointment is back on track' beats 'per our scheduling policy...'","Member-first email"],["QB-01550","Install Protocol","Zone Programming","How should you name a front door sensor in the zone program?","L1"],["QB-01551","Install Protocol","What does a PoE camera connect to at the other end?","A PoE switch or CSVR with built-in PoE ports","PoE switch or CSVR provides centralized power and network for all cameras."],["QB-01552","Install Protocol","What cable type is used for PoE camera runs?","Cat-5e or Cat-6 Ethernet cable with RJ-45 connectors","Cat-5e minimum, Cat-6 preferred for future-proofing and better interference rejection."],["QB-01553","Install Protocol","What is the maximum cable run for PoE?","328 feet (100 meters) per the IEEE 802.3af standard","328 feet max — plan camera locations within this distance of the PoE switch or CSVR."],["QB-01554","Install Protocol","What is a PoE injector and when would you use one?","A device that adds PoE to a non-PoE network port — one required per camera","PoE injector converts a standard Ethernet port to PoE. Use only when a PoE switch isn't available."],["QB-01555","Install Protocol","What is the advantage of a PoE switch over individual injectors?","Centralized power management, easier troubleshooting, cleaner installation","One switch powers all cameras. Much cleaner than individual injectors per camera."],["QB-01556","Install Protocol","What is the recommended camera mounting height for commercial?","8-12 feet for optimal coverage and tamper resistance","Too low = vandal accessible. Too high = poor facial detail. 8-12 feet is the sweet spot."],["QB-01557","Install Protocol","How do you handle a situation where the cable run exceeds 328 feet?","Use a PoE extender or relocate the PoE switch/CSVR closer to the cameras","PoE extenders add 328 feet per unit. Or move the switch to a central location."],["QB-01558","Install Protocol","When should a technician escalate to a custom design instead of using bundles?","When the Member needs more than 4 cameras, special sensor configurations, or access control","Bundles cover most small businesses. Beyond that
