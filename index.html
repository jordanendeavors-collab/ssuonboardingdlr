label{display:block;font-weight:700;margin:12px 0 4px}

.opt input{margin-top:4px;flex:none;width:18px;height:18px;accent-color:var(--navy)}.opt:has(input:checked){border-color:var(--navy);background:var(--panel)}

.path::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:var(--line)}
.st{counter-increment:s;position:relative;padding-left:48px;margin:0 0 10px}
.st::before{content:counter(s);position:absolute;left:2px;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);border:2px solid var(--line);color:var(--muted);font-size:.9rem}

.st.review span,.st.wait span{color:var(--red);font-weight:700}

.steps li{margin:8px 0}

.kn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}.kn summary{cursor:pointer;color:var(--navy);font-family:Cambria,Georgia,serif}.kn b{color:var(--red);margin-right:6px}

    ["You are AAA","To the member at the door you are not the alarm guy. The whole reputation rides in with you."],
    ["True North","Members First. G$D: get it done, with integrity. True North: when it is unclear, do what is right for the member and go."],
    ["Care before business","Confirm they are safe, then help. Explain what you are doing and why. Handle the account only once they are cared for."],
    ["The wrap","Care, integrity, security. You tell the truth even when it costs us, and you leave people safer than you found them."],
    ["Integrity checks","Found an issue you could hide? Tell the member and fix it. Something outside your lane? Stop and route it."]
   ],
   q:[
 {q:"How should every AAA member interaction begin?",o:["With a review of their account balance","With their wellbeing: “Are you safe? Are you in a secure location?”","With the product you are there to sell","With paperwork for them to sign"],a:1,f:"Wellbeing first, always. Care comes before business."},
 {q:"What are AAA's three values?",o:["Speed, Volume, Profit","Members First, G$D, True North","Sell, Install, Bill","Care, Cost, Compliance"],a:1,f:"Members First, G$D, True North."},
 {q:"When you work an AAA account, to the member you are…",o:["An outside contractor","Just the alarm installer","AAA. The whole reputation rides in with you","A separate company they hired"],a:2,f:"To the member there is no difference. You are AAA."},
 {q:"We never open a member interaction with…",o:["A safety check","Their name","Billing or account matters","An introduction"],a:2,f:"Never lead with billing. Care first."},
 {q:"What does “zero go-backs” mean?",o:["Never return a member's call","Do the job right the first time","Never refund a member","Only one visit is allowed by policy"],a:1,f:"Install once, install right. A go-back costs money and trust."},
 {q:"G$D stands for…",o:["Get Dollars","Give a Discount","Get it Done, with integrity","Guaranteed Delivery"],a:2,f:"Get it Done: finished, clean, and right."},
 {q:"A member is confused about pricing. The AAA way is to…",o:["Move past it quickly","Be straight and honest with them, every time","Tell them to call the office","Add a fee for the confusion"],a:1,f:"Integrity means the truth, even when it costs us."},

 {q:"Every AAA interaction is wrapped in which three things?",o:["Speed, price, warranty","Care, integrity, security","Sales, service, support","Trust, tools, timing"],a:1,f:"Care, integrity, and security wrap every interaction."},
 {q:"What is the pass mark for SSU module tests?",o:["50%","70%","80%","100%"],a:2,f:"80% to pass. Retake after 24 hours if needed."},
 {q:"How does AAA confirm what a technician knows?",o:["By assuming experience","Through SSU assessments: we verify, not assume","By years in business","By a handshake"],a:1,f:"We check, we don't assume. That's the point of SSU."},
 {q:"Before funded volume unlocks, what field step happens?",o:["A second interview","A first-job spot check","A credit check","Nothing, volume is automatic"],a:1,f:"The first-job spot check validates the work in the field."},
 {q:"Contract language questions route to…",o:["The installer","Legal review","The member","The trainer on the floor"],a:1,f:"Contracts go to legal review; trainers don't answer them from the floor."},
 {q:"What proves a finished job is ready to bill?",o:["A verbal okay","A clean close-out, the paperwork that lets us bill","A photo only","The member's signature on delivery"],a:1,f:"Close-out is the paperwork that lets us bill a finished job."},
 {q:"AAA certification is…",o:["A permanent, one-time badge","Kept live by bi-weekly modules and an annual recert","Optional after year one","Only for new dealers"],a:1,f:"Not permanent. Bi-weekly cadence and recert keep it live."}
   ]},
 { id:"M2", title:"Equipment, Install & Device LOTO", kind:"test", tool:"lock", safety:true,
   learn:[
    ["Not low-voltage","Smart thermostats, hardwired floodlights and smart switches put you inside an energized enclosure. There is no quick swap."],
    ["Hidden sources","Heat strips sit on their own 240V circuits. A fixture box is always hot when the switch is downstream. A switch box can share a neutral with a second breaker."],
    ["The six steps","Identify every source. Kill it at the breaker. Your lock, your tag. Bleed stored energy. Live, Dead, Live. Photograph the lock."],
    ["Controls are not disconnects","Wall switches, service switches, thermostats and an app set to off are controls. Isolate at the breaker."],
    ["Stop work","Unlabeled panel, aluminum or knob-and-tube wiring, a burning smell, live parts you cannot isolate: stop and escalate. Nobody second-guesses that call."],
    ["The gate","Pass this test, sign the Device LOTO attestation, clear the first-job spot check. Then, and only then, device jobs."]
   ],
   q:[
 {q:"A smart thermostat, hardwired floodlight camera or smart switch job is…",o:["A low-voltage swap","A line-voltage job inside an energized enclosure","Line-voltage only if the member says so","Exempt if it takes under ten minutes"],a:1,c:true,f:"These put you inside a line-voltage enclosure. No quick-swap exemption."},
 {q:"The four words, every time:",o:["Switch off, start work","Breaker OFF, Lock ON, Test before touch","Call, confirm, close","Check the app first"],a:1,c:true,f:"Breaker OFF. Lock ON. Test before touch."},
 {q:"The wall switch for a floodlight camera is…",o:["A safe disconnect","A control, not a disconnect. Isolate at the branch breaker","Enough if you tape it off","Fine if the light is off"],a:1,c:true,f:"The fixture box can be always hot. The wall switch is not a disconnect."},
 {q:"Turning off the air handler service switch before a thermostat swap…",o:["De-energizes everything in the cabinet","Is all you need on heat-pump systems","Does not de-energize the heat strips. Identify and lock each circuit","Is only needed in winter"],a:2,c:true,f:"Heat strips land on separate 240V circuits. The service switch is a secondary control."},
 {q:"Live, Dead, Live means…",o:["Test the circuit three times","Prove the meter on a known live source, test the circuit dead, prove the meter live again","Check live wires twice and neutral once","Ask the member if power is off"],a:1,c:true,f:"If the meter fails the last live check, your dead reading was a dead meter. Start over."},
 {q:"A non-contact voltage tester is…",o:["Full verification on its own","A screening tool. Verification needs a contact meter","Only for low-voltage work","Better than a multimeter"],a:1,f:"Screen with it, verify with a contact meter rated for the circuit."},
 {q:"A second technician joins you on the job. Lockout means…",o:["They use your lock","One worker, one lock: a second lock on the hasp","They wait in the truck","Only the lead needs a lock"],a:1,f:"Your lock, your tag, your name. Every worker carries their own."},
 {q:"Before touching HVAC terminals you…",o:["Wait one minute","Bleed stored energy and discharge capacitors","Wear thicker gloves","Short the terminals together"],a:1,f:"Stored energy stays after the breaker is off."},
 {q:"Who decides whether line-voltage device work fits your license?",o:["You, from experience","Your branch manager","Compliance, before the work is accepted","The member"],a:2,c:true,f:"Technicians and branches never self-determine scope or licensing."},
 {q:"The panel is unlabeled and you cannot positively identify the breaker. You…",o:["Flip breakers until it goes dead","Stop and escalate to your Team Lead","Work it live carefully","Ask the member to guess"],a:1,c:true,f:"That is a stop-work trigger. Nobody at MWG will second-guess the call."},
 {q:"A smart switch box is fed by a multiwire branch circuit. You…",o:["Kill the one breaker labeled for the switch","Kill every breaker feeding that box, both legs","Leave the neutral live","Only kill the far 3-way"],a:1,c:true,f:"A shared neutral is fed from a second breaker. Kill every feed."},
 {q:"What is the close-out standard for a device job?",o:["A photo of the finished device","A photo of the locked breaker with a legible tag on the work order","The member's verbal okay","A note in the app"],a:1,f:"No photo, no close."},
 {q:"Label conductors before removal by…",o:["Wire color","Terminal","Length","Whatever is quickest"],a:1,f:"Label by terminal, not by color. Colors lie in old work."},
 {q:"You are cleared for line-voltage device installs when…",o:["You pass this test","You pass the test, sign the LOTO attestation, and clear the first-job spot check","Your dealer says so","After your first thermostat"],a:1,f:"Three pieces, all required. Safety is the one gate we never wave through."}
   ]},
 { id:"M3", title:"The Install Standard & Zero Go-Backs", kind:"test", tool:"level",
   learn:[
    ["A go-back costs twice","Our money and the member's trust. Shaky installs churn; clean installs stay."],
    ["Cradle to grave","Seven phases, each a control point: lead and scope, design and quote, schedule, pre-install check, install, exception or change order, close-out."],
    ["Workmanship","Level, secure, clean. Label every termination. Keep Class 2 low-voltage separate from power. No temporary fixes left behind."],
    ["Test with the member watching","Signals and zones through Mobile Tech or Rapid Mobile, ADC walk test on every device, speed test before any camera goes in."],
    ["Close-Out Five","Tested. Documented. Photographed. Member educated. Work order sent."],
    ["Stop caps","Wrong parts, scope changed on site, an unsafe condition, a failed speed test: stop. Forcing a bad install is the failure, not stopping."]
   ],
   q:[
 {q:"A go-back costs…",o:["Only fuel","Twice: our money and the member's trust","Nothing if it is quick","Only the technician's time"],a:1,f:"Truck roll, labor and parts on a job already paid for, plus trust."},
 {q:"How many phases are in the cradle-to-grave install lifecycle?",o:["Three","Five","Seven","Ten"],a:2,f:"Seven phases, each a control point. We don't skip gates."},
 {q:"When is the speed test done?",o:["After cameras are mounted","Before any cameras go in","Only if the member complains","At the next service visit"],a:1,f:"Resolve connectivity first. A failed speed test stops the camera install."},
 {q:"Every device gets…",o:["A visual check","An ADC sensor walk test","A test on the next visit","A photo only"],a:1,f:"A device that isn't walk-tested is a device you're guessing about."},
 {q:"Class 2 low-voltage wiring is routed…",o:["Bundled with power to save time","Separate from power conductors","Inside the electrical panel","Wherever is shortest"],a:1,f:"Keep low-voltage separate from power."},
 {q:"The Job Work Order captures…",o:["Only the member's signature","SSID, panel serial, zone list, start and end, installed-by and DLR, speed test, every device","Just the device count","Only photos"],a:1,f:"That record is what lets us bill and prevents the go-back later."},
 {q:"Equipment already at the site that you leave in place is…",o:["Ignored","Noted on the work order as pre-existing, not under AAA warranty","Removed and taken","Added to AAA warranty"],a:1,f:"Note it so nobody assumes we stand behind it."},
 {q:"The scope changes on site. You…",o:["Do the extra work and bill later","Get a signed change order before you proceed","Skip it","Ask the member to call the office later"],a:1,f:"No signed change order, no extra work."},
 {q:"Parts are missing or wrong. You…",o:["Improvise with what's on the truck","Order the right parts and reschedule","Install a placeholder","Close the job out anyway"],a:1,f:"Stopping is not failure. Forcing a bad install is."},
 {q:"Which is part of the Close-Out Five?",o:["Member educated","Upsell offered","Review requested","Invoice emailed"],a:0,f:"Tested, documented, photographed, member educated, work order sent."},
 {q:"No close-out means…",o:["Bill anyway","No billing","A discount","A shorter warranty"],a:1,f:"Close-out is the paperwork that lets us bill."}
   ]},
 { id:"M4", title:"The AAA Member Walkthrough", kind:"test", tool:"clipboard",
   learn:[
    ["Not a pitch","The walkthrough is you, as AAA, understanding what a member needs and showing them how we protect it."],
    ["Discover first","What are you protecting? What worries you most? How will you use it? What's already here? Who needs access? Any constraints?"],
    ["Walk the site","Photos of each location and any equipment we take over. Power, internet, wire paths, mounting surfaces, sightlines."],
    ["Match, don't oversell","Pick the bundle that fits the need, not the biggest ticket. Write the scope in the Salesforce opportunity with photos in Files."],
    ["They know everything they get","Before you leave, the member can repeat back what they're getting and where it goes. If they're unsure, you're not done."]
   ],
   q:[
 {q:"How does every walkthrough open?",o:["With the bundle price","“Are you safe? Are you in a secure location? Is everything okay?”","With the contract","With the install date"],a:1,f:"Care before business, every time."},
 {q:"The walkthrough is…",o:["A sales pitch","You, as AAA, understanding the member's need and how we protect it","A quick equipment count","Optional for small jobs"],a:1,f:"The questions choose the solution."},
 {q:"Which discovery question drives access control?",o:["What worries you most?","Who needs access?","How big is the house?","What's your budget?"],a:1,f:"Staff, managers, after-hours: access needs shape the design."},
 {q:"On the site walk you capture…",o:["Only the front door","Photos of each location, existing or takeover equipment, power and network points","Nothing, it's in your head","The member's ID"],a:1,f:"The install team builds from what you capture."},
 {q:"For commercial video or access work, a site walk is…",o:["Optional","Required","Only for jobs over ten cameras","Done after install"],a:1,f:"Basic intrusion may not need one. Commercial video and access do."},
 {q:"Choosing the bundle, you pick…",o:["The biggest ticket","The one that fits the need you heard","Whatever is in stock","The one the member names first"],a:1,f:"Match, don't oversell. Sell the bundle as built."},
 {q:"The scope of work is written…",o:["On a sticky note","In the Salesforce opportunity, with photos in its Files","In a text to the installer","Nowhere, the installer figures it out"],a:1,f:"Write it like the installer has never seen the site."},
 {q:"Before you leave the conversation the member should…",o:["Have signed","Be able to repeat back what they're getting and where it goes","Have paid","Have downloaded every app"],a:1,f:"If they're unsure, we're not done."},
 {q:"Which is never the AAA way?",o:["Identify yourself and AAA on arrival","Explain in plain language","Guess on licensing, code or contracts","Be honest about what they don't need"],a:2,f:"Route it. Never guess."},
 {q:"On install day each device is functional-tested…",o:["After you leave","With the member watching","Only if asked","By the monitoring center later"],a:1,f:"They should see it work before you go."}
   ]},
 { id:"M5", title:"Compliance, Codes & the AHJ", kind:"test", tool:"book",
   learn:[
    ["The AHJ has final say","The Authority Having Jurisdiction is the local official who approves and enforces. Codes set the floor; local amendments win."],
    ["Licensing to Compliance","Any licensing or permit question goes to Compliance before the work is accepted. Never answer one for a member or contractor."],
    ["Contracts to legal","Any contract or agreement language goes to legal review."],
    ["How we cite","A real requirement names the standard, the edition year and the section. “The code says” is not a citation. If you can't name it, route it."],
    ["After install","Register the alarm permit where required, know the local false-alarm rules, educate the member, and flag any deviation."]
   ],
   q:[
 {q:"The AHJ is…",o:["The alarm company's head of jobs","The local official who approves and enforces, such as a fire marshal or inspector","A national code book","The member"],a:1,f:"Authority Having Jurisdiction. They have final say."},
 {q:"A city requirement is stricter than the national code. Which applies?",o:["The national code","The stricter local requirement; the AHJ has final say","Whichever is cheaper","The one the technician prefers"],a:1,f:"Codes set the floor. Local amendments win."},
 {q:"A permit or licensing question comes up on a job. You…",o:["Answer from experience","Route it to Compliance before the work is accepted","Ask the general contractor","Search online and decide"],a:1,f:"Never self-determine. A paused job is cheaper than an unlicensed one."},
 {q:"Contract language goes to…",o:["The technician","Legal review","The member","The AHJ"],a:1,f:"Contracts route to legal review."},
 {q:"A real code citation names…",o:["“The code says”","The standard, the edition year and the section","Just the standard","Whatever the inspector said"],a:1,f:"Three things, every time, plus the AHJ's final say."},
 {q:"You can't name the exact citation. You…",o:["Say “the code says” anyway","Route it to Compliance","Skip it","Use last year's answer"],a:1,f:"If you can't cite it, route it."},
 {q:"Which edition of a code is in force on a job?",o:["Always the newest","Whatever the deck says","The edition adopted where the work is, verified per state, with the AHJ's final say","The one the member prefers"],a:2,f:"Our eight states adopt on different cycles. Verify, don't assume."},
 {q:"The alarm permit is registered…",o:["Never","Where the jurisdiction requires one, before or at activation","Only after the first false alarm","By the member, without help"],a:1,f:"Know the local rules and register on time."},
 {q:"Most false alarms are prevented by…",o:["Turning sensors off","Member education","Fewer devices","Longer entry delays everywhere"],a:1,f:"Set the member up so they don't trip their own system."},
 {q:"Something reads as a permit, monitoring or false-alarm ordinance deviation. You…",o:["Let it ride","Flag it","Fix it quietly","Wait for the AHJ to notice"],a:1,f:"Flag it. Don't let it ride."},
 {q:"The AHJ gives you an approval on site. You…",o:["Remember it","Get it in writing and keep it with the job","Tell the member","Post it on social"],a:1,f:"Document their call."}
   ]},

const DRILLS=[["QB-00001","Compliance & Ethics","Are these retail bundles for residential or commercial?","Small business / commercial ONLY — not residential","Small business commercial only. Residential has separate bundles and processes."],["QB-00002","Compliance & Ethics","What should you NEVER sell from the commercial menu?","Never sell the SEM Bundle — it's not approved for retail","SEM Bundle exists in the system but is NOT for retail sales. Use only the 6 approved bundles."],["QB-00003","Compliance & Ethics","Who approves pricing exceptions or custom configurations?","Sales management — never discount or modify without approval","Price integrity protects margins and ensures consistent Member experience."],["QB-00004","Data & Communications","What is the CSVR model number?","Adc-csvr126","ADC-CSVR126 — the Alarm.com commercial-grade stream video recorder."],["QB-00005","Data & Communications","How many cameras can the CSVR support?","Up to 16 Alarm.com cameras","16 channels means room for future expansion beyond initial bundle cameras."],["QB-00006","General","What does 'BAA' refer to in Smart Video service?","- BAA = Business Associate Agreement, important for commercial compliance requirements.",""],["QB-00007","General","What does ADC stand for in the service plans?","- ADC refers to Alarm.com, the platform powering video and monitoring services.",""],["QB-00008","General","What is a CSVR?","- CSVR stands for Commercial Streaming Video Recorder — stores and streams video footage.",""],["QB-00009","Install Protocol","A member asks if they can add more sensors after the install. What do you tell them?","Yes — Additional equipment can be added as an upgrade. They should contact AAA smart security directly. Do not promise add-ons you aren't authorized to commit to.","Scope boundaries"],["QB-00010","Install Protocol","Are the retail bundles for residential or commercial?","- These bundles are designed for small business only, not residential (yet).",""],["QB-00011","Install Protocol","Can you add items to bundles?","- Only sell the bundles as-is — do NOT add without reaching out for approval.",""],["QB-00012","Install Protocol","How long after install completion must the work order be submitted?","Same day. 24+ hours is a STOPCAP flag. QA cannot process or release billing on unsubmitted wos.","WO SLA"],["QB-00013","Install Protocol","How should you introduce the Alarm.com app to the member?","Pull it up on their phone. Show arm/disarm, live video, and activity history. Have them perform each action once while you watch. Don't hand them a brochure — Demonstrate, then have them demonstrate back.","Show-then-do training"],["QB-00014","Install Protocol","How should you name a front door sensor in the zone program?","Front door — Not zone 1, not door, not entry. Exact location names. The monitoring center reads these during an alarm event. Name it like someone's life depends on it.","Zone naming convention"],["QB-00015","Install Protocol","If you're running more than 30 minutes late to a member's install window, what do you do?","Call the member before the 30-MINUTE mark. Give a specific ETA. Acknowledge the inconvenience. Proactive communication prevents complaint escalation.","Proactive member comms"],["QB-00016","Install Protocol","Member isn't home for a confirmed install window. What do you do?","Wait 15 minutes. Call the member. Document the attempt time and outcome. Contact coordinator for next steps. Never leave without making contact — This is a STOPCAP condition.","No-show protocol"],["QB-00017","Install Protocol","Should you sell the SEM Bundle?","- Do NOT sell the SEM Bundle (Security Classic Enhancement Module).",""],["QB-00018","Install Protocol","The member asks 'Do I really need all these cameras?' How do you respond?","Walk them through each camera's specific coverage purpose in their home. Give them full information. Let them decide. Document if they decline a recommended placement.","Informed consent"],["QB-00019","Install Protocol","What are the four requirements for a panel location?","Inside (not garage), dry environment, accessible for service, centrally located relative to zones. Also test comm signal at that spot before mounting.","Panel placement standards"],["QB-00020","Install Protocol","What do ERS and Smart Security have in common from a member experience perspective?","Both involve a member in a vulnerable situation trusting an AAA professional to make them safe. The emotional stakes, the professional obligation, and the AAA brand promise are identical. The setting changes — The standard doesn't.","ERS-SS parallel"],["QB-00021","Install Protocol","What do you confirm before leaving regarding the monitoring center?","Confirm emergency contacts and passcode are current in the monitoring center system. Ask the member directly. Fix it now if wrong. This is their 2 am safety net.","Monitoring verification"],["QB-00022","Install Protocol","What does L1, L2, L3, L4 refer to in SSU certification?","SSU certification levels — L1: Basic install, L2: Intermediate technical + member comm, L3: Advanced technical + compliance, L4: Trainer/master certification. Each level unlocks increased autonomy and responsibility.","SSU certification levels"],["QB-00024","Install Protocol","What does 'People Helping People' mean as an operating principle (not a slogan)?","Every decision, every interaction, every install is made with the member's wellbeing as the primary driver. It's the reason AAA has survived and LED for 120 years — Not marketing, not technology, but a consistent human commitment.","People Helping People doctrine"],["QB-00025","Install Protocol","What does 'full system test' mean before closing the job?","Test every zone, every camera, every motion detector in test mode. Confirm monitoring center received all signals. Not 'most of them' — Every single one.","Zero-skip testing"],["QB-00026","Install Protocol","What is Alarm.com and what does it power in the Smart Security install?","Alarm.com is the cloud-based platform powering the customer-facing app, remote access, video streaming, automation rules, and monitoring center communication. It is the interface between the hardware, the member, and the central station.","Alarm.com platform role"],["QB-00027","Install Protocol","What is the AAA member advantage in Smart Security sales and installs?","Members already trust the brand before the tech knocks on the door. That trust was built by ERS, travel services, and 120 years of reliability. Smart security inherits that trust — And must honor it with every install.","Inherited trust"],["QB-00028","Install Protocol","What is the 'People Helping People' standard in a practical install context?","Every decision, every interaction, every install is made with the member's wellbeing as the primary input — Not speed, not convenience. The standard isn't extra effort — It's the operating principle.","People Helping People"],["QB-00029","Install Protocol","What is the correct battery type for most wireless door/window sensors?","CR2032 or 3V lithium coin cell (panel/sensor specific — Check documentation). Battery life avg 3-5 years under normal use. Low battery alerts auto-send to alarm.com app.","Sensor battery standard"],["QB-00030","Install Protocol","What is the first thing you do when you receive a work order for the day?","Pull up the WO before leaving the branch. Verify address, member name, equipment list, and coordinator notes. If anything is unclear — Call the coordinator now.","Pre-flight discipline"],["QB-00032","Install Protocol","What is the minimum tool kit a technician should carry to every install?","Drill with bits, wire stripper/cutter, fish tape, voltage tester, ladder, mounting hardware assortment, panel programming cable/device, smartphone with alarm.com dealer app, WO on mobile device.","Minimum tool standard"],["QB-00033","Install Protocol","What is the standard for site cleanup after an install?","Leave the member's home cleaner than you found it. Every piece of packaging, drill debris, and excess wire is removed before you leave. This is the AAA standard — Not optional.","Professional finish"],["QB-00034","Install Protocol","What is the window for uploading a completed work order?","Same day. Over 24 hours triggers a STOPCAP flag. QA cannot review or release billing on unsubmitted work orders.","WO submission SLA"],["QB-00036","Install Protocol","What three things should every member interaction leave them feeling?","Safe. Secure. Heard. These aren't aspirational goals — They're the minimum standard for every touchpoint from install to service call to billing inquiry.","Safe · Secure · Heard"],["QB-00037","Install Protocol","When must you use a transformer vs. battery-only power for a panel?","Panels must be powered by transformer (AC) with battery backup. Battery-only is not an acceptable permanent installation — It will deplete in 4-8 hours under monitoring. Transformer + battery is the required configuration.","Power configuration standard"],["QB-00038","Install Protocol","When should you contact the member before arriving?","30 minutes before arrival. Call or text. Confirm they're home, give your ETA. This prevents 70% of missed-window complaints.","Proactive communication"],["QB-00039","Install Protocol","Who sets the master user code at install?","The member sets it, while you're present. You confirm it works. Never use a default or generic code on a live system. Log the number of user codes set in the WO.","Security code ownership"],["QB-00040","Install Protocol","Why do you walk the property with the member BEFORE drilling?","Member input during the walk changes 20% of installs. Sensor placement discussions are FAR cheaper before holes are drilled than after. Confirm sightlines, entry points, and motion zones together.","Member partnership"],["QB-00041","Install Protocol","You arrive at the branch and your kit is missing two door sensors listed on the WO. What do you do?","Do not leave. Call coordinator, document the discrepancy, and resolve before departure. Starting an incomplete install is a STOPCAP condition.","Equipment accountability"],["QB-00042","Install Protocol","What two things does a PoE cable deliver?","Power supply and internet/data connection","One cable does the job of two — power AND data to the camera."],["QB-00043","Install Protocol","What PoE standard do our cameras use?","Ieee 802.3af","802.3af delivers up to 15.4W per port — more than enough for our 11.3W cameras."],["QB-00044","Install Protocol","What is the first thing a technician should do before any install?","Review the scope of work and sales notes thoroughly","Step 1: Know what was sold, where equipment goes, and any special requirements."],["QB-00045","Install Protocol","What tools should every technician have on a commercial install?","Drill, fish tape, cable tester, crimper, ladder, level, PPE, and all ordered equipment","Being fully prepared prevents multiple trips and demonstrates professionalism."],["QB-00046","Install Protocol","What should the technician demonstrate to the Member after install?","How to arm/disarm, view cameras on phone, and who to call for support","Member education is critical. If they can't use it, they won't value it."],["QB-00054","Sales Training","From the Member's POV, what are they ACTUALLY buying when they purchase a security system?","Peace of mind, protection of their livelihood, safety for their employees, and the ability to sleep at night","Nobody wants to buy cameras and sensors. They want to stop worrying. They want their employees safe. They want to protect what they built. Sell the OUTCOME, not the hardware. 'This system means you'll never wonder if your back door is secure at 2 AM again.'"],["QB-00056","Sales Training","How does the AAA brand create 'authority bias' that helps close sales?","People trust recognized authorities — AAA's 100+ year reputation transfers credibility to Smart Security automatically","Authority bias means people defer to perceived experts and trusted brands. AAA is one of the most trusted brands in America. When you say 'AAA Smart Security,' you're borrowing 100+ years of trust. Use it: 'You already trust AAA with your roadside — now trust us with your business.'"],["QB-00057","Sales Training","How many hours of labor are in the Business Classic Security bundle?","- Business Classic Security includes 3 hours of commercial labor.",""],["QB-00064","Sales Training","What does 'social proof' mean in sales?","People look to what others are doing to guide their own decisions","Social proof is the principle that people follow the crowd. Saying 'Most of our commercial Members choose the Classic Security View bundle' is more persuasive than listing features because it implies others already validated the decision."],["QB-00066","Sales Training","What is 'consultative selling' and why does it matter for AAA Smart Security?","Positioning yourself as an expert advisor who solves problems, not a salesperson pushing products","Members trust advisors, not salespeople. When you lead with discovery questions and recommend solutions based on THEIR needs, you become the expert they rely on. This is the Members First philosophy applied to sales."],["QB-00067","Sales Training","What is the '80/20 Rule' of discovery conversations?","The Member should be talking 80% of the time while you listen 20%","In discovery, your job is to listen. The more the Member talks, the more they reveal their pain points, priorities, and objections. Every word they say is ammunition for your recommendation. Ask open-ended questions and shut up."],["QB-00087","Sales Training","What does BAA stand for?","Business Activity Analytics","BAA = Business Activity Analytics — intelligent video analytics for business insights beyond security."],["QB-00088","Sales Training","What five BAA features are available on our cameras?","Occupancy Counting, People Counting, Heat Mapping, Queue Monitoring, Crowd Gathering","Five BAA features turn security cameras into business intelligence tools."],["QB-00089","Sales Training","What MicroSD card is compatible with the turret camera?","Compatible MicroSD cards (check Alarm.com specs for approved sizes)","MicroSD enables onboard recording. Always install BEFORE mounting the camera."],["QB-00090","Sales Training","What is the camera mounting plate model?","ADC-VACC-MNT130 — adapts to third-party mounting bases","Mounting plate adapts turret cameras to CB130T, CBM, ABM, PC130T, and other bases."],["QB-00091","Sales Training","What entry sensors are included in security bundles?","Commercial-grade door/window entry sensors (2 per security bundle)","Commercial sensors are larger and more reliable than residential versions."],["QB-00092","Sales Training","What motion detector is included in security bundles?","Commercial motion detector — 1 per security bundle","Covers interior space and triggers alarm on unauthorized movement."],["QB-00093","Sales Training","What is social proof and give an example.","'Most commercial Members choose Classic Security View' — people follow what others do","Social proof validates their choice. When others choose it, it must be the right decision."],["QB-00094","Sales Training","What question determines whether they need an alarm panel?","'Do you need intrusion protection — door sensors, motion detection, monitoring?'","Intrusion protection = panel bundle. No intrusion = video-only bundle."],["QB-00095","Sales Training","Do I own the equipment or lease it?","You own it — all equipment purchased belongs to the Member","Full ownership means no equipment removal if you change providers."],["QB-00096","Sales Training","Is there a contract for monitoring?","Monthly monitoring subscriptions can be canceled at any time","No long-term contract for monitoring. Financed equipment must still be paid off."],["QB-00097","Sales Training","Can I view cameras on my phone?","Yes — through the Alarm.com app on iOS and Android from anywhere","Free Alarm.com app provides live view, playback, alerts, and system control."],["QB-00098","Sales Training","Who monitors my system?","AAA Smart Home monitoring centers with dual backup facilities","Two backup monitoring centers ensure your system is never unmonitored."],["QB-00099","Sales Training","How long does installation take?","3-10 hours depending on the bundle — technician handles everything","From simple 3-hour alarm installs to full 10-hour CSVR systems."],["QB-00100","Sales Training","Is there a warranty on the equipment?","Equipment warranties vary — contact AAA Smart Home for specific terms","AAA stands behind their products. Verify current warranty terms."],["QB-00101","Sales Training","How often do burglaries occur in the US?","Approximately one every 51 seconds — over 779,000 reported in 2024","779,000 burglaries in 2024. It's not if, it's when — unless you're protected."],["QB-00102","Sales Training","What is the Alarm.com app?","Free mobile app for iOS and Android — controls your entire security system remotely","One app controls panel, cameras, locks, lights, and thermostats from anywhere."],["QB-00103","Sales Training","Can you view live camera feeds from the app?","Yes — real-time live streaming from all connected cameras","Live view from anywhere with internet connection. Check your business anytime."],["QB-00104","Sales Training","What notifications can the app send?","Real-time push notifications, text, and email for alarms, motion, access, and environmental events","Customizable alerts keep you informed without overwhelming you."],["QB-00107","Technical Systems","What is the model designation of the IQ4 Panel?","Qolsys IQ Panel 4 (QS9014-840-00-00)","The IQ4 345 Panel is the central brain in all security bundles."],["QB-00108","Technical Systems","What processor does the IQ4 use?","Qualcomm Snapdragon 8-core processor","8-core Qualcomm Snapdragon SOM with 16GB NAND flash — the most powerful security panel on the market."],["QB-00109","Technical Systems","What is the built-in camera resolution?","8 Megapixel with Flex-Tilt adjustment","8MP camera with 120° FOV and adjustable tilt for disarm photos, peek-in, and alarm videos."],["QB-00110","Technical Systems","What operating system does the IQ4 run?","Android 9","Android 9 provides a familiar, responsive touch interface with OTA update capability."],["QB-00111","Video & CCTV","Why install the MicroSD card BEFORE mounting?","Removing a mounted camera wastes labor and looks unprofessional","MicroSD slot is inaccessible once mounted. Always install first."],["QB-00112","Wiring & Color Codes","Can existing wire from a previous camera be reused?","- If wire exists from a previous camera at the location, it can be utilized in some cases.",""],["QB-00113","Wiring & Color Codes","Do PoE cameras need a separate power outlet?","- No power outlet needed — PoE delivers power through the Ethernet cable.",""],["QB-00114","Wiring & Color Codes","What two things does PoE provide to cameras?","- PoE provides both power supply AND internet connection through one cable.",""],["QB-00115","Access Control","A card reader typically uses what technology?","RFID or proximity","Most card readers use RFID/proximity technology."],["QB-00116","Access Control","A door position switch (DPS) indicates:","Whether door is open or closed","DPS monitors door open/closed status."],["QB-00117","Access Control","Access control power supply:","24VDC",""],["QB-00118","Access Control","Access level defines:","Both doors and times",""],["QB-00119","Access Control","An access level determines:","Which doors a credential can open","Access levels define which doors/readers a credential can access."],["QB-00120","Access Control","Anti-passback prevents:","Card sharing","Prevents re-entry without valid exit."],["QB-00121","Access Control","Anti-tailgating prevents:","Unauthorized persons following authorized entry","Anti-tailgating detects multiple people entering on one credential."],["QB-00122","Access Control","Are magnetic locks fail-safe or fail-secure?","Fail-safe (unlocks when power fails)","Mag locks are fail-safe - they release when power is removed."],["QB-00123","Access Control","BLE stands for:","Bluetooth Low Energy","BLE is Bluetooth Low Energy for wireless communication."],["QB-00124","Access Control","Biometric & Access Control Systems","Which biometric system is considered the least efficient?","C"],["QB-00125","Access Control","Biometric templates store:","Mathematical representation of features","Templates are mathematical representations, not actual images."],["QB-00127","Access Control","Card + PIN is an example of:","Two-factor authentication","Card (something you have) + PIN (something you know) = two-factor."],["QB-00128","Access Control","Card reader mounting height:","ADA compliant 48\"",""],["QB-00130","Access Control","Crossover Error Rate (CER) is:","Point where FAR equals FRR","CER is where FAR and FRR are equal - used to compare systems."],["QB-00131","Access Control","Door held open alarm after:","Programmable time",""],["QB-00133","Access Control","Electric strike duty cycle types:","Both available",""],["QB-00134","Access Control","Electric strike typical voltage:","12-24VAC/DC",""],["QB-00135","Access Control","Electric strikes:","Replace the standard strike plate","Electric strikes replace the strike plate in the frame."],["QB-00136","Access Control","Elevator control method:","Relay per floor",""],["QB-00137","Access Control","Fail-safe lock behavior on power loss?","- Fail-safe unlocks on power loss.",""],["QB-00138","Access Control","Fail-safe lock on power loss:","Unlocks",""],["QB-00140","Access Control","Fail-secure lock behavior on power loss?","- Fail-secure remains locked.",""],["QB-00141","Access Control","Fail-secure lock on power loss:","Locks",""],["QB-00142","Access Control","Fail-secure locks:","Stay locked when power fails","Fail-secure locks remain locked during power failure."],["QB-00143","Access Control","False Acceptance Rate (FAR) measures:","Unauthorized users incorrectly accepted","FAR is the rate of unauthorized users incorrectly accepted."],["QB-00144","Access Control","False Rejection Rate (FRR) measures:","Authorized users incorrectly rejected","FRR is the rate of authorized users incorrectly rejected."],["QB-00145","Access Control","Fire release requires:","Fail-safe lock",""],["QB-00146","Access Control","Mag lock bond sensor detects:","Door position",""],["QB-00147","Access Control","Mag lock holding force range:","Varies widely",""],["QB-00148","Access Control","Mag lock requires power to:","Lock",""],["QB-00149","Access Control","Magnetic lock holding force typically?","- Standard mag locks rated 1200 lbs.",""],["QB-00150","Access Control","Magnetic locks (maglocks) use:","Electromagnet to hold door","Maglocks use electromagnetic force to secure doors."],["QB-00151","Access Control","Mantrap/interlock requires:","First door to close before second opens","Interlocks prevent both doors from being open simultaneously."],["QB-00152","Access Control","Mobile credential uses:","Both",""],["QB-00153","Access Control","Mobile credentials use:","Smartphone as credential","Mobile credentials turn smartphones into access credentials."],["QB-00154","Access Control","NFC stands for:","Near Field Communication","NFC is Near Field Communication for close-range wireless."],["QB-00155","Access Control","OSDP (Open Supervised Device Protocol) provides:","Secure, bidirectional communication","OSDP is a secure bidirectional access control protocol."],["QB-00156","Access Control","OSDP protocol provides:","Secure communication",""],["QB-00157","Access Control","Proximity card read range:","Varies by card",""],["QB-00158","Access Control","Proximity cards operate at what frequency?","- Standard proximity cards use 125 kHz.",""],["QB-00159","Access Control","Proximity cards operate using:","Radio frequency","Proximity cards use RF for contactless reading."],["QB-00160","Access Control","REX (Request to Exit) is:","Input to controller",""],["QB-00161","Access Control","RS-485 advantage:","Both",""],["QB-00162","Access Control","Request to Exit (REX) devices:","Allow exit without credentials","REX allows exit without triggering alarms or requiring credentials."],["QB-00163","Access Control","Smart card advantage:","More secure",""],["QB-00164","Access Control","Smart cards contain:","Embedded microprocessor chip","Smart cards have embedded chips for processing and storage."],["QB-00165","Access Control","Something you are refers to:","Biometric characteristic","Something you are is a biometric like fingerprint or iris."],["QB-00166","Access Control","Something you have refers to:","Physical credential like card or phone","Something you have is a physical possession like a card."],["QB-00167","Access Control","Something you know refers to:","PIN or password","Something you know is knowledge like PIN or password."],["QB-00168","Access Control","Standard Wiegand format?","- 26-bit is standard Wiegand format.",""],["QB-00169","Access Control","Time zone purpose:","Limit access hours",""],["QB-00170","Access Control","Time zones in access control:","Define when access is allowed","Time zones specify when credentials are valid."],["QB-00171","Access Control","Two-person rule requires:","Two cards simultaneously",""],["QB-00173","Access Control","What credential type uses radio frequency for access?","RFID/Proximity","RFID/Proximity cards use radio frequency for contactless access."],["QB-00175","Access Control","What does 'fail-secure' mean for an electric lock?","Locks when power fails","Fail-secure locks remain LOCKED when power fails."],["QB-00176","Access Control","What is 'anti-passback' in access control?","Requiring a credential to exit as well as enter, preventing sharing credentials","Anti-passback prevents a user from passing their credential back to another person by requiring proper entry before exit is allowed."],["QB-00177","Access Control","What is 'two-factor authentication' in access control?","Requiring two different types of credentials (e.g., card + PIN)","Two-factor authentication requires two different types of verification, such as something you have (card) and something you know (PIN)."],["QB-00178","Access Control","What is Wiegand protocol used for?","Access control credential communication","Wiegand protocol is standard for access control reader communication."],["QB-00180","Access Control","What is a REX (Request to Exit)?","A device/button that allows exit without credential","REX devices allow people to exit without presenting a credential."],["QB-00182","Access Control","What is a magnetic lock (mag lock)?","An electromagnet that holds door closed when energized","Mag locks use electromagnets to hold doors closed when powered."],["QB-00183","Access Control","What is an electric strike?","An electrified strike plate that releases the latch","Electric strikes electrify the strike plate to release door latches."],["QB-00184","Access Control","What is door forced open (DFO)?","Alarm condition when door opens without valid access","DFO is an alarm when a door opens without proper authorization."],["QB-00185","Access Control","What is door held open (DHO)?","Alarm when door stays open beyond allowed time","DHO alarms when a door remains open longer than programmed time."],["QB-00186","Access Control","What is the difference between a proximity card and a smart card?","Proximity cards use radio frequency, while smart cards store data","Proximity cards use RF for identification; smart cards contain embedded processors."],["QB-00187","Access Control","What is the least efficient biometric system?","Handwriting","Handwriting recognition is the least efficient biometric system."],["QB-00188","Access Control","What is the most accurate form of biometric identification?","Iris scan","Iris scanning has the lowest false acceptance and false rejection rates of common biometric methods."],["QB-00189","Access Control","What is the primary purpose of an access control system?","To restrict entry to authorized personnel","Access control systems restrict entry to authorized personnel only."],["QB-00190","Access Control","What type of access card is most commonly used in hotels?","Magnetic stripe card","Hotels commonly use magnetic stripe cards due to low cost and easy reprogramming."],["QB-00191","Access Control","What voltage do most access control systems use?","12VDC or 24VDC","Most access control systems operate on 12VDC or 24VDC."],["QB-00193","Access Control","Which biometric system is considered the least efficient?","Voice recognition","Voice recognition is considered least efficient due to environmental factors."],["QB-00195","Access Control","Which type of access card is normally used for parking lots?","Proximity card","Proximity cards are common for parking lots due to hands-free convenience."],["QB-00196","Access Control","Wiegand 26-bit format contains:","Facility + card number",""],["QB-00197","Access Control","Wiegand format is a:","Card reader communication protocol","Wiegand is a standard protocol for card reader communication."],["QB-00198","Access Control","Wiegand interface uses how many wires for data?","- Data0 and Data1 for Wiegand.",""],["QB-00199","Access Control","Wiegand max cable length:","500 feet",""],["QB-00200","Video & CCTV","H.264 is:","Compression codec",""],["QB-00201","CW Scenarios","A member is visibly frustrated when you arrive — says the last tech left a mess and the panel was never set up right. CW's first move?","Don't get defensive. Don't throw the last tech under the bus. Lead with acknowledgment: 'that's not acceptable and I'm here to fix it.' do a full audit before touching anything — Document current state, photograph anything already wrong. Then set expectations: 'here's what I'm going to do today and when you'll have it working.' member trust recovery starts with honesty and a clean slate.",""],["QB-00202","CW Scenarios","CW Scenarios","A member opens the door and immediately says 'I don't want to be sold anything extra.' cw's response:","L2"],["QB-00203","CW Scenarios","During a walkthrough, a member asks you: 'Is this system going to call the police automatically?' What does CW say?","Be accurate, not vague. 'when an alarm triggers, our monitoring center contacts you first per your call list. If we can't reach you and the alarm is confirmed, they dispatch based on your monitoring plan and local protocol.' do not say 'yes' or 'no' without the full context. Overpromising on dispatch is a liability. Know the member's plan — Check alarm.com account before you answer.",""],["QB-00204","CW Scenarios","The member asks you mid-install if they can add a camera to the backyard. You don't have the equipment on the truck. What does CW do?","Acknowledge the request, confirm what they want, tell them you'll document it as a scope addition, and get pm on the line or into the WO immediately. Do not promise a return date you can't guarantee. Do not begin work outside the original scope. Change order route — That's the only path.",""],["QB-00205","CW Scenarios","You finish an install. Everything tests green. The member is distracted and says 'Just leave the paperwork, I'll sign it later.' What does CW do?","You don't leave. Politely and firmly explain that the walkthrough and signature are part of the install — Not optional. 'I need about 10 minutes to walk you through the system so you know how to use it. That's part of what you're getting today.' SC-4 and SC-7 both apply. No signature, job doesn't close.",""],["QB-00206","CW Scenarios","You pull up to a member's home 8 minutes before the scheduled window. The member isn't outside, lights are off. What does CW do?","Sit in the driveway. Do not knock early. The 30-MINUTE pre-call was your announcement. Respect the member's time window. At the scheduled time, approach professionally. Never show up early and make it their problem.",""],["QB-00207","CW Scenarios","You test comm path post-install. Alarm.com shows the panel is communicating. You check signal — it's reading -102 dBm. Do you close the job?","No. Minimum acceptable signal is -95 dbm. -102 is below threshold. Document the reading, attempt antenna repositioning, escalate to team lead if signal can't be improved. SC-2 applies — Comm fail resolution required same-day. The panel may appear to communicate at -102 but it's marginal and won't hold under load or interference.",""],["QB-00208","CW Scenarios","You're running behind on your second job of the day and won't make the scheduled window. What does CW do?","Call the member before the window closes — Not after you miss it. Give them an honest updated ETA. Notify field coord immediately so dispatch can manage the route. If you can't make the window at all, that's a reschedule and the coordinator handles member communication. Silent no-shows are never acceptable. Pre-call SLA: 30 min before arrival. If that window is gone, call anyway.",""],["QB-00209","Calculations & Testing","1 square mil conversion to ______ circular mil.","1.27","1 square mil = 1.27 circular mils."],["QB-00210","Calculations & Testing","14 AWG has more resistance than:","12 AWG","14 AWG has more resistance than larger 12 AWG wire."],["QB-00211","Calculations & Testing","24V 18Ah battery capacity:","432 Wh",""],["QB-00213","Calculations & Testing","7Ah battery, 0.5A load, standby time:","14 hours",""],["QB-00214","Calculations & Testing","A 200-foot one-way run has round-trip distance of:","400 feet","Round trip = 2 × one-way = 400 feet."],["QB-00215","Calculations & Testing","A 240V 1Ø heater rated at 4.5kw is being hooked up to 208V 1Ø. Find the amperage draw for this application.","21.6 amps","P = v × I, I = p/v = 4500/208 = 21.6 amps."],["QB-00216","Calculations & Testing","A 240V 1Ø rated heater of 6kw is being installed in a 208V system 1Ø. Find the amperage draw for this application.","25 amps","Watts at new voltage: 6000 × (208/240)² = 4514W, I = 4514/208 = 21.7A, but with derating factor applied = approx 25A."],["QB-00219","Calculations & Testing","A clamp meter measures:","Current without breaking circuit","Clamp meters measure current by clamping around conductor."],["QB-00220","Calculations & Testing","A good conductor shows:","Low resistance/continuity beep","Good conductors have low resistance."],["QB-00221","Calculations & Testing","A multimeter measures:","Voltage, current, and resistance","Multimeters measure voltage, current, and resistance at minimum."],["QB-00222","Calculations & Testing","A tone generator is used with:","Inductive probe to trace wires","Tone generators help trace wires with an inductive probe."],["QB-00223","Calculations & Testing","Alarm current 2A for 5 min equals:","0.167Ah",""],["QB-00224","Calculations & Testing","Alternative power formula:","P = v²/r",""],["QB-00225","Calculations & Testing","An industrial facility has a guard station 610 feet from the service panel. The loads total 41 amps. What conductor size is needed?","#4 AWG","For 41A at 610 feet with 3% max drop, #4 AWG is required."],["QB-00226","Calculations & Testing","An industrial facility has a guard station 610 feet from the service panel. The loads total 41 amps. What conductor size is needed for voltage drop within 3%?","#4 AWG","For 41A at 610 feet with 3% max drop, #4 AWG is required."],["QB-00227","Calculations & Testing","Annual testing requires:","Qualified testing personnel","Qualified personnel must conduct annual testing."],["QB-00228","Calculations & Testing","As wire gauge number decreases:","Wire gets larger","Lower AWG number = larger wire diameter."],["QB-00229","Calculations & Testing","Auto-ranging meters:","Automatically select measurement range","Auto-ranging meters automatically select the best range."],["QB-00230","Calculations & Testing","Battery Ah × V equals:","Watt-hours",""],["QB-00231","Calculations & Testing","Battery capacity for 0.3A standby, 24 hours:","7.2Ah",""],["QB-00232","Calculations & Testing","Battery derating for temperature:","Above 77°F",""],["QB-00233","Calculations & Testing","Battery float voltage should be:","Slightly above rated for proper charging","Float voltage is slightly above rated to maintain charge."],["QB-00234","Calculations & Testing","Before measuring unknown voltage, set meter to:","Highest range first","Start with highest range to prevent meter damage."],["QB-00235","Calculations & Testing","Before measuring voltage, what should you do first?","Set meter to highest voltage range","Always start with the highest voltage range to protect the meter."],["QB-00236","Calculations & Testing","CM (circular mils) measures:","Wire cross-sectional area","Circular mils is a measure of wire cross-sectional area."],["QB-00237","Calculations & Testing","Calculate VD: 24V, 2A, 100ft, 18AWG Cu","3.19V",""],["QB-00238","Calculations & Testing","Calculate current: 100W, 24V","4.17A",""],["QB-00239","Calculations & Testing","Calculate current: 12V, 2.2kΩ","5.45mA",""],["QB-00240","Calculations & Testing","Calculate power: 120V, 15A","1800W",""],["QB-00241","Calculations & Testing","Calculate power: 24V, 2A","48W",""],["QB-00242","Calculations & Testing","Calculate power: 2A through 50Ω","200W",""],["QB-00243","Calculations & Testing","Circular mils 10 AWG:","10,380",""],["QB-00244","Calculations & Testing","Conductor sizing must account for:","Current, voltage drop, and ampacity","Consider current load, voltage drop, and ampacity limits."],["QB-00245","Calculations & Testing","Continuity test indicates good connection with?","- Low resistance and/or audible beep.",""],["QB-00246","Calculations & Testing","Continuity testing checks for:","Complete electrical path","Continuity tests verify a complete electrical path exists."],["QB-00247","Calculations & Testing","Current in a circuit equals:","V / r","I = V / R (current equals voltage divided by resistance)."],["QB-00248","Calculations & Testing","Derating reduces:","Allowable current capacity","Derating reduces allowable ampacity due to heat buildup."],["QB-00249","Calculations & Testing","Diode test mode applies:","Small test voltage to component","Diode mode applies small DC voltage to test semiconductor junctions."],["QB-00250","Calculations & Testing","Documentation of test results should include:","Date, readings, and any deficiencies","Document date, readings, conditions, and problems found."],["QB-00251","Calculations & Testing","Double current, VD will:","Double",""],["QB-00252","Calculations & Testing","Double the distance, VD will:","Double",""],["QB-00253","Calculations & Testing","EOL 2.2kΩ with 12V, current:","5.45mA",""],["QB-00254","Calculations & Testing","EOL resistor value should match:","Panel specifications","EOL resistor must match panel requirements for supervision."],["QB-00255","Calculations & Testing","End voltage: 24V source, 3.5V drop:","20.5V",""],["QB-00256","Calculations & Testing","Fire alarm battery requirement:","24hr + 5min alarm",""],["QB-00257","Calculations & Testing","Fire alarm panel 2A at 24V:","48 va",""],["QB-00258","Calculations & Testing","For fire alarm circuit testing, verify:","Proper voltage and supervision","Verify voltage levels and circuit supervision."],["QB-00259","Calculations & Testing","For long cable runs, consider:","Voltage drop calculations","Long runs require voltage drop calculations."],["QB-00260","Calculations & Testing","Ground fault testing identifies:","Unintended paths to ground","Ground fault testing finds unintended ground connections."],["QB-00261","Calculations & Testing","How do you check for a ground fault?","Use a ground fault tester","Ground fault testers are specifically designed to detect ground faults."],["QB-00262","Calculations & Testing","How do you safely measure current (amperage) in a circuit?","Break the circuit and place the meter in series","To measure current, the meter must be placed in series with the circuit so current flows through the meter."],["QB-00264","Calculations & Testing","If a circuit has too much voltage drop, what are the solutions?","Increase wire gauge, reduce wire length, or add a booster power supply","Reducing voltage drop involves using heavier gauge wire (lower resistance), shorter runs, or adding intermediate power supplies."],["QB-00265","Calculations & Testing","In a connected circuit with a battery on a charging circuit, how would you do a battery load test?","Apply a known load and measure the voltage drop","Load testing applies a known load while measuring voltage drop."],["QB-00266","Calculations & Testing","K value for aluminum is:","21.2","K = 21.2 for aluminum conductors."],["QB-00267","Calculations & Testing","K value for copper is:","12.9","K = 12.9 for copper conductors."],["QB-00269","Calculations & Testing","Maximum voltage drop on fire alarm NAC is:","10%","Maximum 10% voltage drop on notification circuits."],["QB-00270","Calculations & Testing","Measure current - meter connects?","- Series with circuit.",""],["QB-00271","Calculations & Testing","Measure resistance - circuit should be?","- Power off for resistance measurement.",""],["QB-00272","Calculations & Testing","Measure voltage - meter connects?","- Parallel with circuit.",""],["QB-00273","Calculations & Testing","Megohmmeter testing measures:","Insulation resistance at high voltage","Megohmmeters test insulation resistance using high DC voltage."],["QB-00274","Calculations & Testing","Multimeter & Testing","Red to Common, Black to Volt","B"],["QB-00275","Calculations & Testing","Multimeter measures?","- Voltage, current, and resistance.",""],["QB-00276","Calculations & Testing","NAC circuit 24V, 50Ω load:","0.48A",""],["QB-00278","Calculations & Testing","OL on a multimeter display indicates:","Over limit/open circuit","OL indicates over limit or open circuit."],["QB-00279","Calculations & Testing","OL on meter indicates?","- Over limit or open circuit.",""],["QB-00280","Calculations & Testing","Ohm's Law states:","V = I × r","Ohm's Law: Voltage = Current × Resistance."],["QB-00281","Calculations & Testing","Parallel batteries provide:","More Ah",""],["QB-00282","Calculations & Testing","Power (watts) equals:","V × I","P = V × I (power equals voltage times current)."],["QB-00283","Calculations & Testing","Power loss in conductors is due to:","Resistance causing heat","Resistance causes power loss as heat in conductors."],["QB-00284","Calculations & Testing","Resistance equals:","V / I","R = V / I (resistance equals voltage divided by current)."],["QB-00285","Calculations & Testing","Resistance increases, current will:","Decrease",""],["QB-00286","Calculations & Testing","Resistors in parallel:","Decrease total resistance","Parallel resistors result in lower total resistance."],["QB-00287","Calculations & Testing","Resistors in series:","Add together for total resistance","Series resistances add: Rtotal = R1 + R2 + R3..."],["QB-00288","Calculations & Testing","Sensitivity testing of smoke detectors verifies:","Detector response to smoke","Sensitivity testing verifies detector response within spec."],["QB-00289","Calculations & Testing","Series batteries provide:","More voltage",""],["QB-00290","Calculations & Testing","Single phase voltage drop formula:","Vd = 2 x k x I x d / cm","Single phase VD = (2 × K × I × D) / CM for round trip."],["QB-00291","Calculations & Testing","Solenoid 24V @ 0.5A, resistance:","48ω",""],["QB-00292","Calculations & Testing","Temperature correction factors are needed when:","Ambient temperature differs from rated","Temperature correction needed when ambient differs from 30°C."],["QB-00293","Calculations & Testing","Test documentation must be kept for:","1 year past next test","Records must be kept 1 year after the next test."],["QB-00294","Calculations & Testing","Testing sequence should be:","Systematic from panel outward","Test systematically from panel to devices."],["QB-00295","Calculations & Testing","The '2' in voltage drop formula accounts for:","Round trip (both conductors)","The 2 accounts for both the supply and return conductors."],["QB-00296","Calculations & Testing","The COM port on a multimeter is for:","Common/ground reference lead","COM is the common reference point for measurements."],["QB-00297","Calculations & Testing","The \"2\" in VD formula represents:","Round trip distance","Calculations"],["QB-00298","Calculations & Testing","To reduce VD:","Use larger wire",""],["QB-00299","Calculations & Testing","To reduce voltage drop:","Use larger wire or shorter runs","Larger wire or shorter distances reduce voltage drop."],["QB-00300","Calculations & Testing","True RMS meters accurately measure:","Non-sinusoidal AC waveforms","True RMS meters accurately measure distorted waveforms."],["QB-00301","Calculations & Testing","Two 1000Ω resistors in parallel equal:","500ω","(1000 × 1000)/(1000 + 1000) = 500Ω in parallel."],["QB-00302","Calculations & Testing","Two 1000Ω resistors in series equal:","2000ω","1000 + 1000 = 2000Ω in series."],["QB-00304","Calculations & Testing","Two 10Ω resistors in series:","20ω",""],["QB-00305","Calculations & Testing","Two 12V 7Ah in parallel:","12V 14ah",""],["QB-00306","Calculations & Testing","VA stands for:","Volt-Amperes",""],["QB-00307","Calculations & Testing","Voltage Drop & Conductor Sizing","What size copper conductors are needed for a 1hp 240V pump motor located 340 feet from the service?","A"],["QB-00308","Calculations & Testing","Voltage drop formula is VD =","2 × k × I × d / cm","VD = 2 × K × I × D / CM (K=resistance, I=current, D=distance, CM=circular mils)."],["QB-00309","Calculations & Testing","Voltage increases, current will:","Increase",""],["QB-00310","Calculations & Testing","What does 0.0 Ohms reading indicate when measuring resistance?","No resistance (short circuit)","0.0 ohms indicates no resistance/continuity (short circuit)."],["QB-00311","Calculations & Testing","What does \"OL\" displayed on a multimeter indicate when measuring resistance?","Open Loop","no continuity - OL = Open Loop/Overload = infinite resistance (no continuity)."],["QB-00312","Calculations & Testing","What does an 'OL' reading on a multimeter indicate when measuring resistance?","Open Loop","infinite resistance/no continuity - OL (Over Limit) indicates infinite resistance, meaning the circuit is open and there is no continuity."],["QB-00313","Calculations & Testing","What factors affect voltage drop in a circuit?","Wire gauge, length, and current draw","Voltage drop is affected by wire gauge (resistance per foot), total length of wire, and the current drawn by the load."],["QB-00315","Calculations & Testing","What is the K factor for copper conductors used in voltage drop calculations?","12.9","K factor for copper = 12.9 (aluminum = 21.2)."],["QB-00316","Calculations & Testing","What is the correct range setting when measuring a 120V AC outlet?","200V AC","Select a range higher than expected voltage - 200V AC for 120V circuits."],["QB-00317","Calculations & Testing","What is the correct setting to test a 12V alarm battery?","DC Volts, 20V range","Use DC Volts with a range above 12V (20V range is appropriate)."],["QB-00318","Calculations & Testing","What is the formula for calculating voltage drop?","Vd = (2 × k × I × d) / cm","Voltage Drop = (2 × K × Current × Distance) / Circular Mils. K is a constant for the conductor material (copper = 12.9)."],["QB-00319","Calculations & Testing","What is the maximum allowable voltage drop for fire alarm notification appliance circuits?","10%","Most manufacturers and codes limit voltage drop to 10% to ensure notification appliances operate properly at the end of long wire runs."],["QB-00321","Calculations & Testing","What setting should a multimeter be on to check circuit continuity?","Ohms/Continuity","The ohms or continuity setting is used to verify that a circuit is complete and has no breaks in the wiring."],["QB-00322","Calculations & Testing","What size aluminum wire is required for four 480V HPS lights rated at 2.5 amps each, located 515 feet from the source?","#10 AWG","For 10A total at 480V, 515 feet distance, #10 AWG aluminum is required."],["QB-00323","Calculations & Testing","What size copper conductors are needed for a 1hp 240V pump motor located 340 feet from the service?","#10 AWG","For this distance and load, #10 AWG copper is required."],["QB-00324","Calculations & Testing","When checking resistance on a zone circuit, what should you expect without a resistor installed?","Less than 5 Ohms","Zone circuits without EOL resistor should read <5 Ohms."],["QB-00325","Calculations & Testing","When measuring AC voltage at an electrical outlet, which probe setup is correct?","Red to Volt, Black to Common","Red probe to Volt (V) jack, Black probe to Common (COM) jack."],["QB-00326","Calculations & Testing","When measuring DC voltage on a fire alarm circuit, what is the expected reading for a healthy 24V system?","24-28V","A healthy 24V fire alarm system typically shows 24-28V due to the charging voltage being slightly higher than nominal."],["QB-00327","Calculations & Testing","When measuring current, the meter connects:","In series with the circuit","Current measurement requires series connection."],["QB-00328","Calculations & Testing","When measuring voltage, probes connect:","In parallel with component","Voltage is measured in parallel with the component."],["QB-00329","Calculations & Testing","When testing NAC circuits, verify:","Voltage, current draw, and supervision","NAC testing includes voltage, current draw, and supervision."],["QB-00330","Calculations & Testing","When testing batteries, check:","Voltage under load","Test batteries under load for accurate condition assessment."],["QB-00331","Calculations & Testing","Wire ampacity is affected by:","Temperature, bundling, and installation","Ampacity depends on temperature, bundling, and conditions."],["QB-00332","Calculations & Testing","A 240V 1_x0098_ heater rated at 4.5kw is being hooked up to 208V 1_x0098_. Find the amperage draw for this application.","21.6 amps","P = V _x0097_ I, I = P/V = 4500/208 = 21.6 amps."],["QB-00333","Calculations & Testing","A 240V 1_x0098_ rated heater of 6kw is being installed in a 208V system 1_x0098_. Find the amperage draw for this application.","25 amps","Watts at new voltage: 6000 _x0097_ (208/240)² = 4514W, I = 4514/208 = 21.7A, but with derating factor applied = approx 25A."],["QB-00334","Compliance & Ethics","A member asks you to stay 30 minutes after your scheduled close to show their spouse how to use the system. You're already clocked out. What's the correct approach?","Clock back in before staying. 'I'm happy to wait for your spouse — let me just make sure my time is logged correctly first.' If policy requires TL approval for time extensions, call it in now. An unlogged service interaction is unpaid labor, a liability gap, and an inaccurate record.",""],["QB-00335","Compliance & Ethics","A member offers to let you use their tools. No payment involved. Is there an integrity concern?","Yes — politely decline. Equipment liability, insurance, and potential damage to member property all apply. 'Thank you — I've got everything I need' is the right answer. Your tools, your accountability.",""],["QB-00336","Compliance & Ethics","A member tells you mid-install the previous tech said a certain feature was included. You check the account — it's not. What does integrity require?","Don't honor the verbal promise — and don't throw the previous tech under the bus. 'I want to make sure you get exactly what you're entitled to. Let me pull the agreement and verify with my coordinator before we go any further.' Call it in. Document everything.",""],["QB-00337","Compliance & Ethics","AED (defibrillator) pads must be replaced every:","2 years typically","AED pads typically replaced every 2 years."],["QB-00339","Compliance & Ethics","Appeals go to:","Alj",""],["QB-00341","Compliance & Ethics","At 9 PM you realize you never submitted WO notes from your last job. What's the correct path?","Submit the notes now with honest timestamp. Add a notation: 'Notes submitted at [9 PM timestamp] — job closed at [actual clock-out time]. Notes delayed due to [reason]. All entries reflect actual conditions at time of install.' Then address why this happened.",""],["QB-00342","Compliance & Ethics","CE audit by BCD:","Random",""],["QB-00343","Compliance & Ethics","CE deadline:","Before renewal",""],["QB-00345","Compliance & Ethics","CE records retention:","4 years",""],["QB-00347","Compliance & Ethics","Carbon monoxide alarms must be replaced every:","5-7 years per manufacturer","CO alarms typically last 5-7 years."],["QB-00348","Compliance & Ethics","Code update CE required:","Yes",""],["QB-00349","Compliance & Ethics","Continuing education hours for LEA renewal:","24 per 3 years",""],["QB-00351","Compliance & Ethics","Dead-end corridor maximum length is:","50 feet typically","Dead-end corridors typically max 50 feet."],["QB-00353","Compliance & Ethics","Emergency generator must start within:","10 seconds","Generator start within 10 seconds."],["QB-00358","Compliance & Ethics","Exit signs must be visible from:","100 feet","Exit signs visible from 100 feet."],["QB-00364","Compliance & Ethics","Fire alarm audibility in sleeping areas:","75 dBA or 15 dB above ambient","75 dBA or 15 dB above ambient in sleeping areas."],["QB-00366","Compliance & Ethics","Fire department connection (FDC) must be within:","100 feet","FDC within 100 feet of fire hydrant typically."],["QB-00367","Compliance & Ethics","Fire door closing force should not exceed:","30 lbs","Maximum 30 lbs force to open fire door."],["QB-00368","Compliance & Ethics","Fire extinguisher hydrostatic testing interval:","5 years for water/CO2, 12 years for dry chemical","Testing intervals vary by extinguisher type."],["QB-00370","Compliance & Ethics","Generator fuel supply should provide:","2 hours minimum on-site","Minimum 2 hours fuel supply on-site."],["QB-00372","Compliance & Ethics","Homeowner exemption ORS 479.540:","Own residence",""],["QB-00373","Compliance & Ethics","How many installs are required for Level 1 promotion to Level 2?","25+","Level 1 to Level 2 promotion requires 25+ completed installs."],["QB-00374","Compliance & Ethics","How many installs are required for Level 3 promotion?","100+","Level 3 promotion requires 100+ completed installs."],["QB-00381","Compliance & Ethics","Is an AAA name badge required?","Yes, required at all times","AAA name badge is REQUIRED at all times."],["QB-00382","Compliance & Ethics","LEA apprentice ratio:","2:1",""],["QB-00383","Compliance & Ethics","LEA can install low voltage UPS:","Yes",""],["QB-00384","Compliance & Ethics","LEA can program fire panels:","Yes",""],["QB-00385","Compliance & Ethics","LEA can terminate fiber:","Yes",""],["QB-00386","Compliance & Ethics","LEA continuing education must be:","BCD approved",""],["QB-00387","Compliance & Ethics","LEA exam format:","Written only",""],["QB-00388","Compliance & Ethics","LEA excludes:","120V power",""],["QB-00390","Compliance & Ethics","LEA includes CCTV:","Yes",""],["QB-00391","Compliance & Ethics","LEA includes access control:","Yes",""],["QB-00392","Compliance & Ethics","LEA includes data cabling:","Yes",""],["QB-00393","Compliance & Ethics","LEA includes nurse call:","Yes",""],["QB-00394","Compliance & Ethics","LEA includes security:","Yes",""],["QB-00395","Compliance & Ethics","LEA includes sound systems:","Yes","70V/25V"],["QB-00396","Compliance & Ethics","LEA includes thermostat wiring:","Yes","Class 2"],["QB-00402","Compliance & Ethics","LEA trainee registration required:","Yes",""],["QB-00403","Compliance & Ethics","LEA trainee supervision requirement:","Direct supervision",""],["QB-00406","Compliance & Ethics","Maximum door leaf width is:","48 inches","Maximum single door leaf is 48 inches."],["QB-00407","Compliance & Ethics","Maximum strobe flash rate to prevent seizures:","2 Hz","Maximum 2 Hz to prevent photosensitive seizures."],["QB-00408","Compliance & Ethics","Maximum travel distance to fire extinguisher is:","75 feet","Maximum 75 feet travel to extinguisher."],["QB-00410","Compliance & Ethics","Minimum door width for accessibility is:","32 inches clear","32 inches minimum clear width for ADA."],["QB-00411","Compliance & Ethics","Must shirts be tucked in?","Yes, at all times","Shirts MUST be tucked in at all times."],["QB-00413","Compliance & Ethics","OAR division for LEA technicians:","Oar 918-251",""],["QB-00417","Compliance & Ethics","ORS enforcement by:","Bcd",""],["QB-00418","Compliance & Ethics","Online permits available:","Some jurisdictions",""],["QB-00433","Compliance & Ethics","Running 120V to transformer:","Electrician required",""],["QB-00434","Compliance & Ethics","Smoke alarm battery backup should last:","24 hours","24 hours minimum battery backup."],["QB-00435","Compliance & Ethics","Smoke barrier doors must close within:","10 seconds","Smoke doors close within 10 seconds."],["QB-00437","Compliance & Ethics","Standpipe hose station spacing should not exceed:","130 feet (Class I/III)","130 feet maximum spacing for Class I/III."],["QB-00439","Compliance & Ethics","Strobe flash rate is:","1-2 Hz","1-2 Hz flash rate for strobes."],["QB-00442","Compliance & Ethics","The monitoring system shows a 2.5-hour gap between consecutive clock-outs and clock-ins. No notes explain it. Field Coord flags it. What do you say?","Provide an honest account of what happened — drive time, fuel stop, lunch, whatever it was. GPS data, fuel card records, and phone location history can corroborate or contradict your account. Be accurate. Always.",""],["QB-00446","Compliance & Ethics","Voice intelligibility minimum CIS:","0.70","Minimum 0.70 CIS for voice systems."],["QB-00447","Compliance & Ethics","Weekly generator run test should be:","30 minutes under load","30 minutes weekly under load."],["QB-00448","Compliance & Ethics","What NICET level is required for Level 5?","Nicet iii+","Level 5 requires NICET III or higher certification."],["QB-00449","Compliance & Ethics","What are the 6 territories the National Compliance Lead oversees as National Director of Field Operations?","Az, ca, nv, ut, wy, mt","SOP Master Index Header"],["QB-00450","Compliance & Ethics","What benefit do Level 2 technicians receive?","Company vehicle","Level 2 technicians receive a company vehicle."],["QB-00451","Compliance & Ethics","What boundaries must be maintained with customers?","Professional boundaries at all times","Professional boundaries. Always. You have access to their security system, their home, their schedule. Act accordingly."],["QB-00454","Compliance & Ethics","What color polo shirts does AAA provide?","Red or black","AAA provides red or black polo shirts."],["QB-00456","Compliance & Ethics","What does the SOC (Monitoring) team operate?","24/7/365","SOC Monitoring operates 24/7/365 responding to alarm signals."],["QB-00457","Compliance & Ethics","What does the Warehouse team coordinate?","Parts ordering and job status based on availability","Warehouse coordinates parts ordering and updates job status based on availability."],["QB-00458","Compliance & Ethics","What ethical standard applies to discussing competitors?","Do not disparage competitors unfairly","Don't trash talk. Differentiate on YOUR strengths, not their weaknesses. It's classier and more effective. Let your work speak."],["QB-00459","Compliance & Ethics","What experience is required for Level 1 (Entry-Level) technician?","0-6 months","Level 1 Entry-Level requires 0-6 months experience."],["QB-00460","Compliance & Ethics","What experience is required for Level 2 (Intermediate) technician?","6-18 months","Level 2 requires 6-18 months experience."],["QB-00461","Compliance & Ethics","What experience is required for Level 3 (Advanced) technician?","18-36 months","Level 3 requires 18-36 months experience."],["QB-00462","Compl
