scope, custom design ensures proper coverage."],["QB-01559","Install Protocol","How do you properly test an installed system?","Test every sensor, camera feed, motion detector, and monitoring connection with the central station","Every device must be tested. A single untested sensor = a gap in protection."],["QB-01560","Install Protocol","What size recessed contact and magnet shall be installed on a steel door and doorframe?","3/4 inch","Steel doors require larger 3/4 inch recessed contacts due to magnetic interference."],["QB-01561","Install Protocol","You need a 16.5VAC x 20VA transformer but only have a 16.5VAC x 40VA. Can it be used?","Yes, higher VA rating is acceptable","Higher VA rating is acceptable - the transformer can supply MORE power than required."],["QB-01562","Install Protocol","Smoke detectors are wired in what configuration?","Parallel","Smoke detectors are wired in PARALLEL so if one fails, others still operate."],["QB-01563","Install Protocol","A fire loop E.O.L. resistor is installed where when the loop does not return to the panel?","At the last device","EOL resistors are installed at the LAST device when the loop doesn't return to panel."],["QB-01565","Install Protocol","When using a drill of any type, what safety device shall be worn?","Safety glasses/goggles","Safety glasses or goggles are required when using any drill."],["QB-01566","Install Protocol","On an RJ31X jack, what are terminals 1&8 used for?","Tip and Ring IN from phone company","Terminals 1&8 are Tip and Ring IN from the telephone company."],["QB-01567","Install Protocol","On an RJ31X jack, what are terminals 4&5 used for?","Tip and Ring OUT to house phones","Terminals 4&5 are Tip and Ring OUT to the house phones."],["QB-01568","Low Voltage","A 16VAC transformer provides approximately what DC voltage after rectification?","14V","After rectification and filtering, 16VAC yields roughly 14V DC."],["QB-01569","Low Voltage","A POTS telephone line has approximately what voltage when on-hook?","48V","Plain Old Telephone Service lines carry about 48V DC on-hook."],["QB-01570","Low Voltage","A UPS provides:","Uninterruptible power during outages","UPS (Uninterruptible Power Supply) provides backup power."],["QB-01571","Low Voltage","A power supply converts:","AC to DC","Power supplies convert AC mains to DC for equipment."],["QB-01572","Low Voltage","A typical fire alarm panel operates on:","24V DC","Most fire alarm systems operate on 24V DC."],["QB-01573","Low Voltage","A typical security panel operates on:","12V DC","Most security panels operate on 12V DC."],["QB-01574","Low Voltage","AC hot conductors are typically:","Black or red","Hot conductors are typically black or red."],["QB-01575","Low Voltage","AC neutral conductors are typically:","White or gray","Neutral conductors are white or gray."],["QB-01576","Low Voltage","Class 2 circuits are considered:","Power limited for safety","Class 2 circuits are power-limited, reducing shock/fire hazard."],["QB-01577","Low Voltage","Ferroresonant transformers provide:","Voltage regulation and conditioning","Ferroresonant transformers regulate and condition power."],["QB-01578","Low Voltage","Ground conductors are:","Green or bare","Ground conductors are green, green/yellow, or bare."],["QB-01579","Low Voltage","If a device draws 250mA, what percentage of an amp is this?","25%","250mA = 0.25A = 25% of 1 amp."],["QB-01580","Low Voltage","If a resistor is coded \"Orange, Black, Red, Gold\" what value and tolerance would it be?","3.3k ohms, 5%","Orange=3, Black=0, Red=×100, Gold=5% = 3,000 ohms (3.3k) ±5%."],["QB-01581","Low Voltage","If you took two 3K resistors and placed them in parallel, what would be the resulting total resistance?","1.5K ohms","Parallel resistance: 1/R = 1/3K + 1/3K = 2/3K, R = 1.5K."],["QB-01582","Low Voltage","If you took two 3K resistors and placed them in series, what would be the resulting total resistance?","6K ohms","Series resistance adds: 3K + 3K = 6K ohms."],["QB-01583","Low Voltage","If you took two 6-volt 4AH batteries and put them in parallel, what would be the resulting voltage?","6 volts","Parallel batteries: voltage stays same (6V), capacity adds."],["QB-01584","Low Voltage","If you took two 6-volt 4AH batteries and put them in series, what would be the resulting voltage?","12 volts","Series batteries: voltage adds (6V + 6V = 12V)."],["QB-01585","Low Voltage","Linear power supplies are:","Less efficient but produce cleaner power","Linear supplies are less efficient but have less electrical noise."],["QB-01587","Low Voltage","Ring voltage on a telephone line is approximately:","90V AC","Ring signal is approximately 90V AC at 20Hz."],["QB-01588","Low Voltage","Switching power supplies are:","More efficient but may produce noise","Switching supplies are efficient but may need filtering."],["QB-01589","Low Voltage","To reduce voltage drop, you can:","Use thicker wire or shorter runs","Thicker wire (lower gauge) has less resistance."],["QB-01590","Low Voltage","Transformer efficiency affects:","Heat generation and power available","Inefficient transformers waste power as heat and reduce output."],["QB-01591","Low Voltage","Two 12V batteries in parallel produce:","12V","Parallel connection maintains voltage but increases capacity."],["QB-01592","Low Voltage","Two 12V batteries in series produce:","24V","Series connection adds voltages: 12V + 12V = 24V."],["QB-01593","Low Voltage","Voltage drop in long cable runs is caused by:","Wire resistance","Wire resistance causes voltage drop over distance."],["QB-01594","Low Voltage","What are two common causes of ground faults?","Loose connections and damaged insulation","Ground faults are commonly caused by loose connections and damaged insulation."],["QB-01595","Low Voltage","What color typically indicates DC negative/ground?","Black","Black typically indicates negative/ground in DC circuits."],["QB-01596","Low Voltage","What color typically indicates DC positive?","Red","Red typically indicates positive in DC circuits."],["QB-01597","Low Voltage","What color wires are typically used for positive and negative in low voltage DC systems?","Red positive, Black negative","Standard convention: Red = Positive (+), Black = Negative (-)."],["QB-01598","Low Voltage","What does SELV stand for?","Safety Extra Low Voltage","SELV is Safety Extra Low Voltage, typically under 50V."],["QB-01599","Low Voltage","What does the electrical term EOLR stand for?","End of Line Resistor","EOLR = End of Line Resistor, used in alarm circuits for supervision."],["QB-01600","Low Voltage","What gauge wire is most commonly used for alarm system sensors?","22 AWG","22 AWG is the most common wire gauge for alarm sensors."],["QB-01601","Low Voltage","What is the nominal off-hook voltage on a P.O.T.S. line without ring?","48 volts","Plain Old Telephone Service operates at 48 volts DC off-hook."],["QB-01602","Low Voltage","What is the purpose of a power-limited circuit in low voltage installations?","To limit power and reduce fire/shock hazards","Power-limited circuits restrict power to reduce fire and shock hazards."],["QB-01603","Low Voltage","What is the typical operating voltage for most security panel aux power outputs?","12VDC","Most security panels provide 12VDC auxiliary power for sensors and accessories. Fire alarm panels typically use 24VDC."],["QB-01604","Low Voltage","What is the typical voltage for low voltage alarm systems?","12-24 vdc","Most low voltage alarm systems operate on 12-24 VDC."],["QB-01605","Low Voltage","What is the voltage of a standard car battery?","12V","Standard automotive batteries are 12 volts."],["QB-01606","Low Voltage","What voltage range is considered 'low voltage' for alarm systems?","0-50V","Low voltage systems typically operate at 50 volts or less, though some definitions extend to 70V for certain applications."],["QB-01607","Low Voltage","When a phone goes off-hook, the line voltage drops to approximately:","3-9V","Off-hook voltage drops to 3-9V DC during conversation."],["QB-01608","Low Voltage","Why is twisted pair wire used for alarm circuits?","It reduces electromagnetic interference and crosstalk","Twisted pair wire reduces electromagnetic interference (EMI) and crosstalk between circuits, improving signal integrity."],["QB-01609","Low Voltage","Write the Ohms value in numbers if a resistor is 3K.","3,000 ohms","3K = 3 kilo-ohms = 3,000 ohms."],["QB-01610","Low Voltage","If a resistor is coded 'Orange, Black, Red, Gold' what is its value and tolerance?","3,000 ohms (3K), 5%","Orange(3), Black(0), Red(×100) = 3,000 ohms. Gold = 5% tolerance."],["QB-01611","Low Voltage","On a car battery, what are the RED and BLACK terminal designations?","Red=Positive, Black=Negative","Red = Positive (+), Black = Negative (-) on batteries."],["QB-04006","Power & Batteries","A transformer converts:","AC voltage levels","Transformers change AC voltage levels."],["QB-04007","Power & Batteries","At what voltage should 12V sealed lead-acid batteries be replaced?","Below 10.5V under load","Batteries showing less than 10.5V under load or that cannot maintain adequate voltage during discharge testing should be replaced."],["QB-04008","Power & Batteries","Battery capacity is measured in:","Amp-hours (Ah)","Amp-hours measure battery capacity."],["QB-04009","Power & Batteries","Battery charging should be:","Automatic and supervised","Battery charging must be automatic with supervision."],["QB-04010","Power & Batteries","Battery load testing should be done:","Annually","Annual load testing verifies battery capacity."],["QB-04011","Power & Batteries","Battery polarity must be:","Observed correctly","Correct polarity is critical for proper operation."],["QB-04012","Power & Batteries","Battery terminals should be:","Clean and tight","Maintain clean, tight battery connections."],["QB-04013","Power & Batteries","Brownout protection prevents:","Equipment damage from low voltage","Brownout protection maintains operation during low voltage."],["QB-04014","Power & Batteries","Engine lubricating oil for fire pump diesel engines should be changed every:","50 operating hours","Diesel fire pump engine oil should be changed every 50 operating hours."],["QB-04015","Power & Batteries","Fire alarm batteries must provide:","24 hours standby plus 5-15 minutes alarm","Batteries must provide 24 hours standby + alarm operation."],["QB-04016","Power & Batteries","Fire alarm panels require how many power sources?","Two","primary and secondary - Primary and secondary (standby) power required."],["QB-04018","Power & Batteries","Float charging maintains:","Full battery charge","Float charging maintains batteries at full charge."],["QB-04019","Power & Batteries","For how long must a primary battery (non-rechargeable) of a smoke alarm meet all power requirements, including weekly testing?","1 year",""],["QB-04020","Power & Batteries","For how long must a primary battery (rechargeable) of a smoke alarm meet all power requirements, not including weekly testing?","6 months","Rechargeable batteries must meet requirements for 6 months without weekly testing."],["QB-04021","Power & Batteries","Ground fault on power supply indicates:","Insulation failure or wiring problem","Ground faults indicate wiring or insulation problems."],["QB-04022","Power & Batteries","How long must a primary (non-rechargeable) battery in a smoke alarm meet all power requirements?","1 year","Non-rechargeable batteries must last at least 1 year including weekly testing."],["QB-04023","Power & Batteries","How long must a primary (non-rechargeable) battery in a smoke alarm meet all power requirements, including weekly testing?","1 year","Non-rechargeable batteries must last at least 1 year including weekly testing."],["QB-04025","Power & Batteries","How often should alarm system batteries be replaced?","Every 3-5 years","Alarm batteries should be replaced every 3-5 years."],["QB-04027","Power & Batteries","Line-interactive UPS:","Regulates voltage and switches to battery","Line-interactive regulates voltage and switches during outage."],["QB-04028","Power & Batteries","Low battery trouble condition indicates:","Battery needs attention or replacement","Low battery trouble means batteries need service."],["QB-04030","Power & Batteries","Online UPS provides:","Continuous conditioned power","Online UPS continuously conditions power with no transfer time."],["QB-04031","Power & Batteries","Parallel battery connection:","Increases capacity (amp-hours)","Parallel connection increases capacity at same voltage."],["QB-04032","Power & Batteries","Power Sources & Batteries","What are the requirements for a rechargeable battery used as a secondary power source in a fire alarm system?","D"],["QB-04033","Power & Batteries","Power supply output should be:","Regulated and within specifications","Power supplies must provide regulated output within specs."],["QB-04034","Power & Batteries","Primary power for fire alarms should be:","Dedicated circuit with lockable disconnect","Primary power requires dedicated circuit with lockable disconnect."],["QB-04035","Power & Batteries","Sealed lead-acid batteries should be replaced every:","5 years","SLA batteries typically replaced every 5 years."],["QB-04036","Power & Batteries","Secondary power provides:","Backup during primary failure","Secondary power (batteries) provides backup."],["QB-04037","Power & Batteries","Series battery connection:","Increases voltage","Series connection adds voltages."],["QB-04038","Power & Batteries","Standby UPS:","Switches to battery only during outage","Standby UPS switches to battery when power fails."],["QB-04039","Power & Batteries","Step-down transformer:","Reduces voltage","Step-down reduces voltage (e.g., 120VAC to 16VAC)."],["QB-04040","Power & Batteries","Surge protection guards against:","Voltage spikes","Surge protection clamps voltage spikes."],["QB-04041","Power & Batteries","Trickle charging is:","Low-rate continuous charging","Trickle charging provides low continuous charge."],["QB-04042","Power & Batteries","UPS stands for:","Uninterruptible Power Supply","UPS is Uninterruptible Power Supply."],["QB-04043","Power & Batteries","VA rating of transformer indicates:","Power capacity","VA (volt-amps) indicates transformer power capacity."],["QB-04045","Power & Batteries","What does a transformer do in an alarm system?","Converts AC power to low voltage DC for the panel","Transformers convert 120VAC to low voltage (typically 16-18VAC) for panels."],["QB-04047","Power & Batteries","What is the difference between a primary battery and a secondary battery?","Primary batteries are non-rechargeable, while secondary batteries are rechargeable","Primary = non-rechargeable; Secondary = rechargeable backup batteries."],["QB-04048","Power & Batteries","What is the difference between a primary battery and a secondary battery in a fire alarm system?","Primary batteries are non-rechargeable, while secondary batteries are rechargeable","Primary = non-rechargeable; Secondary = rechargeable."],["QB-04049","Power & Batteries","What is the minimum battery capacity calculation method for fire alarm systems?","24 hours standby + 5 minutes alarm","Standard calculation is 24 hours standby plus 5 minutes of alarm operation."],["QB-04050","Power & Batteries","What is the purpose of a battery charger in a fire alarm system?","To maintain batteries at full charge and provide primary power","The battery charger maintains the secondary batteries at full charge and typically provides primary DC power to the system."],["QB-04051","Power & Batteries","What is the purpose of a fire alarm system battery backup?","Provide power during a power outage","Battery backup provides power to maintain fire alarm operation during power outages."],["QB-04052","Power & Batteries","What is the purpose of battery load testing?","To verify battery can maintain power under load","Load testing verifies the battery can perform under actual load conditions."],["QB-04055","Power & Batteries","What is the typical standby battery backup requirement for fire alarm systems?","24 hours standby + 5 minutes alarm","Fire alarms require 24 hours standby plus 5 minutes of alarm power."],["QB-04056","Power & Batteries","What is the typical standby battery requirement for burglar alarm systems?","4 hours standby + 4 minutes alarm","Burglar alarms typically require 4 hours standby + 4 minutes alarm."],["QB-04057","Power & Batteries","What type of battery is commonly used in alarm panels?","Sealed Lead Acid (SLA)","Sealed Lead Acid (SLA) batteries are standard in alarm panels."],["QB-04058","Power & Batteries","What voltage are most alarm panel backup batteries?","12V","Most alarm panel backup batteries are 12V."],["QB-04059","Power & Batteries","What voltage indicates a fully charged 12V fire alarm battery?","12.6V","A fully charged 12V battery should read approximately 12.6V."],["QB-04068","Technical Systems","Before Z-Wave include (new)?","Update firmware",""],["QB-04069","Technical Systems","All Z-Wave dead, PowerG works?","Router down",""],["QB-04070","Technical Systems","Bluetooth primary use?","File transfer",""],["QB-04123","Safety & First Aid","A burn that blisters is classified as:","Second degree","Second degree burns penetrate epidermis and cause blistering."],["QB-04124","Safety & First Aid","A proper ladder setup angle is:","4:1 ratio (1 foot out for every 4 feet up)","Ladder should be 1 foot out for every 4 feet of height."],["QB-04125","Safety & First Aid","An AED is used for:","Cardiac arrest","AED (Automated External Defibrillator) treats cardiac arrest."],["QB-04126","Safety & First Aid","An SDS provides:","Safety information for chemicals","Safety Data Sheets provide chemical safety information."],["QB-04127","Safety & First Aid","Arc flash PPE is rated by:","Cal/cm² (calories per square centimeter)","Arc flash PPE rated in cal/cm² based on incident energy analysis."],["QB-04128","Safety & First Aid","Are alcohol or drugs allowed on the job?","Absolutely not","prohibited - No alcohol or drugs are allowed on the job - this is a critical safety rule."],["QB-04129","Safety & First Aid","Before working on any circuit, you should:","Test to verify it's de-energized","Always test/verify circuits are de-energized before working - never assume."],["QB-04130","Safety & First Aid","Before working on electrical equipment:","Test to verify de-energized","Always test to verify equipment is de-energized."],["QB-04131","Safety & First Aid","Before working on electrical, first?","- LOTO","Lock Out Tag Out power source."],["QB-04132","Safety & First Aid","Burns should be treated by:","Cooling with water and covering","Cool burns with water, never apply butter or pop blisters."],["QB-04133","Safety & First Aid","CPR compressions should be:","2 inches deep at 100-120/min","CPR compressions should be 2 inches deep at 100-120/min."],["QB-04134","Safety & First Aid","Class C fires involve:","Energized electrical equipment","Class C fires involve energized electrical equipment."],["QB-04135","Safety & First Aid","Confined space entry requires:","Atmospheric testing and buddy system","Confined spaces require atmospheric testing and standby person."],["QB-04136","Safety & First Aid","Ergonomic lifting: keep load?","- Keep load close to body.",""],["QB-04138","Safety & First Aid","Fire extinguisher type for electrical fires?","- Class C for electrical fires.",""],["QB-04140","Safety & First Aid","First aid for electrical shock includes:","Disconnect power first, then check responsiveness","Disconnect power source before touching the victim."],["QB-04141","Safety & First Aid","First step responding to electrical shock victim:","Ensure power is off before touching","Never touch an electrical shock victim until power source is disconnected."],["QB-04142","Safety & First Aid","First step when someone is injured:","Check for breathing and circulation","Always check for breathing and circulation first before other interventions."],["QB-04143","Safety & First Aid","For severe bleeding:","Apply direct pressure","Apply direct pressure to control severe bleeding."],["QB-04145","Safety & First Aid","Hot work permits are required for:","Welding, cutting, or open flame work","Hot work permits required for welding, cutting, grinding."],["QB-04146","Safety & First Aid","How far from the wall should the base of a 12-foot ladder be?","3 feet","4:1 rule - base distance = height ÷ 4 = 12 ÷ 4 = 3 feet."],["QB-04147","Safety & First Aid","How far from wall should base of 12-foot ladder be?","3 feet","4:1 ratio - a 12 foot ladder base should be 3 feet from the wall."],["QB-04148","Safety & First Aid","How should a person be treated for shock?","Have them lay still and cover them to maintain body heat","Shock victims should lay still and be kept warm."],["QB-04149","Safety & First Aid","Is a maintenance card needed for vehicle service?","No, Donlen pays vendors directly","No maintenance card needed - Donlen pays vendors directly."],["QB-04150","Safety & First Aid","LOTO stands for:","Lockout/Tagout","LOTO = Lockout/Tagout - procedure to ensure equipment stays de-energized."],["QB-04151","Safety & First Aid","Ladder safety: maintain how many points of contact?","- Three points of contact.",""],["QB-04152","Safety & First Aid","Least likely to give electrical shock:","Touching only ground","Touching only ground without a live source creates no shock hazard."],["QB-04153","Safety & First Aid","Lock Out / Tag Out (LOTO) is required when:","Any time equipment must be de-energized for service","LOTO required whenever equipment is de-energized for service."],["QB-04154","Safety & First Aid","Lockout/Tagout (LOTO) prevents:","Accidental energization during maintenance","LOTO prevents accidental energization during work."],["QB-04155","Safety & First Aid","Minimum approach distance for unqualified persons to exposed 480V:","10 feet","Limited approach boundary for unqualified persons at 480V is 10 feet."],["QB-04156","Safety & First Aid","Never use water on:","Electrical or grease fires","Never use water on electrical or grease fires."],["QB-04157","Safety & First Aid","Normal oxygen level in atmosphere is:","20.9%","Normal atmospheric oxygen is 20.9%."],["QB-04158","Safety & First Aid","Only the person who placed a lock should:","Remove it","Only the person who placed lock should remove it."],["QB-04159","Safety & First Aid","PASS method for fire extinguisher?","- Pull pin, Aim, Squeeze handle, Sweep.",""],["QB-04160","Safety & First Aid","PASS stands for:","Pull Aim Squeeze Sweep","PASS: Pull pin, Aim, Squeeze handle, Sweep side to side."],["QB-04161","Safety & First Aid","PPE for working on energized fire alarm circuits:","Safety glasses and insulated gloves","Safety glasses and insulated gloves are required for energized circuit work."],["QB-04162","Safety & First Aid","PPE stands for:","Personal Protective Equipment","PPE is Personal Protective Equipment."],["QB-04163","Safety & First Aid","Safety & First Aid","How should a person be treated for shock?","B"],["QB-04164","Safety & First Aid","Safety glasses protect against:","Eye injuries from debris","Safety glasses protect eyes from debris and particles."],["QB-04165","Safety & First Aid","Shock treatment includes:","Keeping victim lying down and warm","Keep shock victims lying still and maintain body warmth."],["QB-04167","Safety & First Aid","The 4-to-1 rule for ladder placement means:","Base 1 foot away for every 4 feet working height","Base should be 1 foot out for every 4 feet of working height."],["QB-04168","Safety & First Aid","The 4-to-1 rule for ladders means:","Base 1 foot out for every 4 feet of height","4:1 ratio: base distance = height ÷ 4."],["QB-04169","Safety & First Aid","The top two rungs of a ladder:","Should not be used for standing","Never stand on top two rungs for stability."],["QB-04170","Safety & First Aid","To check circuit continuity, use:","Ohms/Continuity setting","Ohms or continuity setting verifies complete circuit path."],["QB-04171","Safety & First Aid","To measure DC voltage, set multimeter to:","DC v","Use DC V setting for DC voltage measurements."],["QB-04172","Safety & First Aid","What PPE should be worn when working on energized fire alarm circuits?","Safety glasses and insulated tools at minimum","Safety glasses protect from arc flash and debris. Insulated tools prevent accidental shorts even on low voltage systems."],["QB-04174","Safety & First Aid","What does 'OL' reading on multimeter indicate when measuring resistance?","Open Loop","infinite resistance/no continuity - OL (Over Limit) indicates infinite resistance, meaning circuit is open."],["QB-04176","Safety & First Aid","What information is needed when taking a vehicle for service?","Donlen Vehicle Number (DVN) and VIN","Provide the Donlen Vehicle Number (DVN) and VIN if needed."],["QB-04177","Safety & First Aid","What is the company's position on employee safety?","FIRST consideration in operating the business","Employee safety is the FIRST consideration in operating the business."],["QB-04178","Safety & First Aid","What is the first step when responding to an electrical shock victim?","Ensure the power is off before touching the victim","Never touch an electrical shock victim until you've ensured the power source is disconnected - you could become a victim too."],["QB-04179","Safety & First Aid","What is the minimum safe distance from overhead power lines when using an extension ladder?","10 feet","Maintain at least 10 feet clearance from overhead power lines."],["QB-04180","Safety & First Aid","What is the proper procedure before working on any electrical circuit?","Lock out/tag out the power source","Lockout/Tagout (LOTO) is the first safety step before any electrical work."],["QB-04185","Safety & First Aid","What should employees do if work is considered unsafe?","Report unsafe conditions and do not perform the task","Employees should report unsafe conditions and NOT perform unsafe work."],["QB-04188","Safety & First Aid","When ascending a ladder, maintain:","Three points of contact","Three points of contact at all times."],["QB-04189","Safety & First Aid","When climbing a ladder, maintain:","Three points of contact","Three points of contact (two hands/one foot or two feet/one hand) at all times."],["QB-04190","Safety & First Aid","When lifting heavy objects:","Keep back straight and lift with legs","Lift with legs, keep back straight, don't twist."],["QB-04191","Safety & First Aid","When someone is experiencing electrical shock, first:","Disconnect power source if safe to do so","Safely disconnect power before approaching victim."],["QB-04192","Safety & First Aid","When working in an attic during summer, what is the most important safety consideration?","Stay hydrated and watch for heat exhaustion","Heat exhaustion is a serious risk in hot attics; hydration is critical."],["QB-04193","Safety & First Aid","When working in attics, always:","Step only on joists or planking","Step only on joists to prevent falling through ceiling."],["QB-04194","Safety & First Aid","When working on a ladder, what is the proper angle for placement?","4-to-1 ratio (75.5 degrees)","The 4-to-1 rule: for every 4 feet of height, the base should be 1 foot from the wall, creating a 75.5-degree angle."],["QB-04196","Safety & First Aid","Which of the following is LEAST likely to give you an electrical shock?","Touching only ground","Touching only ground without a path to energized source won't cause shock."],["QB-04197","Safety & First Aid","Which of these should you do first if someone is injured?","Check for breathing and circulation","First check ABCs: Airway, Breathing, Circulation."],["QB-04198","Safety & First Aid","Who provides 24/7 driver support for fleet vehicles?","Donlen Fleet","Donlen Fleet provides 24/7 driver support."],["QB-04199","Safety & First Aid","Work boots should have:","Non-slip soles and toe protection","Work boots should have non-slip soles and safety toes."],["QB-04207","Safety & First Aid","Eye protection required when?","Drilling, attic, overhead, debris risk",""],["QB-04229","Sales Training","'Worth the cost?' Response?","Avoid question",""],["QB-04240","Sales Training","'24-hour monitoring' is a:","Feature","24-hour monitoring is what the service does - a feature."],["QB-04241","Sales Training","'Feel, Felt, Found' technique addresses objections by:","Showing empathy and providing proof","Feel, Felt, Found shows empathy and shares how others overcame same concern."],["QB-04242","Sales Training","'How soon could you install this?' is:","A verbal buying signal","This is a verbal buying signal indicating customer readiness."],["QB-04243","Sales Training","'I need to think about it' is what type of objection?","Timing","This is a Timing objection - customer isn't ready to decide now."],["QB-04244","Sales Training","'I've heard bad things about alarm companies' is what type?","Trust","This is a Trust objection - customer has concerns about the company/industry."],["QB-04245","Sales Training","'Peace of mind while traveling' is a:","Benefit","Peace of mind is what 24-hour monitoring means to the customer - a benefit."],["QB-04246","Sales Training","'That's too expensive' is what type of objection?","Price","This is a Price objection - customer perceives cost as too high."],["QB-04247","Sales Training","'We live in a safe neighborhood' is what type of objection?","Need","This is a Need objection - customer doesn't perceive the need for security."],["QB-04248","Sales Training","A benefit is:","What the feature MEANS to the customer","Benefits translate features into customer value."],["QB-04249","Sales Training","A feature is:","What the product IS or DOES","Features are product characteristics. Benefits are what features mean to customers."],["QB-04250","Sales Training","A Member says 'I need to think about it.' What's the technique?","Ask what specifically would help them decide, provide everything they need, mention scheduling","Respect the decision but narrow the concern. Ask what they'd need to decide, and create gentle urgency around install scheduling."],["QB-04251","Sales Training","A Member says 'I'll just use Ring/Nest cameras.' What's your angle?","Consumer cameras lack 24/7 monitoring, dispatch, POE reliability, and commercial-grade features","Position PoE + professional monitoring + emergency dispatch vs. WiFi notification on a phone. Commercial vs. consumer grade."],["QB-04252","Sales Training","A Member says 'It's too expensive.' What's the best response approach?","Compare the cost to what a single break-in costs — Stolen inventory, damaged property, insurance deductible","Reframe cost vs. consequence. A break-in costs far more than any bundle. Classic Security starts at less than most deductibles."],["QB-04253","Sales Training","A customer cancels a scheduled install before the tech arrives. Who handles it and what is the time requirement?","Coordinator + cors — Retention routing ≤15 minutes (SC-2)","SC-2"],["QB-04254","Sales Training","A customer requests a service plan upgrade after installation. Who initiates the change in the system?","Coordinator routes to billing; tech support consulted if needed","Sop-admin-001 / RACI — Billing"],["QB-04255","Sales Training","A customer wants to add a camera after the original install is complete. What process does this trigger?","Change order process — SC-8 if outside sow, CO in docusign 24-48HR","SC-8 / sop-coord-002"],["QB-04258","Sales Training","A trial close is used to:","Test customer readiness to buy","Trial closes gauge customer buying temperature throughout the process."],["QB-04259","Sales Training","An assumptive close sounds like:","When would you like installation scheduled?","Assumptive closes assume the sale and move to next steps."],["QB-04261","Sales Training","Building customer relationships leads to:","Loyalty, referrals, and business growth","Good relationships build business."],["QB-04262","Sales Training","Cell phone use on job sites should be:","Limited to work-related purposes","Limit phone use to work purposes."],["QB-04264","Sales Training","Children at service locations require:","Safety awareness and appropriate interaction","Be aware of children's safety."],["QB-04265","Sales Training","Consultative selling focuses on:","Understanding needs and providing tailored solutions","Consultative selling prioritizes understanding customer needs first."],["QB-04266","Sales Training","Customer privacy means:","Not sharing their information or discussing findings","Protect customer privacy."],["QB-04267","Sales Training","Customer questions should be:","Answered clearly and honestly","Answer questions clearly and honestly."],["QB-04268","Sales Training","Customer signatures confirm:","Work completed and customer understanding","Signatures confirm work and acknowledgment."],["QB-04269","Sales Training","Customers buy from people they:","Like and trust","Trust and rapport are the foundation of successful sales relationships."],["QB-04270","Sales Training","Discovery questions are used to:","Understand customer needs and situation","Discovery questions uncover needs, concerns, and buying motivations."],["QB-04271","Sales Training","Does member pricing update automatically in Salesforce?","No — You must message efrain, scott, or russ to manually apply","Member pricing does NOT auto-update. Contact Efrain, Scott, or Russ. Skip this step = angry callback."],["QB-04272","Sales Training","Expectations","What expectation should a member have about response time when their alarm triggers?","L2"],["QB-04273","Sales Training","Explaining system operation to customers should be:","Clear and in terms they understand","Explain in customer-friendly terms."],["QB-04274","Sales Training","Finding common ground helps:","Build trust and connection","Common ground builds rapport and trust - foundation of the relationship."],["QB-04275","Sales Training","First impression with customers is made within:","The first few seconds","First impressions form in seconds."],["QB-04276","Sales Training","Follow-up after installation:","Shows commitment to customer satisfaction","Follow-up demonstrates care."],["QB-04277","Sales Training","How are monitoring centers staffed?","24/7/365 with trained operators","24/7/365. Christmas morning, 3 AM on a Tuesday, hurricane season — someone's always watching. That's the promise."],["QB-04278","Sales Training","How can well-handled complaints affect customer loyalty?","Can actually increase loyalty","A great recovery INCREASES loyalty above where it was before the complaint. The service recovery paradox is real. Embrace complaints."],["QB-04279","Sales Training","How can you use the 'endowment effect' during a site survey?","Walk them through their business pointing out specific vulnerabilities — once they 'see' the solution in their space, they mentally own it and don't want to give it up","The endowment effect means people value things more once they feel ownership. When you say 'Camera one goes right here covering your register, camera two covers the back door' — they start SEEING it installed. Now NOT buying feels like losing something."],["QB-04280","Sales Training","How do you handle 'I need to think about it'?","Ask what specifically they'd like to think about to find the real objection","'What specifically would help you decide?' — uncovers the REAL objection hiding behind 'think about it.' It's never about thinking."],["QB-04281","Sales Training","How do you handle 'I've heard bad things about security companies'?","Appreciate their honesty, ask what specifically concerns them, then address with credentials","Thank them for sharing, ask what specifically they heard, then address directly with YOUR credentials. Transparency destroys skepticism."],["QB-04285","Sales Training","How many labor hours are in the Business Classic Security bundle?","3 hours","3 hours of commercial labor — the fastest install."],["QB-04288","Sales Training","How should referral leads be handled?","Follow up promptly and keep referring customer informed","IMMEDIATELY. A referral lead cools fast. Plus, tell the referrer you reached out — reinforces the behavior and earns more referrals."],["QB-04289","Sales Training","How should you connect features when presenting?","Connect features to benefits and benefits to customer-stated needs","Feature → Benefit → THEIR stated need. Full chain. 'You mentioned X (need), this does Y (feature), so you get Z (benefit).'"],["QB-04290","Sales Training","How should you educate customers during the sales process?","Enable them to make informed decisions","Informed decisions. Educated customers buy bigger, complain less, and refer more. Knowledge = power for everyone."],["QB-04292","Sales Training","How should you handle a member complaint?","Listen actively, empathize, and work toward resolution","Listen, empathize, and work toward resolution - Members First approach."],["QB-04293","Sales Training","How should you handle being late to an appointment?","Call ahead to inform the member and apologize","Always call ahead if running late - communication is key."],["QB-04294","Sales Training","How should you mirror a customer?","Match body language and communication style appropriately","Match their energy, pace, posture — subtly. They lean in, you lean in. They're relaxed, you relax. Natural mirroring builds connection."],["QB-04295","Sales Training","How should you respond to 'We live in a safe neighborhood'?","Burglars target nicer neighborhoods; security covers more than burglary","Nice neighborhoods = nice stuff to steal. Plus security isn't just burglary — it's fire, medical, peace of mind. Reframe the conversation."],["QB-04296","Sales Training","If a customer clearly doesn't need a product, you should:","Be honest and recommend what they actually need","Integrity means recommending only what the customer actually needs."],["QB-04297","Sales Training","If you don't know an answer:","Say you'll find out and follow up","Admit when you need to find out more."],["QB-04298","Sales Training","In Feature-Benefit-Need selling, the NEED is:","The customer concern the benefit addresses","Need is the customer concern that the benefit addresses."],["QB-04299","Sales Training","Insurance discounts for monitored security typically range:","5-20%","Monitored security systems typically provide 5-20% homeowner's insurance discount."],["QB-04300","Sales Training","Knowing your competition allows you to:","Position your product's unique value","Competitive knowledge helps position your unique value proposition."],["QB-04301","Sales Training","Member Comm","A member is frustrated before you even start — Their last alarm company left a mess and didn't finish. First response?","L2"],["QB-04302","Sales Training","Member calls carrying frustrations from a previous security provider — how do you handle it?","Acknowledge, commit, give your number as personal guarantee","SSU Introduction Ch4"],["QB-04303","Sales Training","Objections should be viewed as:","Signs of engagement and interest","Welcome objections - they indicate the customer is engaged and considering."],["QB-04304","Sales Training","Open-ended questions:","Encourage detailed responses","Open-ended questions encourage customers to share more information."],["QB-04305","Sales Training","Ownership language like 'When we have the system...' indicates:","Customer readiness to buy","Ownership language shows mental ownership - a strong buying signal."],["QB-04306","Sales Training","Paperwork should be completed:","Accurately and before leaving","Complete paperwork on-site."],["QB-04307","Sales Training","Pets at customer homes should be:","Handled carefully with customer's guidance","Be careful and follow customer's wishes."],["QB-04308","Sales Training","Professional conduct includes:","Respectful communication and behavior","Maintain professional behavior."],["QB-04310","Sales Training","Referrals come from:","Satisfied customers","Happy customers refer others."],["QB-04311","Sales Training","Running late to an appointment requires:","Calling to notify the customer","Always notify if running late."],["QB-04313","Sales Training","Service Calls","You're on a service call at 4:45 pm friday. The issue will take 90 minutes. What do you do?","L3"],["QB-04314","Sales Training","Shoe covers should be used:","When entering clean or carpeted areas","Protect flooring with shoe covers."],["QB-04315","Sales Training","Social media posts about customers:","Should never reveal customer information","Never post customer information."],["QB-04316","Sales Training","The Alternative Close offers:","Two positive options to choose from","Alternative Close: 'Would Tuesday or Thursday work better for installation?'"],["QB-04317","Sales Training","The Assumptive Close:","Proceeds as if the customer has decided to buy","Assumptive Close proceeds as if purchase decision is made."],["QB-04318","Sales Training","The Summary Close involves:","Summarizing solution and transitioning to paperwork","Summary Close recaps the agreed solution and moves to completing the sale."],["QB-04319","Sales Training","The first step in L.A.C.E. is:","Listen completely without interrupting","Listen first - let the customer fully express their concern without interrupting."],["QB-04320","Sales Training","The main benefit of professional monitoring is:","24/7 response even when away","Professional monitoring provides 24/7 response regardless of homeowner location."],["QB-04321","Sales Training","The sales process begins with:","Building rapport","Building rapport and trust is the foundation before any selling begins."],["QB-04322","Sales Training","Upselling should be:","Based on customer needs and benefits","Suggest upgrades based on actual needs."],["QB-04323","Sales Training","Using the customer's name:","Builds rapport and personal connection","Using names creates personal connection and shows you're paying attention."],["QB-04324","Sales Training","What AI platform serves as the primary knowledge assistant for the 400+ field users?","Coworker (claude api-powered) — Ask wayne is only escalation","Sop-admin-003"],["QB-04329","Sales Training","What SOP covers the CoWorker AI Field User Guide?","Sop-admin-003",""],["QB-04330","Sales Training","What SOP covers the Go-Back Job Root Cause & Resolution Protocol?","Sop-svc-002",""],["QB-04331","Sales Training","What Salesforce product powers A3 Smart Home field operations?","Salesforce FSL (field service lightning)","Sop-admin-001"],["QB-04332","Sales Training","What are geo-services in interactive monitoring?","Location-based automation and reminders","Phone crosses geofence → system arms/disarms automatically. 'Forgot to arm' becomes impossible. Sell this hard."],["QB-04333","Sales Training","What are the four categories of objections?","Price, trust, need, timing","Price, Trust, Need, Timing. Every objection fits one of these buckets. Identify the bucket → apply the right technique."],["QB-04334","Sales Training","What backup does a monitoring center have for power failures?","Redundant communication paths and backup power","Backup power + redundant comms. A monitoring center that goes dark during a storm isn't worth paying for."],["QB-04335","Sales Training","What built-in feature makes CSVR easy to connect to cameras?","- The CSVR has built-in PoE ports for easy connection to routers and cameras.",""],["QB-04336","Sales Training","What can customers do through mobile app control?","Arm/disarm, view status, receive alerts","Arm, disarm, check status, get alerts — all from their phone. This is what modern monitoring looks like."],["QB-04337","Sales Training","What daily cost comparison helps overcome 'too expensive'?","Monthly investment equals about the cost of a pizza dinner","Pizza dinner. One dinner out per month = complete protection for everything they own. Makes it real, makes it small, makes it smart."],["QB-04338","Sales Training","What disaster recovery feature do professional monitoring centers have?","Multiple geographically separated facilities","Geographically separated. One center gets knocked out → another picks up seamlessly. Enterprise-grade redundancy."],["QB-04339","Sales Training","What discovery question sizes the sensor count?","'how many entry points does your business have?'","Entry point count tells you if 2 sensors are enough or if you need custom design. Most small businesses have 2-3 doors."],["QB-04340","Sales Training","What do customers buy from, according to consultative selling?","People they like and trust","People buy from people they LIKE and TRUST. Build rapport before you build a quote. Relationships > transactions."],["QB-04342","Sales Training","What does Classic Security View add over Classic Security?","(2) Turret cameras, mounting hardware, ethernet card, and ADC video monitoring","It adds (2) turret cameras, mounting plates, conduit boxes, Ethernet connector card, and upgrades monitoring to ADC Video."],["QB-04343","Sales Training","What does L.A.C.E. stand for in objection handling?","Listen, acknowledge, clarify, explore","Listen, Acknowledge, Clarify, Explore. Memorize it. Use it. Every. Single. Objection."],["QB-04344","Sales Training","What does L.A.C.E. stand for?","Listen, Acknowledge, Clarify, Explore","L.A.C.E. is the objection handling framework: Listen, Acknowledge, Clarify, Explore."],["QB-04345","Sales Training","What does UL-listed mean for a monitoring center?","Meets stringent security and reliability standards","UL listing = gold standard. Stringent testing, redundant systems, backup power, trained operators. Not optional."],["QB-04346","Sales Training","What does \"CC\" mean when logged in Salesforce FSL?","Cannot Complete","Cannot Complete — a documented status when a technician cannot finish a job. This triggers the CC protocol under SOP-SVC-001."],["QB-04347","Sales Training","What does a customer asking about installation timing signal?","Verbal buying signal — They're ready","'How soon can you install?' = 'I'm buying.' Recognize it. Transition to close. Don't keep selling past the decision."],["QB-04348","Sales Training","What does a customer reviewing proposal documents closely indicate?","A non-verbal buying signal","Studying the proposal = seriously considering. Let them read. Don't interrupt. When they look up — close."],["QB-04349","Sales Training","What does activity monitoring track in interactive services?","Sensor activity patterns","Sensor patterns. Know when doors open, motion triggers, routines change. Powerful for commercial — and elderly care."],["QB-04350","Sales Training","What does dual-path monitoring communication provide?","Maximum reliability with automatic failover","Maximum reliability. Primary path fails → automatic failover to secondary. Both paths must fail for signal loss. That's resilience."],["QB-04351","Sales Training","What does video monitoring provide through interactive services?","Live view, recorded clips, motion alerts","Live view, clips, motion alerts. See what triggered the alarm before dispatch even arrives. This is the future of monitoring."],["QB-04352","Sales Training","What equipment is in Business Classic Security?","IQ4 panel, (2) Entry sensors, (1) Motion detector","Classic Security: IQ4 345 Panel + (2) commercial entry sensors + (1) motion detector + monitoring."],["QB-04353","Sales Training","What expectations should be set with customers before installation?","Duration, what to expect, training, testing period, support contact","Duration, process (yes, we drill), training at completion, testing period, support contacts. Prepared customers are happy customers."],["QB-04354","Sales Training","What happens if a customer refuses to sign a Change Order for out-of-scope work?","Work pauses — SC-5 triggers, escalate to ops + sales directors","SC-5"],["QB-04356","Sales Training","What insurance-related ROI point should you mention?","Many carriers offer 5-20% premium discounts for professionally monitored systems — Can offset monthly monitoring cost","Insurance discounts of 5-20% for professionally monitored systems can offset or exceed the monthly monitoring cost."],["QB-04357","Sales Training","What is 'mirroring' and how does it build rapport?","Repeating the last 2-3 words of what the Member said to encourage them to keep talking and feel heard","If a Member says 'I'm worried about break-ins at night,' you say '...break-ins at night?' and pause. They'll naturally elaborate, giving you more detail to tailor your recommendation. Mirroring builds trust unconsciously."],["QB-04358","Sales Training","What is 'selling past the close' and why is it dangerous?","Continuing to present after the customer is ready to buy — Risks introducing new objections","Customer says yes in their head → you keep talking → you introduce doubt → they 'need to think about it.' You just UNSOLD a sale."],["QB-04359","Sales Training","What is Sedona used for in the A3 ecosystem?","Legacy scheduling/coordination platform alongside FSL","Sop-coord-001"],["QB-04360","Sales Training","What is a BENEFIT in the Feature-Benefit-Need framework?","What the feature means to the customer","Benefit = what it MEANS to them. 'PoE power' means nothing. 'Never worry about WiFi drops killing your cameras' — that sells."],["QB-04361","Sales Training","What is a FEATURE in the Feature-Benefit-Need framework?","What the product is or does","Feature = what it IS or DOES. '4MP resolution' is a feature. 'Crystal-clear evidence footage' is the benefit. Know the difference."],["QB-04362","Sales Training","What is a specific way to ask for referrals?","Who do you know who might benefit from this protection?","Specific. 'Who do you KNOW who might benefit?' Not 'do you know anyone?' Specific prompts generate specific names."],["QB-04363","Sales Training","What is ethical urgency and how do you create it without being pushy?","Connect the purchase to their own timeline: 'You mentioned the new inventory arrives next month — want the cameras up before that?'","Ethical urgency uses the Member's OWN timeline and priorities. It's not fake scarcity — it's helping them see why acting now serves THEIR interests. This respects the Member while creating natural momentum."],["QB-04364","Sales Training","What is proper phone etiquette when calling a member?","Identify yourself, company, and purpose of call","Identify yourself, your company, and the reason for your call."],["QB-04366","Sales Training","What is the 'reciprocity principle' and how does a thorough site survey trigger it?","If you give something valuable first, people feel compelled to give back — a detailed survey provides free expert advice they feel obligated to act on","When you walk a Member's property, identify vulnerabilities, and provide expert recommendations for free, you've given them real value. Psychologically, they feel a pull to reciprocate — often by moving forward with the purchase."],["QB-04367","Sales Training","What is the 30-Day Deposit Expiration rule?","Day 30 is a hard cancel — No extensions — Total sale loss","SC-6 / SLA Matrix"],["QB-04368","Sales Training","What is the 5-system stack used in A3 field operations?","Salesforce FSL, rootstock, fulcrum, sedona, alarm.com","All Coordination SOPs"],["QB-04369","Sales Training","What is the 70/30 rule in consultative selling?","Listen 70%, speak 30%","70% LISTEN, 30% talk. If your mouth is moving more than theirs, you're selling wrong. Shut up and listen."],["QB-04371","Sales Training","What is the Alternative Close?","Offer a choice between two positive options","'Saturday morning or weekday afternoon for installation?' Both answers = yes. Classic technique, works every time when timed right."],["QB-04372","Sales Training","What is the Assumptive Close?","Proceed as if the decision has been made","'I have availability next Tuesday. Let me get your info for monitoring.' Confident, natural, no hesitation. If rapport is built, this closes cleanly."],["QB-04375","Sales Training","What is the SOP ID for Salesforce Task Creation Standard Protocol?","Sop-admin-001",""],["QB-04376","Sales Training","What is the Summary Close technique?","Summarize agreed solution and naturally transition to paperwork","Recap everything agreed upon → smoothly transition to paperwork. No awkward 'so... do you want it?' Just flow into the close."],["QB-04379","Sales Training","What is the consultative seller's identity?","Security consultant first, salesperson second","CONSULTANT first. When you lead with expertise and genuine concern, the sale follows. When you lead with commission breath, deals die."],["QB-04381","Sales Training","What is the first step in L.A.C.E.?","Listen — Let them fully express their concern without interrupting","LISTEN. Full stop. Don't interrupt. Don't start formulating your response. Let them finish. Then acknowledge."],["QB-04382","Sales Training","What is the first step in handling a customer complaint?","Listen actively and let the customer vent","LISTEN. Let them vent. Don't interrupt, don't defend, don't explain. Let the pressure out FIRST, then solve."],["QB-04383","Sales Training","What is the first step when arriving at a member's home?","Introduce yourself and verify the appointment","Always introduce yourself professionally and verify the appointment."],["QB-04384","Sales Training","What is the foundation of trust in a sales relationship?","Building genuine rapport","Genuine rapport. Not scripted small talk. Actually care about their situation. People can smell fake from a mile away."],["QB-04385","Sales Training","What is the ideal listening to speaking ratio in consultative selling?","70/30 (listen to speak)","Listen 70%, speak 30% - understanding customer needs is paramount."],["QB-04386","Sales Training","What is the key differentiator between professional security and DIY?","Professional monitoring","Professional monitoring. Equipment without monitoring is just an expensive noise maker. Monitoring = response."],["QB-04388","Sales Training","What is the main advantage of cellular monitoring communication?","Cannot be cut and works during outages","Can't cut a cellular signal. Phone line? Snip. Cable? Snip. Cell signal? Good luck. Plus works in power outages."],["QB-04389","Sales Training","What is the main vulnerability of IP/Broadband monitoring?","Dependent on internet service, vulnerable to outages","Internet goes down → so does your signal path. That's why dual-path exists. Never rely on a single comm path for commercial."],["QB-04390","Sales Training","What is the maximum response time for customer inquiries?","24 hours maximum","24 hours. MAX. In security, response time = credibility. If you can't respond in a day, what happens during an alarm?"],["QB-04398","Sales Training","What is the purpose of the 'Clarify' step in L.A.C.E.?","Ask questions to ensure you understand the real objection","Find the REAL objection. 'Too expensive' might mean 'I don't see the value yet.' Clarifying saves you from solving the wrong problem."],["QB-04399","Sales Training","What is the quarterly follow-up touchpoint for?","Touch base, mention upgrades or promotions","Quarterly touch = relationship maintenance + upgrade pipeline. Stay top of mind. Out of sight = out of contract renewal."],["QB-04400","Sales Training","What is the recommended follow-up schedule at 30 days?","Review experience and ask for referrals","30-day check-in: Review experience + referral ask. They've lived with it for a month, they know if they love it. Now ask."],["QB-04401","Sales Training","What is the target CC (Cannot Complete) rate for field operations?","Less than 5%","Sop-svc-001"],["QB-04402","Sales Training","What makes Entry Video the simplest bundle?","Just 2 cameras + 2 microsd cards + monitoring — No panel, no switch, no CSVR","Entry Video is stripped to essentials: (2) cameras, (2) MicroSD cards, Smart Video monitoring. Nothing else."],["QB-04406","Sales Training","What monitoring service is included with Security View bundles?","- Security View bundles include Security Monitoring with ADC Video service.",""],["QB-04407","Sales Training","What must you find through observation and conversation?","Common ground","Common ground. Family photos, sports gear, hobby room — observe and connect authentically. You're building a relationship, not running a script."],["QB-04408","Sales Training","What non-verbal signal shows a customer is engaged and considering?","Leaning forward with engaged body language","Leaning forward = interested. Combined with nodding and eye contact? That's a green light. Recognize it and act."],["QB-04410","Sales Training","What panel is included in the Business Classic Security bundle?","- The Business Classic Security bundle includes the IQ4 345 Panel.",""],["QB-04411","Sales Training","What protocols are tailored to by monitoring centers?","Alarm response protocols tailored to signal type","Signal type determines response. Intrusion → police. Fire → fire dept. Medical → EMS. Panic → immediate. Know the protocols."],["QB-04412","Sales Training","What question determines whether the Member needs an alarm panel?","'do you need intrusion protection — Door sensors, motion detection, monitoring?'","Intrusion protection = alarm panel. If yes → Security bundle. If no → Video-only bundle."],["QB-04413","Sales Training","What should an annual customer touchpoint include?","System review and upgrade consultation","Annual system review + upgrade consult. Technology changes, their needs evolve. Proactive upgrades = revenue + loyalty."],["QB-04414","Sales Training","What should you NEVER do when handling price objections?","Immediately offer a discount","Never lead with discount. It devalues your product and trains them to ask for more. Establish value FIRST, then discuss investment."],["QB-04415","Sales Training","What should you be respectful of during the meeting?","Their time and home/property","Their TIME and their SPACE. Muddy boots on white carpet? Running 30 min over? Way to lose a sale and a referral."],["QB-04416","Sales Training","What should you do BEFORE installation day?","Confirm date/time, provide work order, note access issues, set expectations","Full pre-install prep: confirmed date, detailed work order, access notes, customer expectations set. No surprises on install day."],["QB-04417","Sales Training","What should you do before leaving a job site?","Demonstrate the system, clean up, and get sign-off","Demo the system, clean work area, and obtain member sign-off."],["QB-04418","Sales Training","What should you do when you recognize buying signals?","Transition naturally to the close without being pushy","Stop selling and START CLOSING. Biggest mistake new reps make: getting the green light and then running another lap."],["QB-04419","Sales Training","What should you recommend as if designing for?","Your own family","YOUR OWN FAMILY. If you wouldn't put it in your mom's house, don't put it in theirs. That's your ethical compass."],["QB-04420","Sales Training","What should you use throughout the conversation to build rapport?","The customer's name","Their NAME. Use it naturally. 'Great question, Sarah.' It's the sweetest sound to any person's ears. Use it."],["QB-04422","Sales Training","What smart home integrations are available through monitoring services?","Lights, locks, thermostats, garage doors","Lights, locks, thermostats, garage doors. Security becomes the hub of their smart building. Massive upsell opportunity."],["QB-04423","Sales Training","What storage solution comes with Business Classic Video?","- Business Classic Video uses (4) MicroSD cards and a PoE Switch — no CSVR.",""],["QB-04424","Sales Training","What system do technicians use for field documentation, photos, and QA sign-off?","Fulcrum","Sop-svc-001 / SLA matrix"],["QB-04425","Sales Training","What system is used to issue and track Change Orders?","Docusign","SC-8"],["QB-04426","Sales Training","What triggers the 48-Hour Billing Advance clock in FSL?","QA/TL sign-off in fulcrum gates the 48-HR billing advance","SLA Matrix — 48-Hr Billing Advance"],["QB-04427","Sales Training","What verbal signal indicates a customer is ready to buy?","Ownership language like 'when we have the system...'","'When WE have...' 'OUR keypad...' — they're already mentally owning it. Close NOW. Don't keep selling past the sale."],["QB-04428","Sales Training","What's the 'Assumptive Close' technique?","Act as if they've decided and move to scheduling: 'does tuesday or thursday work better for install?'","When the Member is engaged and nodding along, move to scheduling. Assume the sale is made."],["QB-04429","Sales Training","When a customer asks about payment options, what should you recognize?","A verbal buying signal indicating readiness","Payment question = buying signal. They're not asking how to pay for something they don't want. Move to close."],["QB-04430","Sales Training","When a customer involves others ('Honey, what do you think?'), what does it signal?","They're seeking consensus to move forward — A buying signal","Bringing in the decision partner = looking for validation to say yes. Address both parties. Get the nod from both."],["QB-04431","Sales Training","When a customer is unhappy:","Listen, empathize, and try to resolve","Try to resolve issues on-site."],["QB-04432","Sales Training","When arriving at a customer's home:","Knock/ring and identify yourself professionally","Announce yourself professionally at the door."],["QB-04433","Sales Training","When customer says 'I need to think about it,' you should:","Ask what specifically they need to think about","Probe to understand the real objection behind the stall."],["QB-04434","Sales Training","When problems are discovered during service:","Inform customer and offer solutions","Be transparent about issues found."],["QB-04435","Sales Training","When should the first post-installation follow-up occur?","24-48 hours after installation","24-48 hours. 'How's the system working? Any questions?' Simple call, massive impact on retention and referrals."],["QB-04436","Sales Training","When should you ask for referrals?","After confirming customer satisfaction","AFTER satisfaction is confirmed. 'Happy with the system? Great — who else do you know who'd benefit?' Timing is everything."],["QB-04437","Sales Training","When should you present solutions in the consultative process?","After completing assessment and understanding customer needs","AFTER the assessment. Present before you understand? That's guessing, not consulting. Discovery FIRST, always."],["QB-04439","Sales Training","When working in occupied spaces:","Keep area clean and minimize disruption","Be respectful of customer's space."],["QB-04441","Sales Training","Which communication path provides the fastest transmission?","IP/broadband","IP/Broadband. Fastest transmission, lowest cost. But vulnerable to outages and physical line cuts."],["QB-04442","Sales Training","Which is a non-verbal buying signal?","Nodding while you explain features","Nodding = agreement = buying signal. Also: leaning forward, reviewing proposal, touching equipment samples. Read the body language."],["QB-04443","Sales Training","Which of these is a strong buying signal that means you should move toward closing?","The Member asks 'How long does installation take?' or 'Can you do it next week?'","When a Member starts asking logistics questions (timeline, scheduling, process), they've mentally already decided to buy. They're planning the HOW, not debating the IF. Recognize this and transition to scheduling immediately."],["QB-04444","Sales Training","Who has authority to approve a Change Order for scope changes?","Pm only — Residential ops pm track","SC-5 / SC-8"],["QB-04445","Sales Training","Who is Responsible for Rootstock Inventory in the SecOps RACI?","Residential ops (r) and warehouse/purchasing (r)","RACI — SecOps: Rootstock - Inventory"],["QB-04446","Sales Training","Who owns the 30-Day Deposit Expiration SLA?","Coordinator + sales + cors","SC-6"],["QB-04447","Sales Training","Who reviews a CC in Salesforce within 2 hours of it being logged?","Team lead via residential ops — 2-HOUR window or it escalates to ops director","SLA Matrix — Same-Day TL CC Review"],["QB-04448","Sales Training","Why does Classic Video include a PoE switch instead of a CSVR?","4 cameras need POE power and there's no CSVR — The switch provides connectivity at lower cost","Without a CSVR (which has built-in PoE ports), a PoE switch is needed to power and connect 4 cameras."],["QB-04449","Sales Training","Why is 'What would happen if someone broke in tonight and you had no system?' more powerful than 'Imagine how safe you'd feel with our system'?","Loss aversion — people fear losing what they have more than they desire gaining something new","Loss aversion is one of the strongest psychological drivers. Research shows losses feel roughly 2x more painful than equivalent gains feel good. Frame security as protecting what they already have."],["QB-04450","Sales Training","Why should objections be WELCOMED?","They are signs of customer engagement","Engagement. An objecting customer is a THINKING customer. Silence is worse — it means they've already mentally left."],["QB-04451","Sales Training","Why should you ask the Member to make small agreements ('Does that make sense?' 'Is protection for your team important?') throughout your presentation?","Commitment and consistency — small 'yes' answers create momentum toward the big 'yes'","Once someone commits to a position (even a small yes), they feel internal pressure to stay consistent. A chain of micro-agreements (yes, security matters → yes, I want cameras → yes, Tuesday works) builds toward the close naturally."],["QB-04452","Sales Training","Work area should be left:","Clean and organized","Clean up your work area."],["QB-04453","Sales Training","You should recommend what you would want for:","Your own family","Recommend what you would want for your own family - ethical selling."],["QB-04458","Sales Training","What distinguishes a 'Security View' bundle from a 'Video' bundle?","Security View includes an IQ4 alarm panel; Video bundles are cameras only","Security View = alarm + cameras. Video = cameras only. The panel is the difference."],["QB-04464","Sales Training","Does AAA Smart Home offer 0% APR financing?","Yes — 0% APR equipment financing for qualifying buyers","0% APR makes equipment affordable. Monthly payments instead of lump sum."],["QB-04465","Sales Training","How much can Members save on home insurance with AAA Smart Home?","Up to 8-15% depending on state (CA up to 10-15%, AZ/NV/UT/MT/WY up to 8%)","Insurance discount alone can offset or exceed the monthly monitoring cost."],["QB-04466","Sales Training","What qualifies a Member for fire-related deductible reimbursement?","Must have AAA Smart Home professionally monitored Smart Smoke Detector","Smart Smoke Detector extends Total Protection coverage to fire losses (excluding wildfires)."],["QB-04467","Sales Training","What promotional discount is currently available for new members?","Up to 30-40% off system equipment with qualifying purchase and monitoring subscription","Current promotions offer significant equipment discounts. Check current terms for specifics."],["QB-04469","Sales Training","What is the AAA Smart Home money-back or satisfaction guarantee?","Contact AAA for current satisfaction policies and terms","AAA stands behind their products and service. Specific terms vary — always check current policies."],["QB-04470","Sales Training","How does Occupancy Counting work?","Measures real-time occupancy and sends alerts when a threshold is reached","Set max occupancy and get notified when the count reaches your limit. Critical for compliance."],["QB-04471","Sales Training","What is People Counting and how is it different from Occupancy?","People Counting measures foot traffic through a virtual line in one direction","Occupancy = how many are inside. People Counting = how many crossed a line (in/out tracking)."],["QB-04472","Sales Training","How does Heat Mapping benefit a retail business?","Visualizes where people spend the most time — shows hot spots for merchandising","Place high-margin products in high-traffic zones. Data-driven merchandising from security cameras."],["QB-04473","Sales Training","What is Queue Monitoring and when should you recommend it?","Monitors wait times and line length, alerts when thresholds are reached","Restaurants, retail, banks — any business with customer lines benefits from queue alerts."],["QB-04474","Sales Training","What monitoring plan is required for BAA features?","Commercial Video Service or Business Analytics Add-on for standard Video account","BAA requires the appropriate video service level. Verify plan compatibility before promising features."],["QB-04475","Sales Training","What are the three main advantages of AAA Smart Security over Ring/Nest?","24/7 professional monitoring with dispatch, PoE reliability, commercial-grade analytics","Ring/Nest are consumer WiFi with phone notifications. AAA offers professional dispatch + PoE + BAA."],["QB-04476","Sales Training","Why is PoE better than WiFi for business cameras?","Hardwired = no interference, no bandwidth competition, consistent power, no signal drops","WiFi cameras compete for bandwidth, drop during peak usage, and require separate power."],["QB-04477","Sales Training","What happens when a Ring camera detects motion at 2 AM?","It sends a phone notification — that's it. No dispatch, no monitoring center response","Phone notification that you probably sleep through. AAA monitoring center contacts authorities immediately."],["QB-04479","Sales Training","Why can't consumer cameras match commercial-grade equipment?","Consumer cameras lack IP66 rating, varifocal lenses, BAA analytics, and professional recording","Commercial-grade = built for 24/7 operation in harsh conditions with professional features."],["QB-04480","Sales Training","What is the IQ4 Ethernet Card and when is it needed?","Ethernet adapter for the IQ4 Panel — required when integrating cameras with the alarm panel","Ethernet card enables the IQ4 to communicate with Alarm.com cameras for integrated alarm + video."],["QB-04483","Sales Training","What is the SmartMount system for the IQ4?","Wall mounting bracket included with every panel — table stand or IQ Base sold separately","SmartMount simplifies installation. IQ Base adds subwoofer for enhanced sound."],["QB-04484","Sales Training","Why is 'What would happen if someone broke in tonight?' a powerful question?","Loss aversion — people fear losing what they have 2x more than gaining something new","Loss aversion is the strongest psychological trigger in security sales."],["QB-04486","Sales Training","How do micro-commitments lead to a sale?","Small yeses build momentum — 'Is employee safety important?' → 'Would you want to know about a break-in?' → close","Each yes makes the next yes easier. Chain of agreement leads naturally to the buying decision."],["QB-04487","Sales Training","What is reciprocity and how does a site survey trigger it?","Giving free value (expert survey) creates social obligation to reciprocate (purchase)","Thorough site survey = free expert consultation. Members feel pulled to act on recommendations."],["QB-04488","Sales Training","How do you leverage AAA's authority bias?","Position as trusted advisor backed by 100+ years of AAA brand reputation","People defer to trusted brands and experts. AAA is both."],["QB-04490","Sales Training","What is the paradox of choice and how do you avoid it?","Too many options cause paralysis — narrow to 2-3 relevant bundles","'Good, better, best' shifts from 'should I buy?' to 'which one should I pick?'"],["QB-04491","Sales Training","How does the endowment effect work during a site survey?","Walk them through pointing out where cameras go — they mentally 'own' the system","Once they see it installed in their mind, NOT buying feels like losing something."],["QB-04492","Sales Training","What is status quo bias and how do you counter it?","People prefer current situation even if risky — make change easy and inaction risky","'We handle everything. Every day without cameras is a day your business is exposed.'"],["QB-04493","Sales Training","Why should you lead with emotion and support with logic?","Decisions are made emotionally and justified logically — protect people first, then show ROI","Lead: 'Protect your employees.' Support: 'System pays for itself with one prevented incident.'"],["QB-04494","Sales Training","What is mirroring and when do you use it?","Repeating their words builds rapport and encourages elaboration","Member: 'Break-ins at night.' You: '...break-ins at night?' (pause). They elaborate."],["QB-04495","Sales Training","What does 'sell the outcome, not the hardware' mean?","Members don't want cameras — they want to stop worrying about their business","Frame every feature as a benefit: '95ft night vision' = 'See your entire parking lot at midnight.'"],["QB-04496","Sales Training","What is the 80/20 listening rule?","Member talks 80% of the time, you listen 20% — every word reveals pain points","Listening is selling. The more they talk, the more ammunition you have to solve their problems."],["QB-04498","Sales Training","A Member says 'I'll just use Ring/Nest.' Your angle?","Consumer cameras lack 24/7 monitoring, dispatch, PoE, and commercial features","Ring sends a phone notification. AAA dispatches police. Night and day difference."],["QB-04499","Sales Training","A Member says 'I need to think about it.' Technique?","Ask what specifically would help them decide — find the real concern","Respect the decision but narrow the concern. Often it's price, partner buy-in, or uncertainty."],["QB-04501","Sales Training","What insurance ROI point should you mention?","5-20% premium discounts for professionally monitored systems","Insurance savings can offset or exceed monthly monitoring costs."],["QB-04502","Sales Training","What happens during a power outage?","IQ4 Panel has 24+ hour battery backup; CSVR needs UPS for continued recording","Panel stays armed on battery. For continuous camera recording, recommend a UPS for the CSVR."],["QB-04503","Sales Training","What happens if my internet goes down?","IQ4 fails over to LTE cellular backup; CSVR continues local recording","Dual-path panel communications + local CSVR recording = no gaps in protection."],["QB-04504","Sales Training","Can employees arm and disarm the system?","Yes — IQ4 supports 242 unique user codes with customizable permissions","Each employee gets their own code. Disarm photos capture who enters and when."],["QB-04506","Sales Training","Can I add more cameras or sensors later?","Yes — system supports up to 128 zones and 16 CSVR cameras","Start with a bundle and expand as needs grow. System is fully scalable."],["QB-04507","Sales Training","Can I integrate smart locks, lights, and thermostats?","Yes — IQ4 supports Z-Wave 700 for up to 137 smart home devices","Full automation: locks, lights, thermostats, garage doors — all from one panel."],["QB-04508","Sales Training","How do I get the insurance discount?","Contact your insurance provider with proof of professionally monitored system installation","Many carriers offer 5-20% discounts. Proof of monitoring = potential hundreds saved yearly."],["QB-04510","Sales Training","How many commercial properties are burglarized annually?","Over 42,000 commercial properties per year (2023 data)","42,000+ offices, 23,000+ restaurants, 12,000+ convenience stores burglarized annually."],["QB-04511","Sales Training","What percentage of burglars would avoid a property with an alarm?","Approximately 60% of burglars seek an alternative target if alarm is present","More than half of all burglars skip properties with visible security. Deterrence works."],["QB-04512","Sales Training","What percentage of reported burglaries are solved?","Only about 11-12% — prevention is far more effective than investigation","88% of burglaries go unsolved. Once it happens, your stuff is probably gone. Prevention is everything."],["QB-04513","Sales Training","Homes without security are how much more likely to be burglarized?","300% more likely — 3x the risk compared to homes with security systems","Properties without security systems are 3x more likely to be targeted."],["QB-04514","Sales Training","What time of day do most commercial burglaries occur?","Evenings and early morning hours when businesses are closed and unmonitored","24/7 monitoring means protection during the highest-risk overnight hours."],["QB-04515","Sales Training","What is the SmartView video timeline?","Visual timeline for searching recorded video by event type (person detected, door accessed)","Jump directly to important events instead of scrubbing through hours of footage."],["QB-04516","Sales Training","Can you arm/disarm the system remotely?","Yes — full arm/disarm control from the Alarm.com app on any smartphone","Forgot to arm? No need to drive back. Arm from your phone in seconds."],["QB-04517","Sales Training","Can multiple users access the same system?","Yes — up to 242 user codes, multiple app users with customizable permissions","Owner, manager, and employees can each have appropriate access levels."],["QB-04518","Sales Training","Can you view recorded video clips from the cloud?","Yes — Alarm.com stores motion-triggered clips in the cloud accessible from the app","Cloud clips + local recording = comprehensive video evidence from anywhere."],["QB-04519","Sales Training","Can the app control smart home devices beyond security?","Yes — lights, locks, thermostats, garage doors, and more through Z-Wave integration","One app, total control. Security + automation + energy management."],["QB-04520","Security & Intrusion","2-wire residential smoke detectors must be wired with:","An end-of-line resistor","2-wire smokes require an EOL resistor at the last device for proper zone supervision."],["QB-04521","Security & Intrusion","24-hour zone is:","Always active",""],["QB-04522","Security & Intrusion","24-hour zones are:","Always active regardless of arm state","24-hour zones active armed or disarmed."],["QB-04523","Security & Intrusion","A central station alarm system provides:","24/7 professional monitoring","Central stations provide professional 24/7 monitoring."],["QB-04524","Security & Intrusion","A control panel in a security system:","Processes sensor signals and controls system","The control panel is the brain that processes all signals."],["QB-04525","Security & Intrusion","A keypad is used to:","Arm/disarm the system and view status","Keypads provide user interface for system control."],["QB-04526","Security & Intrusion","A siren/sounder provides:","Local audible alarm notification","Sirens provide audible alarm notification."],["QB-04527","Security & Intrusion","A tamper switch detects:","Attempts to open or remove devices","Tamper switches detect enclosure opening or device removal."],["QB-04528","Security & Intrusion","A zone is:","A group of devices on one circuit","A zone groups devices on one circuit for monitoring and identification."],["QB-04529","Security & Intrusion","Access card type normally used for parking lots:","Barium Ferrite","Barium Ferrite cards are durable and work at longer ranges, ideal for parking."],["QB-04530","Security & Intrusion","Acoustic glass break detectors listen for:","Specific frequency pattern of breaking glass","Acoustic glass breaks detect the specific frequency signature."],["QB-04531","Security & Intrusion","Alarm verification calls:","Confirm alarm before dispatch","Verification calls help confirm legitimate alarms."],["QB-04532","Security & Intrusion","All of the following are acceptable alarm transmission methods except:
