<style>
:root{--red:#DA291C;--navy:#003087;--cer:#0070B9;--ink:#13213a;--muted:#55657d;--bg:#ffffff;--panel:#f3f6fa;--line:#d9e1ec;--ok:#1d7a43;--okbg:#e8f5ec;--warn:#9a5b00;--warnbg:#fff4df;--nobg:#fbe9e7;--dd:#1F3864;--gold:#C9A648;color-scheme:light}
[data-theme=dark]{--navy:#8fb3ff;--cer:#5fb3ec;--ink:#e6edf7;--muted:#9fb0c6;--bg:#0b1526;--panel:#122039;--line:#23395c;--ok:#5ccf8b;--okbg:#0f2a1c;--warn:#f0b65a;--warnbg:#2b2110;--nobg:#2c1513;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Cambria,Caladea,Georgia,serif;line-height:1.2;color:var(--navy);margin:.2em 0 .4em}
h1{font-size:1.75rem}h2{font-size:1.2rem;margin-top:1.4em}h3{font-size:1.05rem;margin:0 0 .2em}
p{margin:.4em 0}.lead{font-size:1.05rem;color:var(--muted);max-width:60ch}.small,small{color:var(--muted);font-size:.85rem}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cer);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:3px solid var(--red)}
.brand{display:flex;gap:10px;align-items:center}.brand b{display:block;font-family:Cambria,Georgia,serif;color:var(--navy);font-size:1.05rem}.brand small{display:block;line-height:1}
.orbit{width:30px;height:30px;border-radius:50%;border:3px solid var(--navy);position:relative;flex:none}.orbit::after{content:"";position:absolute;inset:-6px 3px;border:2px solid var(--red);border-radius:50%;transform:rotate(-28deg)}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:.9rem}.menu summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}.pop button:hover{background:var(--panel)}
main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;padding:8px 16px;font-size:.8rem;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
#sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--warn)}#sync[data-state=ok]::before{background:var(--ok)}#sync[data-state=wait]::before{background:var(--red)}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:24px;padding:12px 22px;font-weight:700;cursor:pointer;font-family:Cambria,Georgia,serif;font-size:1rem;margin:6px 6px 6px 0;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}.btn.gold{background:var(--gold);color:#1a1a1a}
.btn.file{position:relative;overflow:hidden}.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.link{background:none;border:0;color:var(--cer);text-decoration:underline;cursor:pointer;padding:0}
.crumb{margin:0}.err{color:var(--red);font-weight:700;min-height:1.2em}
.ok{color:var(--ok);font-weight:700}.warn{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:10px}
.safety{display:inline-block;background:var(--red);color:#fff;padding:6px 12px;border-radius:6px;font-weight:700}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0;background:var(--bg)}.card.quiet{background:var(--panel)}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input:not([type]),input[type=password],input[type=date]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.05rem}
.hint{display:block;margin-top:4px}
fieldset{border:0;padding:0;margin:14px 0}legend{font-weight:700;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;font-weight:400;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:7px 0;cursor:pointer;background:var(--bg)}
.opt input{margin-top:4px;flex:none;width:18px;height:18px;accent-color:var(--navy)}.opt:has(input:checked){border-color:var(--navy);background:var(--panel)}
/* door */
.door{min-height:100vh;display:grid;place-items:center;background:var(--dd);color:#fff;padding:24px}
.door-in{width:min(380px,100%);text-align:center}.mark svg{width:150px;height:150px;background:#fff;border-radius:50%;padding:8px}
.door h1{color:#fff;font-size:2.4rem;margin:.3em 0 0;letter-spacing:.01em}.door-sub{color:#cfd8ea;margin:0 0 18px}
.door label{color:#fff;text-align:left}.door input{background:#fff;color:#13213a;border-color:transparent}.door .err{color:#ffd0cc}.door .note{color:#cfd8ea;font-size:.9rem;margin-top:18px}.door .link{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.mark circle{animation:drift 2.4s ease-out 1 both}.mark circle:nth-of-type(3n){animation-delay:.25s}@keyframes drift{from{opacity:0;transform:translateY(6px)}to{opacity:1}}}
/* path */
.hero{padding:6px 0 4px}.kick{color:var(--red);font-weight:700;margin:0}
.meter{height:10px;background:var(--panel);border-radius:6px;overflow:hidden;margin:14px 0 4px;border:1px solid var(--line)}.meter span{display:block;height:100%;background:var(--navy)}
.bag{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}.slot{width:44px;height:44px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--line)}
.slot.got{border:2px solid var(--gold);color:var(--navy);background:var(--panel)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ic.big{width:44px;height:44px}.ic.earned{color:var(--gold);width:72px;height:72px}
.path{list-style:none;margin:18px 0;padding:0;counter-reset:s;position:relative}
.path::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:var(--line)}
.st{counter-increment:s;position:relative;padding-left:48px;margin:0 0 10px}
.st::before{content:counter(s);position:absolute;left:2px;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);border:2px solid var(--line);color:var(--muted);font-size:.9rem}
.st.done::before,.st.passed::before{content:"✓";background:var(--navy);border-color:var(--navy);color:#fff}
.st.review::before,.st.wait::before{border-color:var(--red);color:var(--red)}.st.open::before,.st.retry::before,.st.lapsed::before{border-color:var(--navy);color:var(--navy)}
.st button{width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.st button:hover:not(:disabled){border-color:var(--navy)}.st button:disabled{cursor:default;opacity:.7}
.st b{display:block;font-family:Cambria,Georgia,serif;color:var(--navy)}.st span{font-size:.9rem;color:var(--muted)}
.st.review span,.st.wait span{color:var(--red);font-weight:700}
/* learn + test */
.learn{display:grid;gap:10px;margin:16px 0}.lc{display:flex;gap:12px;border-left:4px solid var(--navy);background:var(--panel);border-radius:0 12px 12px 0;padding:12px 14px}
.lc .n{font-family:Cambria,Georgia,serif;font-size:1.4rem;color:var(--red);font-weight:700;line-height:1}
.cta{border-top:1px solid var(--line);padding-top:12px}
.q{border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.q legend{font-family:Cambria,Georgia,serif;font-size:1.05rem;color:var(--navy);padding:0 4px}
.qn{color:var(--red);margin-right:8px}.crit{color:var(--red);margin-right:6px;font-weight:700}
.stick{position:sticky;bottom:44px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:30px;padding:6px 6px 6px 18px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.res{text-align:center;padding:22px;border-radius:16px;margin:10px 0}.res.pass{background:var(--okbg)}.res.fail{background:var(--nobg)}
.score{font-family:Cambria,Georgia,serif;font-size:3.2rem;font-weight:700;margin:0;color:var(--navy)}
.actions{margin:8px 0 6px}
.rv{border-left:4px solid var(--ok);padding:8px 12px;margin:10px 0;background:var(--panel);border-radius:0 10px 10px 0}.rv.no{border-color:var(--red)}
.rv .you{color:var(--red)}.rv .right{color:var(--ok);font-weight:700}.rv .right::before{content:"Right answer: ";font-weight:400;color:var(--muted)}.rv .why{color:var(--muted);font-size:.92rem}
.att li{margin:6px 0}
.tools{display:grid;gap:8px;margin:12px 0}.tl{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tl small{display:block}.seg{display:flex;border:1.5px solid var(--navy);border-radius:20px;overflow:hidden;flex:none}.seg label{margin:0;font-weight:400}
.seg input{position:absolute;opacity:0}.seg span{display:block;padding:7px 14px;cursor:pointer}.seg input:checked+span{background:var(--navy);color:#fff}.seg input:focus-visible+span{outline:3px solid var(--cer)}
[data-theme=dark] .seg input:checked+span{color:#0b1526}.seg.wide{display:inline-flex}
.bigbag{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}.tile{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted)}
.tile.got{border:2px solid var(--gold);color:var(--navy)}.tile b{display:block;font-family:Cambria,Georgia,serif;margin-top:6px;color:var(--navy)}
/* team */
.tbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.tbar input{flex:1 1 220px;width:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:820px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}thead th{background:var(--panel);color:var(--navy);font-family:Cambria,Georgia,serif}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel)}td.c{text-align:center;font-weight:700}td.passed{color:var(--ok)}td.review,td.wait,td.retry{color:var(--red)}td.na{color:var(--line);text-align:center}td.nd{white-space:normal;min-width:180px;color:var(--muted)}
.mini{padding-left:18px}.mini li.no{color:var(--red)}.mini li.ok{color:var(--ok)}
.steps li{margin:8px 0}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--navy);color:#fff;padding:10px 18px;border-radius:24px;transition:.2s;max-width:90vw;z-index:9;pointer-events:none}
[data-theme=dark] #toast{color:#0b1526}#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
[data-theme=dark] .st.done::before,[data-theme=dark] .st.passed::before{color:#0b1526}
.demo{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:10px;font-weight:700}
.tour{min-height:60vh}.dots{display:flex;gap:6px;margin:6px 0 10px}.dot{width:22px;height:5px;border-radius:3px;background:var(--line)}.dot.on{background:var(--red)}.dot.past{background:var(--navy)}
.tnav{display:flex;justify-content:space-between;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.kn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}.kn summary{cursor:pointer;color:var(--navy);font-family:Cambria,Georgia,serif}.kn b{color:var(--red);margin-right:6px}
table.plain{min-width:0}table.plain tbody tr{cursor:default}
.topics,.list{display:grid;gap:8px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.row b{font-family:Cambria,Georgia,serif;color:var(--navy)}.row span{color:var(--muted);font-size:.9rem}.row:hover{border-color:var(--navy)}
.flash{border:2px solid var(--navy);border-radius:16px;padding:18px;margin:12px 0;min-height:220px}.flash h2{margin-top:.3em;font-size:1.3rem}
.ans{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}.ans .right{color:var(--ok);font-weight:700;font-size:1.1rem}.ans .why{color:var(--muted)}

.vlist{margin:14px 0}.vlist h2{font-size:1.05rem}.vrow{justify-content:flex-start;gap:12px;margin:6px 0}.vrow b{flex:1}.vp{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-size:.8rem;flex:none}.vrow.seen .vp{background:var(--navy)}
.vplayer{width:100%;max-height:72vh;background:#000;border-radius:12px;display:block;margin:10px auto}.yt{position:relative;width:100%;max-width:420px;aspect-ratio:9/16;margin:10px auto}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
#sting{position:fixed;inset:0;z-index:20;background:#0b1526;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}#sting video{max-width:90vw;max-height:80vh;border-radius:14px}#sting .link{color:#C9A648}
.ssulogo{height:44px;width:auto;background:#fff;border-radius:8px;padding:3px 5px;flex:none}.tourlogo{display:block;height:110px;width:auto;background:#fff;border-radius:12px;padding:8px 10px;margin:4px 0 12px}
.dopt{width:100%;text-align:left;cursor:pointer}.dopt.good{border-color:var(--ok);background:var(--okbg)}.dopt.badp{border-color:var(--red);background:var(--nobg)}.dopt:disabled{cursor:default;opacity:1;color:inherit}
.fbfab{position:fixed;right:14px;bottom:52px;z-index:6;border:0;border-radius:22px;padding:10px 16px;background:var(--navy);color:#fff;font:700 .95rem Calibri,Carlito,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}[data-theme=dark] .fbfab{color:#0b1526}
</style>

/* ---------- sha-256 (fallback when crypto.subtle is missing) ---------- */

const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;const bits=l*8;for(let i=0;i<8;i++)m[n-1-i]=Math.floor(bits/Math.pow(2,8*i))&255;
let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Uint32Array(64),r=(x,y)=>(x>>>y)|(x<<(32-y));
for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=(m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3];for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
let[a,bb,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
h=[h[0]+a|0,h[1]+bb|0,h[2]+c|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];}
return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");}
async function sha256(str){try{if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");}}catch(e){}return sha256js(str);}

/* ---------- record model ---------- */
const ID_RX=/^(DLR\d{3,5}|MWG|DEMO)-T\d{2,3}$/;
const isDemo=id=>/^DEMO-/.test(id||"");
function newRec(id,track){return{v:1,techId:id,dlr:isDemo(id)?"DEMO":id.split("-")[0].replace("DLR",""),track:track,created:now(),updated:now(),kickoff:null,tests:{},videos:{},vskip:{},loto:null,tools:{items:{},at:0},admin:{at:0,toolsOk:false,spot:"",review:{},owner:"",due:""}};}
function cur(){return DB.records[DB.current]||null;}
function touch(rec){rec.updated=now();if(!isDemo(rec.techId)&&DB.queue.indexOf(rec.techId)<0)DB.queue.push(rec.techId);save();flush();}
const reqMods=rec=>MODULES.filter(m=>!m.owner||rec.track==="owner");
function best(rec,id){const t=rec.tests[id];if(!t)return null;return t.attempts.filter(a=>a.pass).sort((x,y)=>y.at-x.at)[0]||null;}
function mstate(rec,m){
  if(m.kind==="read")return rec.kickoff?{s:"done",label:"Read"}:{s:"open",label:"Start here"};
  const t=rec.tests[m.id]||{attempts:[]},p=best(rec,m.id);
  if(p){const exp=addMonths(p.at,CONFIG.RECERT_MONTHS);if(now()<exp)return{s:"passed",label:"Passed "+p.score+"%",exp:exp};}
  if(m.id!=="M1"&&!best(rec,"M1"))return{s:"locked",label:"Opens after Module 1"};
  const cleared=(rec.admin.review||{})[m.id]||0,fails=t.attempts.filter(a=>!a.pass&&a.at>cleared);
  if(fails.length>=CONFIG.MAX_ATTEMPTS)return{s:"review",label:"Trainer review needed"};
  const last=t.attempts[t.attempts.length-1];
  if(last&&!last.pass&&now()-last.at<CONFIG.RETAKE_HOURS*H)return{s:"wait",label:"Retake "+fmtT(last.at+CONFIG.RETAKE_HOURS*H),until:last.at+CONFIG.RETAKE_HOURS*H};
  if(p)return{s:"lapsed",label:"Recert due"};
  return t.attempts.length?{s:"retry",label:"Retake open · "+fails.length+" of "+CONFIG.MAX_ATTEMPTS+" used"}:{s:"open",label:"Ready"};
}
function needs(rec){const n=[];reqMods(rec).forEach(m=>{const s=mstate(rec,m).s;if(s!=="done"&&s!=="passed")n.push(m.id==="K"?"Day 1":m.id);});
  const toolsDone=rec.tools&&rec.tools.at;
  if(!rec.loto)n.push("LOTO attestation");if(!toolsDone)n.push("Tool check");else if(!rec.admin.toolsOk)n.push("Tools confirm");
  if(rec.admin.spot!=="clear")n.push("Spot check");return n;}
function status(rec){const st=reqMods(rec).map(m=>mstate(rec,m).s);
  if(st.indexOf("review")>=0)return"Trainer review";if(st.indexOf("lapsed")>=0)return"Lapsed";
  return needs(rec).length?"In onboarding":"SSU-Certified";}

/* ---------- merge (device, imported file, relay) ---------- */
function merge(a,b){if(!a)return b;if(!b)return a;const o=JSON.parse(JSON.stringify(a));
  Object.keys(b.tests||{}).forEach(k=>{const seen={};o.tests[k]=o.tests[k]||{attempts:[]};o.tests[k].attempts.forEach(x=>seen[x.at]=1);b.tests[k].attempts.forEach(x=>{if(!seen[x.at])o.tests[k].attempts.push(x);});o.tests[k].attempts.sort((x,y)=>x.at-y.at);});
  o.videos=Object.assign({},b.videos||{},a.videos||{});o.vskip=Object.assign({},b.vskip||{},a.vskip||{});
  if(b.kickoff&&(!o.kickoff||b.kickoff.at>o.kickoff.at))o.kickoff=b.kickoff;
  if(b.loto&&(!o.loto||b.loto.at>o.loto.at))o.loto=b.loto;
  if(b.tools&&(b.tools.at||0)>(o.tools.at||0))o.tools=b.tools;
  if(b.admin&&(b.admin.at||0)>(o.admin.at||0))o.admin=b.admin;
  o.updated=Math.max(a.updated||0,b.updated||0);return o;}
function valid(r){return r&&typeof r==="object"&&ID_RX.test(r.techId||"")&&r.tests&&r.admin;}

/* ---------- relay sync ---------- */
let syncMsg="";
function syncLabel(){if(!CONFIG.RELAY_URL)return"Saved on this device only";if(!navigator.onLine)return"Offline. Will send when signal is back";
  if(DB.queue.length)return"Waiting to send "+DB.queue.length;return DB.lastSync?"Sent to SSU "+fmtT(DB.lastSync):"Connected to SSU";}
async function flush(){if(!CONFIG.RELAY_URL||!navigator.onLine||!DB.queue.length)return;
  for(const id of DB.queue.slice()){const rec=DB.records[id];if(!rec){DB.queue=DB.queue.filter(x=>x!==id);continue;}
    try{const r=await fetch(CONFIG.RELAY_URL,{method:"POST",body:JSON.stringify({action:"training",token:CONFIG.TRAIN_TOKEN,record:rec})});const j=await r.json();
      if(j&&j.ok){DB.queue=DB.queue.filter(x=>x!==id);DB.lastSync=now();}else{syncMsg="SSU refused the record ("+(j&&j.code||"no code")+").";break;}}catch(e){syncMsg="Could not reach SSU.";break;}}
  save();paintSync();}
async function pull(params){if(!CONFIG.RELAY_URL)return 0;try{const q=Object.keys(params).map(k=>k+"="+encodeURIComponent(params[k])).join("&");
  const r=await fetch(CONFIG.RELAY_URL+"?what=training&token="+encodeURIComponent(CONFIG.TRAIN_TOKEN)+"&"+q);const j=await r.json();
  if(!j.ok)throw new Error(j.code);let n=0;(j.records||[]).forEach(x=>{if(valid(x)){DB.records[x.techId]=merge(DB.records[x.techId],x);n++;}});save();return n;}catch(e){toast("Could not load from SSU: "+e.message);return -1;}}
function paintSync(){const el=$("#sync");if(el){el.textContent=syncLabel();el.title=syncMsg;el.dataset.state=!CONFIG.RELAY_URL?"local":DB.queue.length?"wait":"ok";}}
window.addEventListener("online",flush);

function shell(inner){const rec=cur(),isAdmin=DB.gate&&DB.gate.role==="admin",canTeam=DB.gate&&(DB.gate.role==="admin"||DB.gate.role==="dealer");

    if(m.id==="M2"){steps.push({key:"L",title:"Device LOTO attestation",label:rec.loto?"Signed "+fmt(rec.loto.at):m2?"Ready to sign":"Opens after the Module 2 test",s:rec.loto?"done":m2?"open":"locked",act:'data-go="loto"'});
      steps.push({key:"T",title:"Tool and equipment check",label:!rec.tools.at?"Not submitted":rec.admin.toolsOk?"Confirmed by trainer":"Submitted · waiting for trainer",s:rec.admin.toolsOk?"done":rec.tools.at?"wait":"open",act:'data-go="tools"'});}});
  {const fv=VIDEOS.filter(x=>x.mod==="F"),fw=fv.filter(x=>vDone(rec,x.id)).length;steps.push({key:"F",title:FIELD_DAY.title,label:rec.admin.vidsExcused?"Excused by trainer":fw+" of "+fv.length+" videos done",s:fw===fv.length?"done":"open",act:'data-go="vids"'});}
  steps.push({key:"S",title:"First-job spot check",label:rec.admin.spot==="clear"?"Cleared":rec.admin.spot==="not clear"?"Not cleared · trainer will follow up":"Done by your trainer on a real job",s:rec.admin.spot==="clear"?"done":"locked"});

  '<p class="lead">'+(st==="SSU-Certified"?"Recert is due in twelve months. Bi-weekly refreshers keep it live.":nd.length?"Still to clear: "+esc(nd.join(", "))+".":"")+'</p></div>'+
  '<div class="meter" role="img" aria-label="'+done+' of '+steps.length+' steps done"><span style="width:'+Math.round(done/steps.length*100)+'%"></span></div><p class="small">'+done+' of '+steps.length+' steps</p>'+bagStrip(rec)+'</section>'+
  '<ol class="path">'+steps.map(x=>'<li class="st '+x.s+'"><button '+(x.act&&x.s!=="locked"?x.act:'disabled')+'><b>'+esc(x.title)+'</b><span>'+esc(x.label)+'</span></button></li>').join("")+'</ol>'+
  '<div class="card quiet"><h2>Share with your trainer</h2><p>'+(CONFIG.RELAY_URL?"Your results send to SSU automatically. You can also save a copy.":"Results are saved on this device. Send the file to your trainer after each test so your team record stays current.")+'</p><button class="btn ghost" data-act="export">Send my record</button></div>';}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  const extra=shuffle(QPOOL.filter(p=>p[1]===id)).slice(0,CONFIG.POOL_DRAW).map(p=>({q:p[3],o:p[4],a:p[5],f:p[6]||"",pid:p[0]}));const qs=m.q.concat(extra);
  S={view:"test",mod:id,qs:qs,order:shuffle(qs.map((_,i)=>i)).map(qi=>({qi:qi,opts:shuffle(qs[qi].o.map((_,j)=>j))})),picks:{}};render();}

function grade(){const rec=cur(),m=MODULES.find(x=>x.id===S.mod);let right=0,crit=false;
  const marks=S.order.map((o,i)=>{const q=S.qs[o.qi],ok=S.picks[i]===q.a;if(ok)right++;else if(q.c)crit=true;return{o:o,ok:ok,pick:S.picks[i]};});

function download(name,text,type){const b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);}
async function exportRec(){const r=cur(),name="SSU record "+r.techId+".json",txt=JSON.stringify(r);
  try{const file=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){}
  download(name,txt,"application/json");}
function importFiles(files){let n=0,bad=0;const all=[...files].map(f=>f.text().then(t=>{let d;try{d=JSON.parse(t);}catch(e){bad++;return;}(Array.isArray(d)?d:[d]).forEach(x=>{if(valid(x)){x.imported=!DB.records[x.techId]||DB.records[x.techId].imported;DB.records[x.techId]=merge(DB.records[x.techId],x);n++;}else bad++;});}));
  Promise.all(all).then(()=>{save();toast(n+" record"+(n===1?"":"s")+" added"+(bad?", "+bad+" skipped":""));render();});}
function csv(){const rows=[["Dealer ID","Tech ID","Path"].concat(MODULES.map(m=>m.id==="K"?"Day 1":m.id)).concat(["Videos watched","LOTO signed","Tools confirmed","Spot check","Compliance status","Needs","Follow-up owner","Due date"])];
  Object.values(DB.records).filter(r=>!isDemo(r.techId)).forEach(r=>rows.push(["DLR "+r.dlr,r.techId,r.track].concat(MODULES.map(m=>{if(m.owner&&r.track!=="owner")return"n/a";const s=mstate(r,m);return s.s==="passed"?best(r,m.id).score+"%":s.label;})).concat([vidCount(r),r.loto?fmt(r.loto.at):"No",r.admin.toolsOk?"Yes":"No",r.admin.spot||"Not done",status(r),needs(r).join("; "),r.admin.owner,r.admin.due])));
  download("SSU team training "+new Date().toISOString().slice(0,10)+".csv",rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv");}

function drillView(){DB.drill=DB.drill||{seen:{},miss:{},rep:{}};const dr=DB.drill;
  if(!S.topic){const topics=["All"].concat([...new Set(QPOOL.map(p=>p[2]))]);const nrep=Object.keys(dr.rep).length;
    return '<h1>Practice drills</h1><p class="lead">Reps, not a test. Pick an answer, see why. Missed ones come back first next time.</p><div class="topics">'+topics.map(t=>{const deck=deckFor(t),seen=deck.filter(p=>dr.seen[p[0]]).length;return '<button class="row" data-topic="'+esc(t)+'"><b>'+esc(t==="All"?"All topics":dname(t))+'</b><span>'+seen+' of '+deck.length+' seen</span></button>';}).join("")+'</div>'+

   '</div><p class="small">'+q.length+' left in this pass</p>';}

const canSkipVids=r=>!!(r&&(r.track==="owner"||(DB.gate&&DB.gate.role==="admin")));
function vidCount(r){const v=vidsFor(r);if(r.admin&&r.admin.vidsExcused)return"excused";const w=v.filter(x=>r.videos&&r.videos[x.id]).length,k=v.filter(x=>!(r.videos&&r.videos[x.id])&&r.vskip&&r.vskip[x.id]).length;return w+"/"+v.length+" watched"+(k?", "+k+" skipped":"");}

  else if(f.id==="tst")grade();
  else if(f.id==="lf"){const r=cur();if($("#sig").value.trim().toUpperCase()!==r.techId){$("#lerr").textContent="Type your Tech ID exactly: "+r.techId;return;}r.loto={at:now(),statements:LOTO_STATEMENTS.length};touch(r);toast("Attestation signed");go("home");}
  else if(f.id==="tf"){const r=cur(),items={};TOOLS_LIST.forEach((_,i)=>{const c=f.querySelector('input[name=t'+i+']:checked');if(c)items[i]=c.value;});
    const miss=TOOLS_LIST.filter((t,i)=>!items[i]).length;if(miss){toast("Mark all "+TOOLS_LIST.length+" items. "+miss+" left.");return;}
    r.tools={items:items,at:now()};if(r.admin.toolsOk){r.admin.toolsOk=false;r.admin.at=now();}touch(r);toast("Tool check submitted");go("home");}
});
function theme(){document.documentElement.dataset.theme=DB.theme==="dark"?"dark":"light";}
theme();
if(/^https?:/.test(location.protocol)&&CONFIG.POOL_URL){fetch(CONFIG.POOL_URL,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(Array.isArray(j)&&j.length&&Array.isArray(j[0])&&j[0].length>=6){QPOOL=j;if(S.view==="drill"||S.view==="mod")render();}}).catch(()=>{});}
if(DB.current&&CONFIG.RELAY_URL&&gateOk())pull({tech:DB.current}).then(n=>{if(n>0)render();});
render();flush();
window.SSUOB={S:()=>S,mstate:mstate,needs:needs,status:status,merge:merge,newRec:newRec,DB:()=>DB,sha256js:sha256js};
})();

</script>
