is rated for wet and dry locations."],["QB-04948","Wiring & Color Codes","The ampacity of a conductor depends on:","Size, insulation type, and installation conditions","Ampacity depends on conductor size, insulation rating, and conditions."],["QB-04949","Wiring & Color Codes","The grounding electrode connects:","Electrical system to earth","Grounding electrodes connect the system to earth."],["QB-04950","Wiring & Color Codes","The neutral conductor:","Carries the maximum unbalanced current","The neutral conductor carries the maximum unbalanced current."],["QB-04951","Wiring & Color Codes","UF cable is designed for:","Direct burial underground","UF (Underground Feeder) is rated for direct burial."],["QB-04952","Wiring & Color Codes","UTP stands for?","- Unshielded Twisted Pair.",""],["QB-04953","Wiring & Color Codes","What are Optical Fiber Cables used for?","Communication","Optical fiber cables transmit light for communication, not current."],["QB-04956","Wiring & Color Codes","What does 'plenum-rated' cable mean?","Cable with fire-resistant jacket for use in air handling spaces","Plenum-rated cables have fire-resistant jackets that produce less smoke and toxic fumes, required in air handling spaces (plenums)."],["QB-04957","Wiring & Color Codes","What does a PoE camera connect to?","- PoE cameras connect directly to a PoE switch or a Commercial Streaming Video Recorder (CSVR).",""],["QB-04958","Wiring & Color Codes","What is the formula for calculating voltage drop in electrical wiring?","Voltage Drop = Current × Resistance × Distance","VD = I × R × D (or VD = 2 × K × I × D / CM for practical calculations)."],["QB-04959","Wiring & Color Codes","What is the function of Black wire in AC Power systems?","HOT (Ungrounded)","120V Line 1 - Most common hot conductor"],["QB-04960","Wiring & Color Codes","What is the function of Black wire in Audio/PA systems?","Audio: Negative (-)","Speaker negative"],["QB-04961","Wiring & Color Codes","What is the function of Black wire in DC Circuits systems?","DC negative/ground (-)","Negative/return/common"],["QB-04962","Wiring & Color Codes","What is the function of Black wire in Fire Alarm systems?","Fa: 24VDC negative (-)","Common/return"],["QB-04963","Wiring & Color Codes","What is the function of Black wire in Security systems?","Sec: Ground/common","Negative/return"],["QB-04964","Wiring & Color Codes","What is the function of Blue (C) wire in Thermostat systems?","24V common","Return/common"],["QB-04965","Wiring & Color Codes","What is the function of Blue wire in AC Power systems?","Hot","3-Phase Line 3 - Third phase conductor"],["QB-04966","Wiring & Color Codes","What is the function of Blue wire in Audio/PA systems?","Audio: Left channel","Stereo left"],["QB-04967","Wiring & Color Codes","What is the function of Blue wire in DC Circuits systems?","DC negative (alt)","Some systems"],["QB-04968","Wiring & Color Codes","What is the function of Blue wire in Data T568B systems?","Pin 4","Pair 1"],["QB-04969","Wiring & Color Codes","What is the function of Blue wire in Fire Alarm systems?","Fa: Nac negative (-)","Notification circuit -"],["QB-04970","Wiring & Color Codes","What is the function of Blue wire in Security systems?","Sec: Siren/bell (+)","Output positive"],["QB-04971","Wiring & Color Codes","What is the function of Brown (Aux/E) wire in Thermostat systems?","Aux/emergency heat","Heat pump backup"],["QB-04972","Wiring & Color Codes","What is the function of Brown wire in AC Power systems?","Hot","3-Phase (Alt) - Sometimes Line 1"],["QB-04973","Wiring & Color Codes","What is the function of Brown wire in Data T568B systems?","Pin 8","Pair 4"],["QB-04974","Wiring & Color Codes","What is the function of Brown wire in Fire Alarm systems?","Fa: Telephone/DACT","Phone line connection"],["QB-04975","Wiring & Color Codes","What is the function of Brown wire in Security systems?","Sec: Tamper","Enclosure tamper"],["QB-04976","Wiring & Color Codes","What is the function of Gray wire in AC Power systems?","NEUTRAL (Alternate)","Also grounded conductor"],["QB-04977","Wiring & Color Codes","What is the function of Green (G) wire in Thermostat systems?","Fan control","Blower fan"],["QB-04979","Wiring & Color Codes","What is the function of Green wire in Audio/PA systems?","Audio: 70V common","CV return"],["QB-04980","Wiring & Color Codes","What is the function of Green wire in Data T568B systems?","Pin 6","RX- - Pair 3 - Receive -"],["QB-04981","Wiring & Color Codes","What is the function of Green wire in Fire Alarm systems?","Fa: Slc data","Signaling line circuit"],["QB-04982","Wiring & Color Codes","What is the function of Green wire in Security systems?","Sec: Zone input 1","First sensor loop"],["QB-04983","Wiring & Color Codes","What is the function of Green/Yellow wire in AC Power systems?","Isolated ground","For sensitive equipment"],["QB-04984","Wiring & Color Codes","What is the function of Light Blue (Y2) wire in Thermostat systems?","Stage 2 cooling","2-stage cooling"],["QB-04985","Wiring & Color Codes","What is the function of Orange (O/B) wire in Thermostat systems?","Reversing valve","Heat pump changeover"],["QB-04986","Wiring & Color Codes","What is the function of Orange wire in AC Power systems?","High leg delta (208V)","Stinger leg - DANGEROUS!"],["QB-04987","Wiring & Color Codes","What is the function of Orange wire in Data T568B systems?","Pin 2","TX- - Pair 2 - Transmit -"],["QB-04988","Wiring & Color Codes","What is the function of Orange wire in Fire Alarm systems?","Fa: Auxiliary power","Aux 24V output"],["QB-04989","Wiring & Color Codes","What is the function of Orange wire in Security systems?","Sec: Aux output","Auxiliary trigger"],["QB-04990","Wiring & Color Codes","What is the function of Pink (W2) wire in Thermostat systems?","Stage 2 heat","2-stage heating"],["QB-04991","Wiring & Color Codes","What is the function of Pink wire in Fire Alarm systems?","Fa: Remote annunciator","Remote display"],["QB-04992","Wiring & Color Codes","What is the function of Purple wire in Fire Alarm systems?","Fa: Supervisory/relay","Supervisory circuits"],["QB-04993","Wiring & Color Codes","What is the function of Purple/Violet wire in AC Power systems?","Switched hot","From switch leg"],["QB-04994","Wiring & Color Codes","What is the function of Red (R) wire in Thermostat systems?","24V power","From transformer"],["QB-04995","Wiring & Color Codes","What is the function of Red wire in AC Power systems?","Hot","Line 2 (240V) - Second hot leg split phase"],["QB-04996","Wiring & Color Codes","What is the function of Red wire in Audio/PA systems?","Audio: Positive (+)","Speaker positive"],["QB-04997","Wiring & Color Codes","What is the function of Red wire in DC Circuits systems?","DC positive (+)","Positive power supply"],["QB-04998","Wiring & Color Codes","What is the function of Red wire in Fire Alarm systems?","Fa: 24VDC positive (+)","Power from FACP"],["QB-04999","Wiring & Color Codes","What is the function of Red wire in Security systems?","Sec: +12VDC power","Panel power output"],["QB-05000","Wiring & Color Codes","What is the function of White (W) wire in Thermostat systems?","Heat call","Stage 1 - Calls for heat"],["QB-05001","Wiring & Color Codes","What is the function of White wire in AC Power systems?","NEUTRAL (Grounded Conductor)","Return path to panel"],["QB-05002","Wiring & Color Codes","What is the function of White wire in Audio/PA systems?","Audio: 70V/25V hot","Constant voltage line"],["QB-05003","Wiring & Color Codes","What is the function of White wire in DC Circuits systems?","DC negative (alt)","Sometimes negative"],["QB-05004","Wiring & Color Codes","What is the function of White wire in Fire Alarm systems?","Fa: Common/return","Shared return path"],["QB-05005","Wiring & Color Codes","What is the function of White wire in Security systems?","Sec: Zone common","Zone return"],["QB-05006","Wiring & Color Codes","What is the function of White/Blue wire in Data T568B systems?","Pin 5","Pair 1"],["QB-05007","Wiring & Color Codes","What is the function of White/Brown wire in Data T568B systems?","Pin 7","Pair 4"],["QB-05008","Wiring & Color Codes","What is the function of White/Green wire in Data T568B systems?","Pin 3","RX+ - Pair 3 - Receive +"],["QB-05009","Wiring & Color Codes","What is the function of White/Orange wire in Data T568B systems?","Pin 1","TX+ - Pair 2 - Transmit +"],["QB-05010","Wiring & Color Codes","What is the function of Yellow (Y) wire in Thermostat systems?","Cooling call","Stage 1 - Calls for cooling"],["QB-05011","Wiring & Color Codes","What is the function of Yellow wire in AC Power systems?","Hot","3-Phase (Alt) - Sometimes Line 2"],["QB-05012","Wiring & Color Codes","What is the function of Yellow wire in Audio/PA systems?","Audio: Right channel","Stereo right"],["QB-05013","Wiring & Color Codes","What is the function of Yellow wire in DC Circuits systems?","DC signal/positive","Signal or alternate +"],["QB-05014","Wiring & Color Codes","What is the function of Yellow wire in Fire Alarm systems?","Fa: Nac positive (+)","Notification circuit +"],["QB-05015","Wiring & Color Codes","What is the function of Yellow wire in Security systems?","Sec: Zone input 2","Second sensor loop"],["QB-05017","Wiring & Color Codes","What is the minimum burial depth for rigid metal conduit under heavy traffic areas?","24 inches","Rigid metal conduit requires 24 inches burial depth under heavy traffic areas."],["QB-05018","Wiring & Color Codes","What is the normal voltage in a car battery?","12 volts","Standard car batteries are 12 volts."],["QB-05019","Wiring & Color Codes","What is the primary purpose of conductor sizing?","To ensure proper voltage delivery","Proper conductor sizing ensures adequate voltage delivery and prevents overheating."],["QB-05020","Wiring & Color Codes","What is the purpose of a ground fault in electrical systems?","An unintended connection between a conductor and ground that must be located and corrected","A ground fault is an unwanted condition where current flows through an unintended path to ground, which can cause system malfunctions or hazards."],["QB-05021","Wiring & Color Codes","What is the voltage of a normal A/C outlet?","120 volts","Standard US AC outlets provide 120 volts (nominal)."],["QB-05022","Wiring & Color Codes","What wire gauge is typically used for fire alarm notification appliance circuits?","14 AWG","14 AWG wire is commonly used for NAC circuits due to the current requirements of notification appliances. Some installations may require 12 AWG for longer runs."],["QB-05023","Wiring & Color Codes","Where do wire runs go for PoE cameras?","- Wire runs go from the camera location to the CSVR or PoE Switch.",""],["QB-05026","Wiring & Color Codes","Which of the following is not a standard fuse size?","65 amp","110 amp is not a standard fuse size."],["QB-05027","Wiring & Color Codes","Wire pulling lubricant is used to:","Reduce friction during conduit pulls","Lubricant reduces friction when pulling wire through conduit."],["QB-05030","Wiring & Color Codes","Which term characterizes mandatory language in codes and standards?","Shall or shall not","'Shall' and 'shall not' are the defining terms for mandatory requirements."],["QB-05036","Wiring & Color Codes","What is the minimum depth of working space required for Condition 3 equipment operating at a maximum of 600 volts?","4 ft.","Condition 3 at 600V max requires 4 feet of working space depth."],["QB-05038","Wiring & Color Codes","How should the conductor on a 4-wire delta-connected system with higher phase voltage be identified?","Orange marking","The high leg on a delta system must be identified with orange marking."],["QB-05039","Wiring & Color Codes","The neutral conductor carries what type of current?","The maximum unbalanced current","The neutral carries the unbalanced current from phase conductors."],["QB-05040","Wiring & Color Codes","What is the maximum voltage for a branch circuit in dwelling units and guest rooms?","120 volts","Dwelling unit branch circuits for general lighting are limited to 120 volts."],["QB-05041","Wiring & Color Codes","AFCI protection is required for all 120-volt, single-phase, 15- and 20-ampere branch circuits supplying outlets in which areas of dwelling units?","Living areas including bedrooms","AFCI protection is required for most living areas in dwelling units."],["QB-05042","Wiring & Color Codes","EMT (Electrical Metallic Tubing) shall be:","Reamed or otherwise finished to remove all rough edges","EMT must be reamed to remove rough edges that could damage conductor insulation."],["QB-05043","Wiring & Color Codes","Rigid metal conduit buried under an area of heavy traffic must be buried a minimum of how many inches below grade?","24 inches","RMC under heavy traffic requires 24-inch minimum burial depth."],["QB-05044","Wiring & Color Codes","Class 1 circuits shall not exceed what voltage?","600 volts","Class 1 circuits are limited to 600 volts maximum."],["QB-05046","Wiring & Color Codes","When making a Limited Energy installation above a suspended ceiling where support wires don't extend to the ceiling, what is required?","Attach support wire to suspended ceiling grid at both ends","Support wires must be attached to the ceiling grid at both ends."],["QB-05047","Wiring & Color Codes","A fire alarm installation is being made with cables fished to the pull station. Identify the code-compliant installation:","A cut-in box is installed to house the device and protect the cable assembly","A cut-in box properly houses and protects the device and cables."],["QB-05048","CW Scenarios","A Team Lead tells you to skip the post-activation follow-up call on a job because the schedule is backed up. What does CW do?","Respectfully push back. The WO update post-activation SLA is 2 hours — That's a hard SLA, not a suggestion. If the team lead is directing you to skip it, that's an escalation conversation — Not a compliance issue you absorb silently. Document that the direction was given. Flag it to field coord or field ops director. You own the SLA on your jobs. The schedule pressure belongs to ops — Not to the member's account health.",""],["QB-05049","CW Scenarios","A member calls you back three days after your install. They say the system went offline and they can't arm or disarm. You're at another job. What does CW do?","Do not tell them to call customer service and hang up. You are the face of the install. Get their account pulled — Check alarm.com remotely if you have access. If it's a simple fix (power cycle, low battery), walk them through it. If it needs a return visit, escalate to dispatch for next business day scheduling. Callback dispatch SLA: Next business day max. Document the issue in the WO or CRM immediately.",""],["QB-05050","CW Scenarios","The member signs the work order but then says 'I didn't really understand what I was signing.' How does CW handle this?","Stop the close. Walk back through every line that matters — Monitoring agreement, equipment list, CO if applicable. The member's acknowledgment has to be real, not just a signature on paper. If they feel pressured or confused, that's a problem that lives forever in your install history. Take the extra 10 minutes. A member who understands what they signed is a member who stays. One who doesn't becomes a cancellation or a complaint.",""],["QB-05051","CW Scenarios","You discover at the job site that the equipment on the truck doesn't match the WO. The WO says IQ Panel 4+ but you were given a standard IQ Panel 4. The member is home and ready. What does CW do?","SC-5: Equipment discrepancy. Do not swap in a different panel without a signed CO. Notify team lead immediately. Explain the situation to the member honestly — 'there's a mismatch in the order I need to resolve before we start.' if the panel can be exchanged same-day via warehouse, get that confirmed before touching anything. If not, reschedule. Installing the wrong equipment and getting it signed off is worse than the delay.",""],["QB-05052","CW Scenarios","You're 45 minutes into an install and realize the run you need to make to the panel will require drilling through an exterior wall — not in the original scope. What does CW do?","Stop and communicate before you drill. Tell the member what you found and why the routing changed. Get pm on the line or document the scope change. If it's a minor deviation with no cost impact, get verbal agreement documented. If it adds time or material, that's a CO conversation before any work continues. You never create structural changes in a member's home — Exterior or interior — Without explicit acknowledgment. Drill first, ask later = liability.",""],["QB-05054","CW Scenarios","You're installing a Qolsys IQ Panel and Alarm.com activation fails — the account won't come online. You've triple-checked credentials and cellular signal is good. What's the CW diagnostic sequence?","1) Confirm SIM is seated and panel firmware is current. 2) Power cycle — Full, not just restart. 3) Check alarm.com dealer portal for account status — Pending, suspended, or duplicate account are common blocks. 4) Verify cellular carrier isn't showing an outage in the area. 5) If all clear and still offline, escalate to alarm.com dealer support with the account token and imei. Document every step. Do not leave the site with the panel offline unless escalated and documented.",""],["QB-05056","Compliance & Ethics","A Team Lead tells you to enter notes at the end of the day because 'it's more efficient to batch them.' What do you do?","Respectfully push back: 'Batched WO notes at end of day get flagged on audit — the timestamps don't match the job activity. I'd rather take 2 minutes on-site per zone than deal with a secondary review.' If the TL makes it a direct order, document the direction. A TL cannot authorize a practice that creates QA flags. Escalate if needed.",""],["QB-05057","Compliance & Ethics","A tech requests a time correction for the third time this month with different explanations each time. What's your response?","This is now a performance conversation. Pull the three incidents: dates, times, reasons given. 'Three corrections in one month with three different explanations is a pattern I can't keep approving without understanding what's happening.' Either there's a systemic app issue — fix it. Or it's a habit — document it and set expectations.",""],["QB-05059","Compliance & Ethics","You notice the tech next to you is skipping zone tests and marking them as passed in the WO. What do you do?","Address it directly and professionally on the spot: 'I'm seeing zone tests marked complete before you ran them. That's a QA flag. Let's go back and run them.' If they refuse, escalate to your Team Lead immediately and document what you observed. Silence is endorsement.",""],["QB-05060","Compliance & Ethics","Your manager tells you not to bother recommending life safety add-ons because 'it slows down the install and they never buy anyway.' Do you comply?","No. The recommendation is a professional obligation. Your manager can set expectations about close rates but cannot ethically instruct you to withhold safety recommendations. Document the directive and continue making recommendations. If pressure escalates, that goes to Field Ops Director.",""],["QB-05061","Compliance & Ethics","Which of these best describes an employee roster?","a list of the agency's registered employees which must be submitted to the IDFPR every sixty days and kept by the agency for 24 months",""],["QB-05063","Compliance & Ethics","When can a Firearm Control Card (FCC) be revoked by the IDFPR without a hearing?","if the holder of the FCC commits an act that poses an imminent threat or danger to the public",""],["QB-05064","Compliance & Ethics","Which of these is not required in the employee file of each private alarm employee for at least five years after termination of the employee, except?","the employee's active Firearm Owner's Identification Card if the employee was ever armed while on duty",""],["QB-05065","Compliance & Ethics","The following documents are required to be kept in any peace officer employee's record, except:","a weapons discharge report substantiating the discharge of a weapon while employed by the agency",""],["QB-05069","Compliance & Ethics","Which of the following best describes basic training requirements for registered employees of a Private Alarm Contractor Agency who perform guarding functions?","the training must include terrorism, must be completed within 15 days of date of hire and conducted by an IDFPR certified instructor",""],["QB-05072","Compliance & Ethics","Which does not appear on an agency employee's identification card?","the expiration date of the ID card which is 3 years from date of issuance",""],["QB-05076","Compliance & Ethics","All of the following are not true about the employee's file photo, except:","it must be taken within 10 days of date of hire and replaced every 3 years",""],["QB-05077","Compliance & Ethics","An armed employee of an agency must comply with all of the following, except:","carry a firearm while commuting 2 hours to work",""],["QB-05078","Compliance & Ethics","Which of the following is not required to be covered for 20-hour basic training for Private Security Contractors and runners for Private Alarm Contractor agencies?","arrest and control techniques",""],["QB-05080","Compliance & Ethics","The minimum number of work hours needed for 1 year of full-time experience credit is:","2080",""],["QB-05087","Compliance & Ethics","Which of the following could disqualify a private detective from sitting for the private detective exam?","Misdemeanor conviction for a dishonest act",""],["QB-05088","Compliance & Ethics","Which statement concerning FCC cards is most accurate:","An armed employee may carry an FCC for each of two different agencies",""],["QB-05091","Data & Communications","What are the CSVR dimensions and form factor?","15.2 x 12.4 x 2.0 inches — rack-compatible 1U design","1U rack-mountable commercial design fits standard server racks for professional installation."],["QB-05092","Data & Communications","Can recorded CSVR footage be viewed remotely?","Yes — through Alarm.com website and mobile app from anywhere","Local recording + remote access = best of both worlds for business owners on the go."],["QB-05093","Data & Communications","What built-in PoE capability does the CSVR have?","Built-in PoE ports eliminate the need for a separate PoE switch","CSVR has integrated PoE ports — cameras connect directly, reducing equipment and cost."],["QB-05094","Data & Communications","What incoming bandwidth does the CSVR support?","160 Mbps incoming, 256 Mbps outgoing","High bandwidth ensures smooth recording from multiple 4MP cameras simultaneously."],["QB-05095","Install Protocol","A coordinator tells CW an install must be rushed to hit daily numbers. CW's standard:","Speed without accuracy is just faster callbacks. CW runs the sequence — Every zone, every test, every handoff step. If the schedule doesn't allow the standard, the schedule is the problem.","Standard over speed"],["QB-05096","Install Protocol","A manager asks CW why the drill completion rate on his team is high but some members still report issues. CW says:","'drills build knowledge. Reps build reflexes. We need to increase field ride-alongs and direct emulation alongside drill time. The system needs both inputs.'","Drills + field emulation"],["QB-05097","Install Protocol","A member asks about connecting their existing Nest thermostat to their new system. What do you tell them?","Alarm.com supports select smart home devices through z-wave and third-party integrations. Nest requires a separate alarm.com-linked setup — Not all configurations are supported without additional equipment. Verify compatibility before promising.","Third-party integration limits"],["QB-05098","Install Protocol","A member asks you directly if the system has ever failed or missed an alarm. How do you answer?","Be honest. 'no system is 100%, but the reason we test every zone before I leave is to ensure everything is working correctly in your home.' don't oversell. Trust is built on honesty.","Honest expectations"],["QB-05099","Install Protocol","A member calls CW's service line at 9 PM with a COMM FAIL. They leave for vacation tomorrow morning. CW:","Attempts remote reset immediately via dealer portal. If unresolved, confirms a tech can be dispatched first thing tomorrow before departure. Does not let the member get on a plane with a disconnected system.","After-hours priority"],["QB-05100","Install Protocol","A member is particularly thankful and says 'You're the best tech we've ever had.' CW responds:","'that means a lot. Every AAA tech you meet should feel the same way — That's what we're building.' redirect the compliment to the standard. Don't make it about CW — Make it about the expectation.","Standard over individual"],["QB-05101","Install Protocol","A new tech tells CW the install took too long because the member was difficult. CW's response:","'a member who's engaging with you is doing their job. A member who trusts you is the goal. If it took longer, it was worth the time.' reframe the frustration.","Mentorship framing"],["QB-05104","Install Protocol","A tech tells CW 'I just do the installs — I don't need to know all the ERS stuff.' CW's response:","'you're carrying the AAA name into people's homes. Understanding why that name matters is what makes you different from every other alarm installer. The ERS comparison isn't backstory — It's your identity.'","Identity is context"],["QB-05105","Install Protocol","CW is asked by a member if the Alarm.com system has ever 'not worked.' Honest answer:","'no system is perfect. That's exactly why I test every zone before I leave and why your system has two communication paths. If one fails, the other takes over.' honest + solution-oriented.","Honest confidence"],["QB-05106","Install Protocol","CW is on a service call and discovers the original install has multiple issues — done by another tech. CW:","Fixes everything to standard. Documents what was found and corrected. Notifies TL. Does not leave a substandard system behind because it 'wasn't my install.' owns the outcome regardless of origin.","Own the outcome"],["QB-05107","Install Protocol","CW notices a zone wasn't named correctly on a job that just passed QA. CW:","Flags it regardless of whether QA approved it. Wrong zone names create monitoring failures at 2 am. Correct it now, document the correction, and use it as a training point for the original tech.","Self-initiated standards"],["QB-05108","Install Protocol","CW overhears a new tech telling a member he is not sure about something and will ask his supervisor. How does CW address this after?","Privately, after the install: In front of a member, you say: Let me confirm the best answer for you right now. Then you find out. The member needs confidence in you. I don't know is acceptable — But the framing is everything.","Confident uncertainty"],["QB-05110","Install Protocol","The system arms but monitoring center reports they're not receiving signals. What do you check?","1) System not in test mode (stuck). 2) Comm path failure — Run comm fail diagnostic. 3) Alarm.com account not linked correctly. 4) Remote reset via dealer portal. 5) Central station account configuration.","Monitoring receipt failure"],["QB-05111","Install Protocol","What Alarm.com features support smart home integration beyond basic security?","Z-wave locks, thermostat control, garage door integration, smart lighting, geo-fence automation, voice assistant integration (alexa/google), and energy monitoring. These are upsell opportunities in every applicable install.","Smart home ecosystem"],["QB-05112","Install Protocol","What are the troubleshooting steps for a Qolsys IQ Panel COMM FAIL?","1) Check antenna connection at panel. 2) Check signal in diagnostics (min -95 dbm). 3) Verify SIM is seated and not locked. 4) Check alarm.com dealer portal status. 5) Remote reset. 6) Still failing = on-site, SIM replacement.","StarLink COMM FAIL sequence"],["QB-05114","Install Protocol","What does Qolsys IQ Panel (LTE cellular) use for its cellular path?","A sim-based LTE/5G cellular communicator built into the panel. Verify SIM lock, antenna connection, and signal in diagnostics. Remote reset available via alarm.com dealer portal.","Qolsys IQ Panel architecture"],["QB-05115","Install Protocol","What does UL certification mean for a monitoring center, and why does it matter to the member?","Underwriters laboratories certifies monitoring centers meet specific standards for backup power, redundancy, response time, and security. Ul-listed monitoring is often required for commercial insurance discounts and is a quality indicator for residential members.","UL certification significance"],["QB-05116","Install Protocol","What does the Alarm.com dealer portal allow a remote technician to do?","Remote diagnostics, system status check, comm path verification, remote reset, and zone review — Without a site visit. Attempt remote resolution before dispatching a tech for comm fails.","Remote resolution first"],["QB-05118","Install Protocol","What happens if QA finds an issue after you've closed the job?","QA flags the issue, notifies TL, and may require a site revisit. The tech who installed is responsible for the resolution. Repeated QA flags affect certification level and deployment.","QA accountability"],["QB-05119","Install Protocol","What is a 'zone supervision' and why does it matter?","Supervision is the panel's continuous monitoring of each zone's operational status — Detecting whether the zone is open, closed, in tamper, or has a wiring fault. Without supervision, a bypassed or cut sensor goes undetected.","Zone supervision"],["QB-05120","Install Protocol","What is the SLA for acknowledging a member escalation at the manager level?","< 2 hours. If over 4 hours — Director notification is triggered. Escalations that age without acknowledgment damage member trust and create compliance exposure.","Manager acknowledgment SLA"],["QB-05122","Install Protocol","What is the maximum recommended wireless range for door/window sensors in a typical residential install?","Up to 200 ft (line of sight), reduced significantly by walls, metal framing, and interference. In practice, test signal strength at each planned sensor location before mounting. Add a repeater if signal is marginal.","Wireless range planning"],["QB-05123","Install Protocol","What is the purpose of an end-of-line resistor (EOLR) in a hardwired zone?","Eolr provides supervision of the zone wiring — The panel monitors the resistance to detect both open circuits (zone triggered) and short circuits (tamper/sabotage). Required for ul-compliant hardwired installations.","EOLR function"],["QB-05124","Install Protocol","What is the required documentation for a system that required a second technician dispatch to resolve?","Both dispatch events must be in the WO with timestamps, tech names, work performed, and outcome. The STOPCAP and resolution must be documented. Multiple dispatches on one install trigger a QA review.","Multi-dispatch documentation"],["QB-05126","Install Protocol","When is it appropriate to skip your TL and escalate directly to the Field Coordinator?","When the TL is unavailable and a time-sensitive compliance, safety, or member issue cannot wait. Document the skip reason. Notify TL when they're available.","Escalation exception handling"],["QB-05128","Install Protocol","Who has the authority to grant an exception to a stopcap condition?","Team lead can document and hold. Exceptions require field coordinator or above authorization, and all exceptions must be documented with a reason code in the compliance tracker.","Exception authority"],["QB-05129","Install Protocol","Why does SSU use an emulation model (CW) rather than a rules document?","People emulate people, not policies. CW as the emulation model gives technicians a concrete behavioral reference — 'what would CW do' is more actionable than 'what does the policy say.' performance culture requires a performance model.","Emulation model rationale"],["QB-05130","Install Protocol","You're on a service call at 4:45 PM Friday. The issue will take 90 minutes. What do you do?","Confirm overtime authorization with TL and finish the job. A member's security doesn't wait until monday. The member's safety is the priority — Paperwork and clock are secondary.","Member safety first"],["QB-05131","Install Protocol","What happens if you exceed the maximum PoE cable run?","Signal degradation and insufficient power delivery — camera may not function","Beyond 328 feet, voltage drops below spec. Use a PoE extender or relocate the switch."],["QB-05132","Install Protocol","Why is PoE superior to WiFi cameras for commercial use?","Reliable hardwired connection, no interference, consistent power, no bandwidth competition","WiFi cameras share bandwidth with other devices and drop signal. PoE is dedicated and reliable."],["QB-05133","Install Protocol","What should technicians verify about existing network infrastructure before installing PoE cameras?","Router/switch compatibility, available ports, bandwidth capacity, cable quality","Verify the network can handle additional camera traffic without impacting business operations."],["QB-05135","Install Protocol","What documentation should the technician complete after installation?","System walkthrough with Member, signed completion form, photos of all equipment locations","Documentation protects everyone. Photos prove proper installation if questions arise later."],["QB-05222","Sales Training","A Member says 'We've never had a break-in.' What psychological bias are they demonstrating?","Normalcy bias — assuming because it hasn't happened, it won't happen","Normalcy bias causes people to underestimate the probability of threats they haven't personally experienced. Counter with: 'That's what every business owner says BEFORE their first incident. The FBI reports a commercial burglary every 10 seconds in the US.'"],["QB-05223","Sales Training","After presenting the price, what is the most powerful thing you can do?","Stay silent — the first person to speak after the price loses negotiating power","Silence after the price creates productive tension. Most salespeople panic and start justifying, discounting, or overselling. Let the Member process. Their response tells you exactly what to address next. Comfort with silence = confidence = authority."],["QB-05226","Sales Training","Research shows buying decisions are made emotionally and justified logically. What's the correct sales sequence?","Lead with emotional impact (protect your people, your livelihood), then support with logical proof (ROI, specs, savings)","Emotion opens the door, logic keeps it open. 'What would happen to your employees if someone broke in at closing?' (emotional). Then: 'Our system costs less than half of one break-in, and your insurance may drop 5-20%' (logical justification)."],["QB-05229","Sales Training","What are the four levels of pain in commercial security, from surface to deepest?","Technical pain (no cameras) → Business pain (theft losses) → Financial pain (insurance costs, inventory shrinkage) → Personal pain (fear for employee safety, sleepless nights)","Surface-level pain (we need cameras) is easy to dismiss. Deep personal pain (I worry about my employees closing alone at night) drives action. Your discovery should dig through each layer. The deeper you go, the stronger the motivation to buy."],["QB-05230","Sales Training","What is 'status quo bias' and how does it work against you in security sales?","Members prefer their current situation — even if it's risky — because change feels uncertain and effortful","Status quo bias keeps businesses unprotected even when they KNOW they need security. Counter it by making the change feel easy ('We handle everything — you just pick a day') and making the status quo feel risky ('Every day without cameras is a day your business is exposed')."],["QB-05233","Sales Training","Why should you present exactly 2-3 bundle options (not all 6) to a Member?","Too many choices cause 'analysis paralysis' — the paradox of choice makes people freeze and decide nothing","The paradox of choice: more options = less action. Use discovery to narrow to 2-3 relevant bundles. Present them as 'good, better, best' — this simplifies the decision from 'should I buy?' to 'which one should I buy?'"],["QB-05234","Sales Training","Why should you view objections as buying signals rather than rejection?","Because Members who object are engaged — they're mentally testing the purchase, which means they're considering it","A Member who says nothing and walks away wasn't interested. A Member who says 'It's too expensive' is actually saying 'Convince me it's worth it.' Objections mean they're in the decision-making process. Address the objection and you're one step closer."],["QB-05239","Sales Training","How do you handle a Member who wants more than 4 cameras?","Submit a custom design form — these bundles are for small business only","Bundles max at 4 cameras. Larger needs require custom design through the sales engineering team."],["QB-05241","Sales Training","What are the three AAA trust factors that differentiate us from competitors?","100+ years of brand trust, FBI-background-checked installers, and dual backup monitoring centers","AAA brand + vetted installers + redundant monitoring = unmatched trust and reliability."],["QB-05243","Sales Training","What referral or loyalty programs exist for AAA Smart Home customers?","Check current promotions — loyalty discounts and referral incentives available periodically","Referral programs can provide additional savings. Always check for current offers."],["QB-05244","Sales Training","What is Crowd Gathering detection?","Monitors for large groups forming and alerts when size reaches a specified threshold","Security + operational awareness — detect unusual gatherings before they become problems."],["QB-05245","Sales Training","How do you sell BAA to a Member who says 'I just need cameras'?","Show that BAA turns a cost center (security) into a revenue driver (business intelligence)","Cameras that also count customers, optimize layouts, and reduce wait times = ROI beyond security."],["QB-05246","Sales Training","Give a real-world use case for BAA in a restaurant.","Queue Monitoring alerts when kitchen wait times spike, People Counting tracks lunch rush patterns","Data shows peak hours for staffing decisions. Queue alerts prevent customer walkouts."],["QB-05247","Sales Training","How does AAA Smart Security compare to ADT for commercial?","AAA leverages 100+ years of brand trust, Member pricing discounts, and integrated insurance benefits","ADT is known but lacks AAA's membership ecosystem, insurance integration, and trust legacy."],["QB-05248","Sales Training","How do you counter 'SimpliSafe is cheaper'?","SimpliSafe is DIY residential with no PoE, no BAA analytics, and limited commercial support","Cheaper equipment = cheaper results. No PoE reliability, no video verification, no business analytics."],["QB-05249","Sales Training","What is the AAA brand advantage in commercial sales?","100+ years of trust, BBB-rated, FBI-background-checked installers, dual backup monitoring centers","Members already trust AAA with their cars and homes. Security is a natural extension of that trust."],["QB-05250","Sales Training","What environmental sensors can be added to the IQ4 system?","Smoke detectors, CO detectors, water/flood sensors, temperature sensors","Environmental monitoring protects against fire, gas, and water damage beyond intrusion."],["QB-05251","Sales Training","What is the maximum number of Z-Wave devices the IQ4 supports?","137 total: up to 80 lights, 20 locks, 10 thermostats, 6 garage doors, 21 misc","Full smart building automation from one panel — lights, locks, climate, and more."],["QB-05252","Sales Training","What is the 'silence after price' technique?","Present price and wait — first person to speak loses leverage","Silence creates productive tension. Their response tells you exactly what to address."],["QB-05254","Sales Training","What is ethical urgency vs fake scarcity?","Connect purchase to THEIR timeline, not artificial pressure","'New inventory arrives next month — want cameras up before that?' Their priorities, not fake deadlines."],["QB-05255","Sales Training","What is the takeaway close?","Suggesting they might not need the premium option triggers desire for it","'The Classic might be enough for you.' Often they push BACK toward premium."],["QB-05257","Sales Training","What is 'status quo bias' and how does it work against you?","Members prefer current situation even if risky — change feels uncertain","Counter: Make change easy ('We handle everything') and inaction risky ('Every day without = exposed')."],["QB-05258","Sales Training","After presenting price, what is the most powerful thing to do?","Stay silent — first person to speak loses negotiating power","Silence creates tension. Don't justify or discount. Their response guides your next move."],["QB-05259","Sales Training","What is the Member ACTUALLY buying?","Peace of mind, protection of livelihood, employee safety, ability to sleep at night","Nobody buys cameras. They buy the ability to stop worrying about their business at 2 AM."],["QB-05260","Sales Training","In SPIN selling, what do S-P-I-N stand for and why is order critical?","Situation→Problem→Implication→Need-Payoff — each builds urgency","S establishes context, P finds pain, I deepens urgency, N connects your solution to their need."],["QB-05262","Sales Training","How do you handle 'We already have cameras'?","Ask about limitations — no monitoring? WiFi? No BAA? Find the gap and fill it","Existing cameras are an upgrade opportunity, not a dead end. Find what's missing."],["QB-05263","Sales Training","How do you upsell from Entry Video to Classic Security View?","'You already see the value of cameras — adding intrusion detection means dispatch when someone breaks in at 3 AM'","Cameras show you what happened. Intrusion detection calls the police while it's happening."],["QB-05264","Sales Training","What is the ideal follow-up timeline after initial consultation?","24-48 hours — strike while the pain points are fresh","Speed matters. Delay lets urgency fade and competitors step in."],["QB-05265","Sales Training","How do you create urgency without being pushy?","Tie to their calendar: 'Holiday season starts in 6 weeks — want cameras up before your busiest time?'","Their timeline, their priorities. Ethical urgency connects protection to real-world events."],["QB-05266","Sales Training","What if I move my business to a new location?","Equipment can be professionally relocated — contact AAA for moving options","AAA can reinstall your system at the new location. Your investment moves with you."],["QB-05267","Sales Training","What is Alarm.com and why does it matter?","Industry-leading platform powering our cameras, panels, and mobile app ecosystem","Alarm.com is the #1 smart security platform. Powers real-time alerts, analytics, and remote control."],["QB-05269","Sales Training","What industries are most frequently burglarized?","Restaurants (23K), convenience stores (12K), construction sites (13K), discount stores (12K)","Know your Member's industry risk. Restaurants and retail are top targets."],["QB-05271","Sales Training","What automation rules can be created through Alarm.com?","If-then rules: arm when everyone leaves, turn on lights at sunset, lock doors at close","Automation reduces human error. System handles routine security tasks automatically."],["QB-05272","Sales Training","What is Geo-Services (geofencing) in the Alarm.com app?","Location-based automation — system knows when you arrive/leave and acts accordingly","Auto-disarm when owner arrives, auto-arm when last person leaves. Seamless protection."],["QB-05273","Team Lead & Manager","40% of your crew's jobs last month have WO updates timestamped 4-6 hours after activation. What does this pattern tell you?","Your crew is treating the 2-hour hard SLA as aspirational. Have a crew-level conversation: 'Here's the SLA. Here's what the data shows. By end of this week, every activation update gets in within 2 hours. I'll be checking.' Then actually check.",""],["QB-05274","Team Lead & Manager","A senior tech tells you daily zone testing is unnecessary for experienced techs. How do you respond?","You don't negotiate the standard. 'Your install quality is real — but the walk test isn't about whether you're experienced enough. It's the document that proves it to everyone else in the chain. Experience doesn't replace evidence. Every zone, every job.'",""],["QB-05275","Team Lead & Manager","A tech admits they submitted a WO with a zone marked 'tested' that wasn't actually tested. What is the correct process?","Acknowledge that they came to you — that took integrity. Correct the record immediately with an amended close-out note: original entry, correct information, timestamp of correction. If the job can be reached same-day, send the tech back. Document the coaching conversation. This is a one-time correction path.",""],["QB-05276","Team Lead & Manager","A tech submits a close-out with blurry zone photos and descriptions that say 'bedroom' and 'hallway.' Do you approve it?","No. Send it back with specific corrections: 'Zone photos must be in focus and show the sensor mounted in final position. Descriptions must match physical location and sensor type — Master Bedroom Window East, ADC-S2000 recessed contact. Resubmit.' Don't rewrite it for them. They have to execute the rep correctly.",""],["QB-05277","Team Lead & Manager","You are a Team Lead on-site for a spot check. Your tech completes a solid install but skips entering life safety sensor recommendations in Alarm.com before closing out. What does CW do?","Intervene before close-out. 'Before you clock out — walk me through what life safety conversation you had with the member.' If they didn't have it, go back in together. Make sure any installed life safety devices are in the Alarm.com account before close. Coach privately after: 'That account entry isn't optional. If it's installed, it's in the system before you leave the driveway.'",""],["QB-05278","Team Lead & Manager","You are a Team Lead running daily crew check-in. One tech says they've been clocking in at the first job and adding earlier drive time as worked time at end of day. What does CW do?","Address it on the spot: 'That's a time correction pattern that creates audit exposure. Drive time between home and first job is not billable in our current structure. Clock in when you arrive on-site. If there's a scheduling issue driving this, that's a conversation with HR and ops — not a self-administered time adjustment.' Document it. Check if the pattern exists across the crew.",""],["QB-05279","Team Lead & Manager","You are a Team Lead. A member calls you directly to complain their system hasn't been set up correctly since install. What does CW do first?","Own it immediately. 'I'm the Team Lead for that install — this is mine to fix.' Pull the account in Alarm.com while you're on the phone. If it's a remote fix — do it now. If it requires a return visit, schedule it before you hang up and give them a specific time. The member called because they needed someone to own the problem. Own it.",""],["QB-05280","Team Lead & Manager","You are a Team Lead. A tech on your crew has a callback rate 3x the crew average over 90 days. Close-outs look clean on paper. What does CW do?","Don't audit the paper — audit the field. Ride with that tech on their next job. Watch zone-by-zone testing, the walkthrough, and Alarm.com entry sequence in real time. The paper looks clean because they're closing correctly on paper — the gap is in field execution. Common culprits: abbreviated zone tests, member walkthrough rushed, Alarm.com entries completed after leaving the site.",""],["QB-05281","Team Lead & Manager","You are a Team Lead. A tech reports a member refused the life safety recommendation and got frustrated when pushed. The tech dropped the topic. What does CW say?","Yes — with one condition. The recommendation was made. The member declined. You documented it: 'Member declined CO sensor, water sensor, and smoke integration recommendations — all discussed at close-out.' That's where it ends. You don't push past a considered no. But you don't skip the documentation either.",""],["QB-05282","Team Lead & Manager","You observe a tech doing a solid install but skipping the member walkthrough because 'the member said they were in a hurry.' What do you do?","Intervene on-site. Introduce yourself to the member, set a 5-minute expectation, and run the walkthrough. Coach the tech privately: 'The member being in a hurry is a reason to compress it — not skip it. Three things: keypad, app, alarm sound. 4 minutes. SC-7 applies.' Document the coaching.",""],["QB-05283","Team Lead & Manager","Your crew has three jobs today. A tech calls at 11 AM — the member isn't home and didn't answer the pre-call. First move?","Verify the pre-call was actually made and logged at the 30-minute mark. Direct the tech: wait until the scheduled window closes, make a second documented attempt, call Field Coord if no contact before the window expires. Do not authorize a reschedule on the spot — that's Field Coord's call.",""],["QB-05284","Technical Systems","What smart home protocols does the IQ4 support?","Z-Wave 700 (up to 137 devices) + BLE for touchless disarm","Z-Wave 700 controls up to 137 devices (lights, locks, thermostats, garage doors). BLE for up to 5 smartphones."],["QB-05285","Technical Systems","What is the battery backup duration for the IQ4?","Over 24 hours on 3000mAh lithium-ion rechargeable battery","24+ hour battery backup means the business stays protected even during extended power outages."],["QB-05286","Technical Systems","What certifications does the IQ4 hold?","UL-985, UL-1023, UL-2610, fcc, ic","UL-listed for commercial and residential use. FCC and IC compliant."],["QB-05287","Technical Systems","Can the IQ4 support multiple partitions?","Yes — up to 4 partitions","4 partitions allow different areas of a business to be armed/disarmed independently."],["QB-05288","Video & CCTV","What recording options does the camera support?","MicroSD onboard, CSVR local, and Alarm.com cloud clips simultaneously","Triple recording redundancy: local card + CSVR + cloud ensures no footage is ever lost."],["QB-05289","Video & CCTV","What is the camera's power consumption?","11.3 watts via PoE or 12VDC ± 10%","Low power draw means standard PoE switches can handle multiple cameras easily."],["QB-05292","CW Scenarios","A tech calls you mid-install — says the member is asking questions he can't answer about billing and is getting angry. The tech wants to know if he should just leave. What does CW do?","Tell him to stay calm and stay on site. 'I'm going to talk to them right now.' get on the phone with the member — Not to defend the tech, but to take the temperature down and get the facts. Billing questions belong to the coordinator, not the tech — But you don't leave an angry member unaddressed. De-escalate first, then route the billing question correctly. Leaving solves nothing and burns the trust AAA already built. Own the scene.",""],["QB-05293","CW Scenarios","A tech on your team is consistently hitting SLAs but their member feedback scores are flat — no complaints, but no praise either. What does CW do with this?","Flat feedback is a signal — Not a pass. SLA compliance means they're hitting the process. Flat scores mean the member experience is transactional, not memorable. CW doesn't just fix systems — CW makes the member feel like AAA showed up. Sit with that tech on their next job, watch the interaction, identify the specific moments where connection is missing. Name them. Give them the language. SLA is L2 behavior. Member experience is L3. CW standard is both.",""],["QB-05294","CW Scenarios","An installer consistently ranks in the top 5% on installs but refuses to document correctly — always behind on WO updates, photos missing. They argue the paperwork slows them down. What does CW do?","The install without the documentation is half a job. Speed means nothing if the account can't be closed, audited, or serviced by the next person in the chain. Have the direct conversation: 'your install quality is real — And it stops mattering the moment the file is incomplete. Right now you're an L2 tech doing L3 installs. The documentation is what gets you to L3.' if the behavior doesn't change, that's a performance conversation. CW doesn't negotiate compliance.",""],["QB-05295","CW Scenarios","You're auditing a market and find that Team Leads have been approving close-outs without verifying QA sign-off — just rubber-stamping to keep the pipeline moving. What does CW do?","Stop it immediately. Pull a sample of jobs closed in the last 30 days and audit back. Identify how many are missing valid QA. Notify field ops director with documentation. Then reset the team lead expectation in writing — Approval authority comes with verification responsibility. A team lead who stamps close-outs without checking QA is creating SC-3 exposure on every job in that pipeline. Retroactive audit, immediate correction, documented retraining.",""],["QB-05297","CW Scenarios","You're reviewing a close-out package and the documentation is technically complete but sloppy — blurry photos, half-filled notes, vague zone descriptions. Do you pass it?","No. Technically complete and cw-standard are not the same thing. Send it back with specific corrections — List exactly what's wrong and what right looks like. 'zone descriptions should match the physical location and sensor type. Photo of panel needs to be in focus and include all wired zones visible. Redo and resubmit.' don't rewrite it for them — That doesn't build the reflex. They have to do the rep correctly.",""],["QB-05309","Team Lead & Manager","A tech hits all SLAs and close-outs cleanly — but member feedback is consistently neutral, never positive. What does this signal?","SLA compliance means they're executing the process. Neutral feedback means the experience is transactional. Go on a ride-along. Watch specifically: the arrival interaction, first 3 minutes inside the home, and the walkthrough close. Identify the exact moment where connection is missing. Name it. Give them the language.",""],["QB-05310","Team Lead & Manager","One tech consistently has callbacks in the 72-hour window after install. Jobs close clean on paper. What's your diagnostic process?","Pull the last 5 callback jobs. Look for: common zone types, member demographics, whether walkthrough was documented as complete. Ride with that tech. Watch zone-by-zone testing and the walkthrough. The paper looks clean because they're closing correctly on paper — the gap is in field execution.",""],["QB-05311","Team Lead & Manager","You are a Team Lead. Your crew's BEARING scores are high but techs are celebrating close-out speed, not close-out quality. What does CW do?","Recalibrate what the crew celebrates. In the next crew meeting, pull a specific example of a high-quality close-out — correct zone names, walk test log complete, life safety documented, Alarm.com entry timestamped before clock-out — and call it out: 'This is what fast looks like when it's also right.' If you only recognize speed, you get speed.",""],["QB-05312","Team Lead & Manager","You are a manager. 60% of one Team Lead's crew have WO notes timestamped more than 4 hours after activation. What does CW do?","Show the TL the data by job, not percentage: 'Here are 12 jobs with 4–8 hour gaps. The SLA is 2 hours. This is your crew's pattern for the month.' Either the TL isn't enforcing it or doesn't understand it as a hard requirement. Expect correction by end of next week. Check again in 7 days. Pattern correction, not single-incident coaching.",""],["QB-05313","Team Lead & Manager","You are a manager. A Team Lead has been signing off on L2 certifications without any documented field verification — just based on drill scores. What does CW do?","Stop it immediately. Audit the last 60 days of certs. L2 requires documented drill completion AND field verification — drill scores alone don't complete the cert path. 'These certs are in pending status until field verification is done for each tech.' Escalate to Field Ops Director. Run retraining with that TL on certification authority and requirements.",""],["QB-05314","Team Lead & Manager","You are a manager. A Team Lead says their crew can't hit the 2-hour WO update SLA because they're running too many jobs per day. What does CW do?","The SLA doesn't flex for scheduling — the scheduling flexes for the SLA. 'If the current schedule makes it impossible to comply, that's a scheduling problem I need to fix, not a compliance exception I can grant.' Escalate to Field Coord with documentation. Do not accept a normalized SLA breach as a permanent condition.",""],["QB-05316","Team Lead & Manager","You are a manager. A high-volume market is producing good install numbers but member satisfaction scores are flat. Team Leads are not identifying this as a problem. What does CW do?","Pull the data and show it: 'Install volume is up. Satisfaction is flat. That gap means members are getting the system installed correctly but not the AAA experience.' Schedule ride-alongs — one per TL. Require a specific report on walkthrough quality and member interaction from each. Make the gap visible before the TLs can own it.",""],["QB-05317","Team Lead & Manager","Your Field Ops Director asks for a crew performance summary. What data do you pull and how do you present it?","Pull: SLA hit rate (pre-call, post-activation WO update, callback response), QA rejection rate, callback rate per tech, certification completion status. Present by tech, not as a crew average — averages hide outliers. Flag patterns, not just incidents. Your Director needs data, not summaries.",""],["QB-05318","Team Lead & Manager","Your manager tells you to approve L3 certifications for three techs to cover a market push — they haven't completed required drills. What do you do?","Decline clearly. 'L3 certification requires documented drill completion, field verification, and NCL sign-off. I can't verify that for these three techs and I won't sign certs I can't verify.' Document the request. If pressure continues, escalate to Field Ops Director.",""]];
</script>

/* ---------- sha-256 (fallback when crypto.subtle is missing) ---------- */
function sha256js(str){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;const bits=l*8;for(let i=0;i<8;i++)m[n-1-i]=Math.floor(bits/Math.pow(2,8*i))&255;
let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Uint32Array(64),r=(x,y)=>(x>>>y)|(x<<(32-y));
for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=(m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3];for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
let[a,bb,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
h=[h[0]+a|0,h[1]+bb|0,h[2]+c|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];}
return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");}
async function sha256(str){try{if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");}}catch(e){}return sha256js(str);}

/* ---------- record model ---------- */
const ID_RX=/^(DLR\d{3,5}|MWG|DEMO)-T\d{2,3}$/;
const isDemo=id=>/^DEMO-/.test(id||"");
function newRec(id,track){return{v:1,techId:id,dlr:isDemo(id)?"DEMO":id.split("-")[0].replace("DLR",""),track:track,created:now(),updated:now(),kickoff:null,tests:{},videos:{},vskip:{},loto:null,tools:{items:{},at:0},admin:{at:0,toolsOk:false,spot:"",review:{},owner:"",due:""}};}
function cur(){return DB.records[DB.current]||null;}
function touch(rec){rec.updated=now();if(!isDemo(rec.techId)&&DB.queue.indexOf(rec.techId)<0)DB.queue.push(rec.techId);save();flush();}
const reqMods=rec=>MODULES.filter(m=>!m.owner||rec.track==="owner");
function best(rec,id){const t=rec.tests[id];if(!t)return null;return t.attempts.filter(a=>a.pass).sort((x,y)=>y.at-x.at)[0]||null;}
function mstate(rec,m){
  if(m.kind==="read")return rec.kickoff?{s:"done",label:"Read"}:{s:"open",label:"Start here"};
  const t=rec.tests[m.id]||{attempts:[]},p=best(rec,m.id);
  if(p){const exp=addMonths(p.at,CONFIG.RECERT_MONTHS);if(now()<exp)return{s:"passed",label:"Passed "+p.score+"%",exp:exp};}
  if(m.id!=="M1"&&!best(rec,"M1"))return{s:"locked",label:"Opens after Module 1"};
  const cleared=(rec.admin.review||{})[m.id]||0,fails=t.attempts.filter(a=>!a.pass&&a.at>cleared);
  if(fails.length>=CONFIG.MAX_ATTEMPTS)return{s:"review",label:"Trainer review needed"};
  const last=t.attempts[t.attempts.length-1];
  if(last&&!last.pass&&now()-last.at<CONFIG.RETAKE_HOURS*H)return{s:"wait",label:"Retake "+fmtT(last.at+CONFIG.RETAKE_HOURS*H),until:last.at+CONFIG.RETAKE_HOURS*H};
  if(p)return{s:"lapsed",label:"Recert due"};
  return t.attempts.length?{s:"retry",label:"Retake open · "+fails.length+" of "+CONFIG.MAX_ATTEMPTS+" used"}:{s:"open",label:"Ready"};
}
function needs(rec){const n=[];reqMods(rec).forEach(m=>{const s=mstate(rec,m).s;if(s!=="done"&&s!=="passed")n.push(m.id==="K"?"Day 1":m.id);});
  const toolsDone=rec.tools&&rec.tools.at;
  if(!rec.loto)n.push("LOTO attestation");if(!toolsDone)n.push("Tool check");else if(!rec.admin.toolsOk)n.push("Tools confirm");
  if(rec.admin.spot!=="clear")n.push("Spot check");return n;}
function status(rec){const st=reqMods(rec).map(m=>mstate(rec,m).s);
  if(st.indexOf("review")>=0)return"Trainer review";if(st.indexOf("lapsed")>=0)return"Lapsed";
  return needs(rec).length?"In onboarding":"SSU-Certified";}

/* ---------- merge (device, imported file, relay) ---------- */
function merge(a,b){if(!a)return b;if(!b)return a;const o=JSON.parse(JSON.stringify(a));
  Object.keys(b.tests||{}).forEach(k=>{const seen={};o.tests[k]=o.tests[k]||{attempts:[]};o.tests[k].attempts.forEach(x=>seen[x.at]=1);b.tests[k].attempts.forEach(x=>{if(!seen[x.at])o.tests[k].attempts.push(x);});o.tests[k].attempts.sort((x,y)=>x.at-y.at);});
  o.videos=Object.assign({},b.videos||{},a.videos||{});o.vskip=Object.assign({},b.vskip||{},a.vskip||{});
  if(b.kickoff&&(!o.kickoff||b.kickoff.at>o.kickoff.at))o.kickoff=b.kickoff;
  if(b.loto&&(!o.loto||b.loto.at>o.loto.at))o.loto=b.loto;
  if(b.tools&&(b.tools.at||0)>(o.tools.at||0))o.tools=b.tools;
  if(b.admin&&(b.admin.at||0)>(o.admin.at||0))o.admin=b.admin;
  o.updated=Math.max(a.updated||0,b.updated||0);return o;}
function valid(r){return r&&typeof r==="object"&&ID_RX.test(r.techId||"")&&r.tests&&r.admin;}

/* ---------- relay sync ---------- */
let syncMsg="";
function syncLabel(){if(!CONFIG.RELAY_URL)return"Saved on this device only";if(!navigator.onLine)return"Offline. Will send when signal is back";
  if(DB.queue.length)return"Waiting to send "+DB.queue.length;return DB.lastSync?"Sent to SSU "+fmtT(DB.lastSync):"Connected to SSU";}
async function flush(){if(!CONFIG.RELAY_URL||!navigator.onLine||!DB.queue.length)return;
  for(const id of DB.queue.slice()){const rec=DB.records[id];if(!rec){DB.queue=DB.queue.filter(x=>x!==id);continue;}
    try{const r=await fetch(CONFIG.RELAY_URL,{method:"POST",body:JSON.stringify({action:"training",token:CONFIG.TRAIN_TOKEN,record:rec})});const j=await r.json();
      if(j&&j.ok){DB.queue=DB.queue.filter(x=>x!==id);DB.lastSync=now();}else{syncMsg="SSU refused the record ("+(j&&j.code||"no code")+").";break;}}catch(e){syncMsg="Could not reach SSU.";break;}}
  save();paintSync();}
async function pull(params){if(!CONFIG.RELAY_URL)return 0;try{const q=Object.keys(params).map(k=>k+"="+encodeURIComponent(params[k])).join("&");
  const r=await fetch(CONFIG.RELAY_URL+"?what=training&token="+encodeURIComponent(CONFIG.TRAIN_TOKEN)+"&"+q);const j=await r.json();
  if(!j.ok)throw new Error(j.code);let n=0;(j.records||[]).forEach(x=>{if(valid(x)){DB.records[x.techId]=merge(DB.records[x.techId],x);n++;}});save();return n;}catch(e){toast("Could not load from SSU: "+e.message);return -1;}}
function paintSync(){const el=$("#sync");if(el){el.textContent=syncLabel();el.title=syncMsg;el.dataset.state=!CONFIG.RELAY_URL?"local":DB.queue.length?"wait":"ok";}}
window.addEventListener("online",flush);

function download(name,text,type){const b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);}
async function exportRec(){const r=cur(),name="SSU record "+r.techId+".json",txt=JSON.stringify(r);
  try{const file=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){}
  download(name,txt,"application/json");}
function importFiles(files){let n=0,bad=0;const all=[...files].map(f=>f.text().then(t=>{let d;try{d=JSON.parse(t);}catch(e){bad++;return;}(Array.isArray(d)?d:[d]).forEach(x=>{if(valid(x)){x.imported=!DB.records[x.techId]||DB.records[x.techId].imported;DB.records[x.techId]=merge(DB.records[x.techId],x);n++;}else bad++;});}));
  Promise.all(all).then(()=>{save();toast(n+" record"+(n===1?"":"s")+" added"+(bad?", "+bad+" skipped":""));render();});}
function csv(){const rows=[["Dealer ID","Tech ID","Path"].concat(MODULES.map(m=>m.id==="K"?"Day 1":m.id)).concat(["Videos watched","LOTO signed","Tools confirmed","Spot check","Compliance status","Needs","Follow-up owner","Due date"])];
  Object.values(DB.records).filter(r=>!isDemo(r.techId)).forEach(r=>rows.push(["DLR "+r.dlr,r.techId,r.track].concat(MODULES.map(m=>{if(m.owner&&r.track!=="owner")return"n/a";const s=mstate(r,m);return s.s==="passed"?best(r,m.id).score+"%":s.label;})).concat([vidCount(r),r.loto?fmt(r.loto.at):"No",r.admin.toolsOk?"Yes":"No",r.admin.spot||"Not done",status(r),needs(r).join("; "),r.admin.owner,r.admin.due])));
  download("SSU team training "+new Date().toISOString().slice(0,10)+".csv",rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv");}

  const list=VIDEOS.filter(x=>x.mod===v.mod),i=list.indexOf(v),next=list[i+1];
  return '<p class="crumb"><button class="link" data-go="vids">Videos</button></p><h1>'+esc(v.id)+' · '+esc(v.t)+'</h1>'+media+
  (v.yt&&v.file&&!S.local?'<p class="small">Not playing? <button class="link" data-act="localcopy">Use the site copy</button></p>':'')+'<div class="actions">'+(rec?(w?'<p class="ok">Watched '+fmt(w)+'.</p>':'<button class="btn" data-act="watched">I watched it</button>'+(canSkipVids(rec)&&!(rec.vskip&&rec.vskip[v.id])?'<button class="btn ghost" data-act="skipone">Skip this one</button>':'')):'')+(next?'<button class="btn ghost" data-play="'+next.id+'">Next: '+esc(next.t)+'</button>':'')+'</div>';}
function markWatched(id){const r=cur();if(!r)return;r.videos=r.videos||{};if(!r.videos[id]){r.videos[id]=now();touch(r);}}
function stingThen(fn){if(!STING||DB.stingSeen){fn();return;}DB.stingSeen=1;save();const o=document.createElement("div");o.id="sting";o.innerHTML='<video autoplay muted playsinline src="'+esc(VIDEO_BASE+STING)+'"></video><button type="button" class="link">Skip</button>';document.body.appendChild(o);
  let done=false;const end=()=>{if(done)return;done=true;o.remove();fn();};const vv=o.querySelector("video");vv.onended=end;vv.onerror=end;o.querySelector("button").onclick=end;setTimeout(end,6000);}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{const t=e.target.closest("[data-go],[data-act],[data-mod],[data-test],[data-pick],[data-rec],[data-reopen],[data-step],[data-topic],[data-card],[data-play],[data-skipmod]");if(!t)return;
  const d=t.dataset;if(t.closest("details.menu"))t.closest("details.menu").open=false;
  if(d.skipmod){const r=cur();if(!r||!canSkipVids(r))return;const vs=VIDEOS.filter(v=>d.skipmod==="ALL"?vidsFor(r).indexOf(v)>=0:v.mod===d.skipmod);if(d.skipmod==="ALL"&&!confirm("Skip all "+vs.length+" videos? You can still watch any of them later."))return;r.vskip=r.vskip||{};vs.forEach(v=>{if(!(r.videos&&r.videos[v.id]))r.vskip[v.id]=now();});touch(r);toast("Skipped. They stay in Videos if you want them later.");render();return;}
  if(d.play){go("play",{vid:d.play});return;}
  if(d.step!==undefined){go("tour",{step:+d.step});return;}
  if(d.topic){go("drill",{topic:d.topic});return;}
  if(d.card){const dr=DB.drill,id=S.queue[0];
    if(d.card==="rep"){if(dr.rep[id])delete dr.rep[id];else dr.rep[id]=now();save();render();return;}
    dr.seen[id]=1;if(d.card==="miss"){dr.miss[id]=1;S.queue.push(id);}else delete dr.miss[id];S.queue.shift();S.reveal=false;save();
    if(!S.queue.length){toast("Pass complete. Missed cards come back first next time.");go("drill");}else render();return;}
  if(d.go)go(d.go);else if(d.mod)go("mod",{mod:d.mod});else if(d.test)startTest(d.test);
  else if(d.pick){DB.current=d.pick;save();go("home");}
  else if(d.rec)go("trec",{rec:d.rec});
  else if(d.reopen){if(!DB.gate||DB.gate.role!=="admin")return;const r=DB.records[S.rec];r.admin.review=r.admin.review||{};r.admin.review[d.reopen]=now();r.admin.at=now();touch(r);toast(d.reopen+" reopened for "+r.techId);render();}
  else if(d.act==="theme"){DB.theme=DB.theme==="dark"?"light":"dark";save();theme();}
  else if(d.act==="out"){DB.gate=null;save();render();}
  else if(d.act==="preview"){DB.gate={role:"admin",until:now()+H};save();go("tour",{step:0});toast("Preview mode. Set real access codes before this goes live.");}
  else if(d.act==="practice"){const id="DEMO-T00";if(!DB.records[id])DB.records[id]=newRec(id,"owner");DB.current=id;save();go("home");}
  else if(d.act==="watched"){markWatched(S.vid);render();toast("Marked watched");}
  else if(d.act==="localcopy"){S.local=true;render();}
  else if(d.act==="skipone"){const r=cur();if(r&&canSkipVids(r)){r.vskip=r.vskip||{};r.vskip[S.vid]=now();touch(r);toast("Skipped");render();}}
  else if(d.act==="tourdone"){DB.tourDone=true;save();go("team");}
  else if(d.act==="reveal"){S.reveal=true;render();}
  else if(d.act==="topics")go("drill");
  else if(d.act==="afterclear"){DB.after={};save();render();}
  else if(d.act==="repcsv"){const r=[["Card ID","Topic","Question","Answer as shown","Reported"]].concat(Object.keys(DB.drill.rep).map(id=>{const c=DRILLS.find(x=>x[0]===id)||[id,"","",""];return[c[0],c[1],c[2],c[3],fmt(DB.drill.rep[id])];}));download("SSU reported drill cards "+new Date().toISOString().slice(0,10)+".csv",r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv");}
  else if(d.act==="kick"){const r=cur();r.kickoff={at:now()};touch(r);go("home");}
  else if(d.act==="export")exportRec();else if(d.act==="csv")csv();
  else if(d.act==="pull"){if(!CONFIG.RELAY_URL){toast("SSU sync isn't switched on yet. Add record files instead.");return;}const f=(S.dlr||"").trim().toUpperCase().replace(/^DLR/,"");if(!f){toast("Enter a DLR number first.");return;}const n=await pull({dlr:f});if(n>=0){toast(n+" records loaded");render();}}
  else if(d.act==="adminsave"){if(!DB.gate||DB.gate.role!=="admin")return;const r=DB.records[S.rec],a=r.admin,tok=$("#tok"),sp=document.querySelector('input[name=spot]:checked');
    if(tok)a.toolsOk=tok.checked;const vx=$("#vex");if(vx)a.vidsExcused=vx.checked;a.spot=sp?sp.value:"";a.owner=$("#fo").value.trim().slice(0,60);a.due=$("#fd").value;a.at=now();touch(r);toast("Saved for "+r.techId);go("team",{dlr:S.dlr});}
});
document.addEventListener("change",e=>{const t=e.target;
  if(S.view==="test"&&t.name&&t.name[0]==="q"){S.picks[+t.name.slice(1)]=+t.value;const n=Object.keys(S.picks).length;$("#prog").textContent=n+" of "+S.order.length+" answered";$("#sub").disabled=n<S.order.length;}
  if(t.id==="imp")importFiles(t.files);
  if(t.dataset&&t.dataset.after!==undefined){DB.after=DB.after||{};DB.after[t.dataset.after]=t.checked;save();}});
document.addEventListener("input",e=>{if(e.target.id==="dlrf"){S.dlr=e.target.value;clearTimeout(S._f);S._f=setTimeout(()=>{const pos=e.target.selectionStart;render();const f=$("#dlrf");if(f){f.focus();f.setSelectionRange(pos,pos);}},350);}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
  if(f.id==="gate")openGate($("#code").value);
  else if(f.id==="reg"){const id=$("#tid").value.trim().toUpperCase();if(!ID_RX.test(id)){$("#rerr").textContent="That isn't a Tech ID. It looks like DLR2877-T01.";return;}
    if(DB.records[id]&&!DB.records[id].imported){$("#rerr").textContent=id+" is already on this device. Pick it from the list above.";return;}
    const g=DB.gate||{};if(g.dlr&&id.indexOf("DLR"+g.dlr+"-")!==0){$("#rerr").textContent="This code is for DLR "+g.dlr+". Your Tech ID starts DLR"+g.dlr+"-.";return;}
    const tc=f.querySelector("input[name=trk]:checked")||f.querySelector("input[name=trk]");const trk=g.role==="tech"?"tech":tc.value;DB.records[id]=DB.records[id]?Object.assign(DB.records[id],{imported:false}):newRec(id,trk);DB.current=id;touch(DB.records[id]);
    if(CONFIG.RELAY_URL)pull({tech:id}).then(()=>render());go("home");}
  else if(f.id==="tst")grade();
  else if(f.id==="lf"){const r=cur();if($("#sig").value.trim().toUpperCase()!==r.techId){$("#lerr").textContent="Type your Tech ID exactly: "+r.techId;return;}r.loto={at:now(),statements:LOTO_STATEMENTS.length};touch(r);toast("Attestation signed");go("home");}
  else if(f.id==="tf"){const r=cur(),items={};TOOLS_LIST.forEach((_,i)=>{const c=f.querySelector('input[name=t'+i+']:checked');if(c)items[i]=c.value;});
    const miss=TOOLS_LIST.filter((t,i)=>!items[i]).length;if(miss){toast("Mark all "+TOOLS_LIST.length+" items. "+miss+" left.");return;}
    r.tools={items:items,at:now()};if(r.admin.toolsOk){r.admin.toolsOk=false;r.admin.at=now();}touch(r);toast("Tool check submitted");go("home");}
});
function theme(){document.documentElement.dataset.theme=DB.theme==="dark"?"dark":"light";}
theme();
if(DB.current&&CONFIG.RELAY_URL&&gateOk())pull({tech:DB.current}).then(n=>{if(n>0)render();});
render();flush();
window.SSUOB={mstate:mstate,needs:needs,status:status,merge:merge,newRec:newRec,DB:()=>DB,sha256js:sha256js};
})();

</script>
