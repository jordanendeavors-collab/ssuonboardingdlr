","Pre-recorded tape dialer","Pre-recorded tape dialers are obsolete. Digital, IP, and cellular are current standards."],["QB-04533","Security & Intrusion","An arming station/keypad is used to:","Arm and disarm the system","Keypads allow users to arm, disarm, and control the alarm system."],["QB-04534","Security & Intrusion","App-based control allows:","Remote monitoring and control via smartphone","Apps enable remote system control."],["QB-04536","Security & Intrusion","Backup battery capacity:","Per UL listing",""],["QB-04537","Security & Intrusion","Basic components of a burglar alarm system:","Sensing device, control unit, reporting device","Complete burglar alarm requires sensing, control, and reporting components."],["QB-04538","Security & Intrusion","Battery calculations are not required on burglar systems.","False","Battery backup calculations ARE required. UL requires 24 hours standby plus 4 minutes alarm."],["QB-04539","Security & Intrusion","Best protection from tunneling:","Seismic detectors","Seismic detectors detect ground vibrations from tunneling activity."],["QB-04540","Security & Intrusion","Best way to protect an outside air duct opening:","Photoelectric beam","Photoelectric beams effectively protect duct openings by detecting interruption."],["QB-04541","Security & Intrusion","Burglar Alarm & Security Systems","What is a basic component of a burglar alarm system?","D"],["QB-04542","Security & Intrusion","By how much can monitored security reduce burglary risk?","Up to 300%","300% reduction. That's 3x less likely to get hit. If that doesn't sell itself, go back to Module 1."],["QB-04543","Security & Intrusion","Cellular backup communicators:","Provide alternate communication if phone line fails","Cellular backup ensures communication if phone/internet fails."],["QB-04544","Security & Intrusion","Central station monitoring provides:","24/7 professional response to alarms","Central stations provide 24/7 monitoring with dispatch to authorities."],["QB-04545","Security & Intrusion","Certifications for burglar alarm technicians include:","Nicet","NICET (National Institute for Certification in Engineering Technologies) certifies technicians."],["QB-04546","Security & Intrusion","Chime mode:","Provides tone when doors open while disarmed","Chime provides notification when doors open while disarmed."],["QB-04547","Security & Intrusion","Cloud-based systems store:","Data and settings on remote servers","Cloud systems store data on remote servers."],["QB-04549","Security & Intrusion","Connecting batteries in series:","Increases voltage","Series connection adds voltages together (12V + 12V = 24V)."],["QB-04550","Security & Intrusion","Connecting burglar alarm to residential phone using Internet requires:","RJ31X interface jack","RJ31X jack provides line seizure capability to ensure alarm signals take priority."],["QB-04551","Security & Intrusion","Crash and smash protection:","Sends alarm before system can be destroyed","Crash and smash sends immediate signal on entry before panel destruction."],["QB-04552","Security & Intrusion","Cross zoning requires:","Two zones alarm",""],["QB-04553","Security & Intrusion","Cross-zoning requires:","Two zones to activate before alarm","Cross-zoning reduces false alarms by requiring two zone activations."],["QB-04554","Security & Intrusion","DEOL provides:","Alarm and tamper",""],["QB-04555","Security & Intrusion","DVR in CCTV systems stands for:","Digital Video Recorder","DVR = Digital Video Recorder - records and stores video footage."],["QB-04556","Security & Intrusion","Difference between NO and NC contacts:","NC closed in secure state, NO open in normal state","NC contacts are closed when secure, open when activated. NO works opposite."],["QB-04557","Security & Intrusion","Dispatch priority is typically:","Based on alarm type and verification","Priority based on alarm type and verification status."],["QB-04558","Security & Intrusion","Door contact components:","Both magnet and reed",""],["QB-04559","Security & Intrusion","Door contacts are:","Perimeter protection devices","Door/window contacts are perimeter protection - they protect entry points."],["QB-04560","Security & Intrusion","Dual-tech motion detectors combine:","PIR and microwave","Dual-tech combines PIR and microwave - both must trigger to reduce false alarms."],["QB-04561","Security & Intrusion","Dual-tech sensor combines:","PIR + microwave",""],["QB-04562","Security & Intrusion","Dual-technology sensors require:","Both technologies to activate","Dual-tech sensors require both technologies to confirm detection."],["QB-04563","Security & Intrusion","Duress code triggers:","Silent alarm",""],["QB-04564","Security & Intrusion","Duress codes are used when:","Being forced to disarm under threat","Duress codes silently alert monitoring while appearing to disarm."],["QB-04565","Security & Intrusion","Duress signals indicate:","User is under threat","Duress means user forced to disarm under threat."],["QB-04566","Security & Intrusion","EOL resistor purpose in security:","Line supervision",""],["QB-04567","Security & Intrusion","End-of-line resistors serve no purpose other than on a UL-listed installation.","False","EOL resistors provide zone supervision on any installation - they monitor for wire cuts, shorts, and tampering."],["QB-04568","Security & Intrusion","Enhanced call verification (ECV):","Attempts multiple contact numbers","ECV tries multiple numbers before dispatch."],["QB-04569","Security & Intrusion","Enhanced call verification requires:","Two calls to two different numbers","ECV requires calling two different numbers before dispatching authorities."],["QB-04570","Security & Intrusion","Entry delay purpose:","Allow disarm time",""],["QB-04571","Security & Intrusion","Entry/exit zones provide:","Time to arm/disarm without alarm","Entry/exit delay allows arm/disarm time."],["QB-04572","Security & Intrusion","Exit delay purpose:","Allow exit after arm",""],["QB-04573","Security & Intrusion","Fire zone characteristics:","Supervised 24-hour",""],["QB-04574","Security & Intrusion","Fire zones are typically:","24-hour with audible response","Fire zones are 24-hour with immediate audible alarm."],["QB-04575","Security & Intrusion","Geofencing can:","Automate arm/disarm based on location","Geofencing automates based on phone location."],["QB-04576","Security & Intrusion","Glass break detector range:","Varies by model",""],["QB-04577","Security & Intrusion","Glass break sensors detect:","Frequencies of breaking glass","Glass break sensors detect specific sound frequencies of breaking glass."],["QB-04578","Security & Intrusion","Hold-up alarms require:","Immediate silent dispatch","Hold-up requires immediate silent response."],["QB-04579","Security & Intrusion","How do magnetic contacts trigger an alarm?","When separated, the circuit breaks and triggers an alarm","Separation = circuit break = alarm. Door opens, magnet moves away from reed switch. Physics doing the work."],["QB-04580","Security & Intrusion","How should you explain technical concepts to customers?","In clear, understandable terms","Plain language. If the customer's eyes glaze over, you've lost them. Translate tech into benefits."],["QB-04581","Security & Intrusion","Important factors in picking and placing a camera:","Focal point & resolution","Focal point and resolution are critical for effective surveillance coverage."],["QB-04582","Security & Intrusion","Industry standard for burglar alarm panels:","Cp-o1","CP-01 is the SIA Control Panel Standard that burglar alarm panels are manufactured to meet."],["QB-04583","Security & Intrusion","Instant mode:","Eliminates entry delay","Instant mode provides immediate alarm without entry delay."],["QB-04584","Security & Intrusion","Interior protection refers to:","Motion detection within the space","Interior protection detects movement inside the protected area."],["QB-04585","Security & Intrusion","Interior zone follows:","Entry delay",""],["QB-04586","Security & Intrusion","Jamming detection identifies:","RF interference attempts","Jamming detection identifies RF interference."],["QB-04587","Security & Intrusion","Keypad communication:","Both available",""],["QB-04588","Security & Intrusion","Leading cause of false alarms:","User error","User error (forgetting codes, improper entry/exit) is the leading cause of false alarms."],["QB-04589","Security & Intrusion","Least efficient biometric system:","Handwriting","Handwriting recognition is the least reliable biometric due to variability."],["QB-04590","Security & Intrusion","Low battery trouble means:","Battery needs replacement soon","Low battery indicates replacement needed."],["QB-04591","Security & Intrusion","Microwave motion sensors emit:","Radio waves","Microwave sensors emit and receive radio waves."],["QB-04592","Security & Intrusion","Microwave penetrates:","Both glass and walls",""],["QB-04593","Security & Intrusion","Most likely cause of false alarm in ultrasonic motion detection:","Air movement","Ultrasonic detectors are sensitive to air movement which can cause false alarms."],["QB-04594","Security & Intrusion","Most secure biometric method:","Retina scan","Retina scan is most secure - unique pattern, nearly impossible to forge."],["QB-04595","Security & Intrusion","NC zone at rest measures:","EOL resistance",""],["QB-04596","Security & Intrusion","Normal supervised zone resistance with 2.2K EOL:","2,200 ohms","Normal zone = EOL value (2.2K ohms). Short = 0 ohms. Open = infinite."],["QB-04597","Security & Intrusion","Opening/closing signals track:","Arm/disarm activity by user","O/C signals track system arming activity."],["QB-04598","Security & Intrusion","PIR detector detects:","Heat change",""],["QB-04599","Security & Intrusion","PIR detectors sense:","Infrared radiation/body heat","PIR (Passive Infrared) detectors sense body heat/infrared radiation."],["QB-04600","Security & Intrusion","PIR motion detectors sense:","Heat energy changes","Passive Infrared (PIR) detects changes in infrared heat energy."],["QB-04601","Security & Intrusion","PIR pet immunity up to:","Varies by model",""],["QB-04602","Security & Intrusion","PIR sensors detect:","Changes in infrared energy","PIR (Passive Infrared) sensors detect changes in infrared/heat energy."],["QB-04603","Security & Intrusion","PTZ camera stands for:","Pan, Tilt, Zoom","PTZ = Pan, Tilt, Zoom - allows camera movement and magnification."],["QB-04604","Security & Intrusion","Panel transformer output:","16.5VAC",""],["QB-04605","Security & Intrusion","Panic buttons provide:","Emergency alarm activation","Panic buttons allow manual emergency alarm activation."],["QB-04606","Security & Intrusion","Panic zone response:","Instant",""],["QB-04607","Security & Intrusion","Perimeter protection advantages include:","Works when building is occupied","Perimeter protection can be armed while building is occupied."],["QB-04608","Security & Intrusion","Perimeter protection refers to:","Protection of building entry points","Perimeter protection secures doors, windows, and other entry points."],["QB-04609","Security & Intrusion","Problem with only having interior protection:","Unprotected when occupied","Interior-only protection leaves space unprotected when occupied."],["QB-04610","Security & Intrusion","RF supervision ensures:","Wireless sensor communication","RF supervision verifies wireless sensor communication."],["QB-04611","Security & Intrusion","Recessed contact advantage:","Both",""],["QB-04612","Security & Intrusion","Recessed door contacts are used when:","Appearance is important","Recessed contacts are hidden in door frame for aesthetic/clean installation."],["QB-04613","Security & Intrusion","Seismic sensors are used to detect:","Vault break-in attempts","Seismic sensors detect vibrations from drilling or cutting."],["QB-04614","Security & Intrusion","Shock sensor detects:","Vibration",""],["QB-04615","Security & Intrusion","Shock sensors detect:","Vibration from impacts","Shock/vibration sensors detect physical impacts."],["QB-04616","Security & Intrusion","Siren timeout:","Programmable",""],["QB-04617","Security & Intrusion","Smart home integration provides:","Combined security and automation control","Integration combines security with home automation."],["QB-04618","Security & Intrusion","Stay mode arms:","Perimeter only, allowing interior movement","Stay mode arms perimeter while allowing interior movement."],["QB-04619","Security & Intrusion","Supervised zones detect:","Sensor activation and circuit faults","Supervised zones detect both alarms and faults."],["QB-04620","Security & Intrusion","Swinger shutdown after:","Programmable",""],["QB-04621","Security & Intrusion","Swinger shutdown:","Limits repeated activations from one zone","Swinger shutdown prevents repeated false alarms from the same zone."],["QB-04622","Security & Intrusion","Takeover modules allow:","Using existing wired sensors with new panel","Takeover modules interface existing sensors to new panel."],["QB-04623","Security & Intrusion","To increase standby time for 12V burglar alarm, connect batteries:","In parallel","Parallel batteries maintain 12V while increasing amp-hour capacity (standby time)."],["QB-04624","Security & Intrusion","To measure resistance of an alarm circuit, technician needs:","Multimeter","A multimeter (DMM) with ohmmeter function measures circuit resistance for EOL values."],["QB-04625","Security & Intrusion","Trouble conditions indicate:","System problems requiring attention","Trouble indicates system issues."],["QB-04626","Security & Intrusion","Two-way voice allows:","Operator to listen and speak through panel","Two-way voice enables communication between panel and monitoring."],["QB-04627","Security & Intrusion","Typical entry delay:","30-60 seconds",""],["QB-04628","Security & Intrusion","Typical panel voltage:","12VDC",""],["QB-04629","Security & Intrusion","UL 2050 covers:","National Industrial Security Systems","UL 2050 covers national security system standards."],["QB-04631","Security & Intrusion","UL Listed central stations must:","Meet strict standards for monitoring","UL Listed stations meet rigorous operational standards."],["QB-04632","Security & Intrusion","Ultrasonic motion sensors use:","High-frequency sound waves","Ultrasonic sensors use sound waves above human hearing range."],["QB-04633","Security & Intrusion","Video verification allows:","Visual confirmation of alarm events","Video verification provides visual alarm confirmation."],["QB-04634","Security & Intrusion","What advantage do recessed contacts have over surface-mount?","Hidden in the door/window frame for cleaner appearance","Cleaner look — hidden in the frame. Commercial and high-end residential love these. Takes more skill to install."],["QB-04635","Security & Intrusion","What causes false alarm with PIR detector:","Cold/Heat sources","PIR detectors sense heat changes - cold/heat sources can trigger false alarms."],["QB-04636","Security & Intrusion","What combination of skills defines a successful security sales professional?","Technical knowledge, consultative selling, and genuine concern for welfare","Three pillars: know your stuff, sell consultatively, actually care. Miss one and you're average."],["QB-04638","Security & Intrusion","What does 'armed stay' mean?","Perimeter zones active, interior motion bypassed","Armed Stay = perimeter active, interior motion disabled for occupants."],["QB-04639","Security & Intrusion","What does Expanded Protection require?","Complete protection of all accessible openings and complete protection of one or more interior doors","Expanded protection requires complete protection of accessible openings AND interior doors."],["QB-04640","Security & Intrusion","What does PIR stand for in motion detection?","Passive infrared","Passive Infrared. Detects BODY HEAT, not motion. Know the difference — it matters for placement."],["QB-04641","Security & Intrusion","What does \"NC\" mean when referring to alarm contacts?","Normally Closed","NC = Normally Closed contact (opens when triggered)."],["QB-04642","Security & Intrusion","What does a dual-tech motion detector combine to reduce false alarms?","PIR and microwave technology","PIR + microwave. Both must trigger = alarm. One triggers alone = no alarm. Dramatically cuts false dispatches."],["QB-04643","Security & Intrusion","What does an image verification motion detector do upon activation?","Captures photos for alarm verification","Snaps photos on trigger → sends to monitoring center. Visual verification = priority dispatch. Game changer."],["QB-04644","Security & Intrusion","What does fire detection provide as part of a comprehensive security solution?","Critical life-safety protection","Life safety. Not a nice-to-have — a must-have. Fire detection saves LIVES, not just property."],["QB-04645","Security & Intrusion","What exterior items should be checked beyond obvious entry points?","Outbuildings, sheds, detached garages, workshops","Sheds, detached garages, workshops. Criminals love outbuildings — they're usually unsecured and full of tools."],["QB-04646","Security & Intrusion","What happens if a supervised zone wire is cut?","The panel detects a trouble condition","Cut wires in supervised zones create a trouble condition."],["QB-04647","Security & Intrusion","What happens when a supervised alarm zone wire is cut?","The zone shows a trouble condition","A cut wire causes infinite resistance, triggering a trouble condition."],["QB-04648","Security & Intrusion","What interior items should be assessed during a walk-through?","Floor plan, sleeping areas, wifi coverage, existing detectors","Floor plan, sleeping areas, WiFi, detectors. Every room tells you something about the security design."],["QB-04649","Security & Intrusion","What is 'pet immunity' in motion detectors?","The detector ignores motion from animals up to a certain weight","Pet-immune motion detectors are designed to ignore movement from smaller animals (typically up to 40-80 lbs) while detecting human intruders."],["QB-04651","Security & Intrusion","What is a 24-hour zone?","Zone that's always active regardless of arm state","24-hour zones (like panic buttons) are always active."],["QB-04652","Security & Intrusion","What is a PIR motion detector?","Passive Infrared","detects body heat movement - PIR = Passive Infrared, detects heat/movement from people."],["QB-04654","Security & Intrusion","What is a duress code?","Silent alarm code entered under threat","Duress code silently signals distress when entered under threat."],["QB-04655","Security & Intrusion","What is a glass break detector?","An acoustic sensor that detects the sound frequency of breaking glass","Glass break detectors are acoustic sensors that listen for the specific sound frequencies produced when glass is broken."],["QB-04656","Security & Intrusion","What is a glassbreak detector?","Device that detects sound frequency of breaking glass","Glassbreak detectors sense the specific frequency of shattering glass."],["QB-04657","Security & Intrusion","What is a proprietary burglar alarm system?","An alarm connected to constantly monitored receiving equipment at a central station operated by the property owner","Proprietary systems are operated by the property owner at their own central station."],["QB-04658","Security & Intrusion","What is an EOL (End of Line) resistor used for?","Supervision","to detect cut or shorted wiring - EOL resistors supervise wiring to detect cuts or shorts."],["QB-04659","Security & Intrusion","What is an end-of-line (EOL) resistor used for?","To supervise the circuit and detect tampering or wire cuts","EOL resistors provide circuit supervision - if the wire is cut, the resistance changes and triggers a trouble condition."],["QB-04660","Security & Intrusion","What is an instant zone?","Zone that triggers alarm immediately when violated","Instant zones trigger alarms immediately with no delay."],["QB-04661","Security & Intrusion","What is the advantage of a hybrid wired/wireless panel?","Maximum flexibility for existing homes with partial wiring","Flexibility. Got existing wiring? Use it. Need wireless for additions? Add it. Best of both worlds."],["QB-04662","Security & Intrusion","What is the annual growth rate of the residential security market?","8-10% annually","8-10% annual growth. This industry isn't slowing down — you're in the right business."],["QB-04663","Security & Intrusion","What is the best protection for property with valuables and high theft potential?","2 UL Certified central station alarms: 1 for premises, 1 for vault, with 2 accounts each","High-value properties need separate UL certified alarms with separate accounts for premises and vault."],["QB-04664","Security & Intrusion","What is the best protection for property with valuables and a high theft potential?","2 UL Certified central station alarms: 1 for premises, 1 for vault, with 2 accounts each",""],["QB-04665","Security & Intrusion","What is the best protection from tunneling?","Seismic detectors","Seismic detectors detect ground vibrations from tunneling."],["QB-04666","Security & Intrusion","What is the control panel's role in a security system?","The brain of the entire system","It's the BRAIN. Every sensor, siren, and communicator runs through it. No panel = no system."],["QB-04667","Security & Intrusion","What is the difference between normally open (NO) and normally closed (NC) contacts?","NC contacts are closed in the normal/secure state; NO contacts are open in the normal state","NC (normally closed) contacts are closed when the door/window is secure and open when activated. NO contacts work opposite."],["QB-04668","Security & Intrusion","What is the extent of coverage for all accessible openings plus sound discrimination in all enclosed areas with exit doors that can detect noise levels below 65 decibels?","Extent 3","Extent 3 provides this level of coverage."],["QB-04669","Security & Intrusion","What is the primary role of a security sales professional?","Assess risks, design solutions, provide peace of mind","You're a security CONSULTANT first, salesperson second. If you're just pushing boxes, you're doing it wrong."],["QB-04670","Security & Intrusion","What is the problem with only having interior protection?","Unprotected when occupied","Interior-only protection leaves the space unprotected when occupied."],["QB-04671","Security & Intrusion","What is the purpose of discovery questions in a needs assessment?","Reveal customer priorities, concerns, and budget constraints","Discovery reveals priorities, concerns, AND budget. Skip this and you're guessing — and guessing loses deals."],["QB-04672","Security & Intrusion","What is the relationship between UL certificates and insurance companies?","Insurance companies offer a discount to premises protected by UL certified alarms","Insurance companies often offer discounts for UL certified alarm systems."],["QB-04673","Security & Intrusion","What is the typical coverage area of a glass break detector?","15-25 ft radius","15-25 ft radius with DIRECT line of hearing. Walls block sound. Place it where it can 'hear' the glass."],["QB-04674","Security & Intrusion","What is the typical entry delay time for a residential alarm system?","30-45 seconds","30-45 seconds is the typical entry delay for residential systems."],["QB-04675","Security & Intrusion","What is the typical supervision method for a burglar alarm zone?","End of Line Resistor (EOLR)","EOLR supervision is the standard method for hardwired alarm zones."],["QB-04676","Security & Intrusion","What is your role as a security sales professional regarding customer privacy?","Respect and protect all personal information","ALL personal info gets protected. Period. This isn't optional — it's your professional obligation."],["QB-04677","Security & Intrusion","What must glass break detectors have to protected glass?","Direct line of hearing","Line of HEARING. It listens for the frequency of breaking glass. Put a wall between it and the window = useless."],["QB-04679","Security & Intrusion","What question helps determine if fire/CO protection is needed?","Are you interested in fire and life safety protection as well?","Never assume they don't want it. Ask. Most people don't know it's included in professional monitoring."],["QB-04681","Security & Intrusion","What should you ALWAYS recommend solutions based on?","Actual customer needs","Actual. Customer. Needs. Not your commission check. Ethics aren't optional in this business."],["QB-04682","Security & Intrusion","What should you assess on the EXTERIOR of a property?","Entry points, lighting, landscaping","Entry points, lighting, landscaping. You're looking for vulnerabilities, not real estate value."],["QB-04683","Security & Intrusion","What should you check regarding existing system documentation?","Review any existing system documentation if applicable","Review it ALL. Existing wiring, panel type, sensor locations — it's free intel for your design."],["QB-04684","Security & Intrusion","What should you research BEFORE meeting the customer?","Neighborhood crime statistics and trends","Crime stats for THEIR neighborhood. Show up with local data and you're immediately credible."],["QB-04685","Security & Intrusion","What tools should you bring to a security assessment?","Measuring tape, flashlight, camera, assessment forms","Tape, flashlight, camera, forms. Show up unprepared and you look like an amateur. Don't be that person."],["QB-04686","Security & Intrusion","What two components make up a door/window contact?","Magnet and reed switch","Magnet + reed switch. Separate them = circuit breaks = alarm. That's it. Simple and reliable."],["QB-04687","Security & Intrusion","What type of contact is best for retrofit installations?","Surface-mount","Surface-mount. Easy install, no drilling into frames. Visible? Yes. But fast and reliable for retrofits."],["QB-04688","Security & Intrusion","What type of contact should be used for sliding or overhead doors?","Wide-gap contacts","Wide-gap. Non-standard doors = non-standard gaps. Regular contacts won't reach. Know your door types."],["QB-04689","Security & Intrusion","What type of motion detector uses infrared technology?","PIR (Passive Infrared) detector","PIR detectors sense changes in infrared (heat) energy caused by human movement."],["QB-04690","Security & Intrusion","What type of sensor is best for detecting glass breakage?","Acoustic glass break detector","Acoustic glass break detectors listen for the sound frequency of breaking glass."],["QB-04691","Security & Intrusion","What type of zone is typically used for entry/exit doors?","Delay zone","Entry/exit doors use delay zones to allow entry/exit time."],["QB-04692","Security & Intrusion","What weight range do pet-immune motion detectors typically accommodate?","35-80 lbs","35-80 lbs typical. Got a customer with a Great Dane? You might need ceiling-mount or different tech."],["QB-04693","Security & Intrusion","Which is an effective discovery question?","What prompted you to consider security at this time?","Open-ended, non-threatening, reveals their trigger event. This is how you uncover the real motivation."],["QB-04694","Security & Intrusion","Which motion detection technology provides the lowest false alarm rate?","Dual-technology (PIR + microwave)","Dual-tech. Requires BOTH PIR and microwave to agree before triggering. Industry gold standard for false alarm reduction."],["QB-04695","Security & Intrusion","Which of the following is true about sound protection?","Complete protection of all accessible movable openings and sound detection in all enclosed areas with surfaces common to outside","Sound protection requires complete protection of openings plus sound detection in enclosed areas."],["QB-04696","Security & Intrusion","Which panel type is best for businesses and high-security applications?","Commercial grade","Commercial grade. Advanced features, expandability, and the horsepower for large properties. Don't undersize a panel."],["QB-04697","Security & Intrusion","Which practice is NEVER acceptable in security sales?","Using fear tactics or exaggerating crime statistics","Fear tactics = instant credibility killer. Let the real stats do the talking — they're scary enough."],["QB-04698","Security & Intrusion","Why do you ask about pets during assessment?","Determines motion detector type (pet-immune)","Pet = motion detector selection. 80-lb Lab tripping the alarm at 2 AM = false dispatch = unhappy customer."],["QB-04699","Security & Intrusion","Why is asking about the customer's schedule important?","Determines arming mode design","Their schedule drives your arming mode design. Stay vs Away, auto-arm timing, alerts — all tied to when they're home."],["QB-04700","Security & Intrusion","Why should you bring a camera to assessments?","To document the property with permission for system design","WITH PERMISSION — document entry points, cable paths, panel location options. Photos prevent design mistakes."],["QB-04701","Security & Intrusion","Wide gap contact for:","Overhead doors",""],["QB-04702","Security & Intrusion","Wiegand refers to:","A type of card reader protocol","Wiegand is a common protocol for card reader to controller communication."],["QB-04703","Security & Intrusion","Z-Wave is:","Wireless home automation protocol","Z-Wave is wireless protocol for smart devices."],["QB-04704","Security & Intrusion","Zone bypassing allows:","Temporarily ignoring specific sensors","Bypassing allows arming while ignoring problem zones."],["QB-04705","Security & Intrusion","Zone expander adds:","More zones",""],["QB-04706","Security & Intrusion","Zone open indicates:","Alarm",""],["QB-04707","Security & Intrusion","Zone short indicates:","Tamper/trouble",""],["QB-04708","Security & Intrusion","Zone shows 0 ohms resistance. This indicates:","Short circuit","0 ohms = short circuit. Normal ,"8 feet","Ground rods must be at least 8 feet into the earth."],["QB-04917","Wiring & Color Codes","A load where the maximum current is expected to last 3 hours or more is defined as:","Continuous","Continuous load = maximum current expected for 3+ hours."],["QB-04918","Wiring & Color Codes","A remote-control circuit is one that:","Controls another circuit through a relay","Remote-control circuits control other circuits through relays."],["QB-04919","Wiring & Color Codes","A short circuit occurs when:","Hot and neutral/ground connect directly","Short circuit is direct connection between hot and neutral/ground."],["QB-04920","Wiring & Color Codes","A wire nut is:","A twist-on wire connector","Wire nuts are twist-on connectors for joining wires."],["QB-04922","Wiring & Color Codes","An open circuit means:","Break in the electrical path","Open circuit is a break preventing current flow."],["QB-04923","Wiring & Color Codes","BX cable is also known as:","Armored cable (AC)","BX is armored cable with flexible metal armor."],["QB-04924","Wiring & Color Codes","Bonding connects:","Metal parts to ensure electrical continuity","Bonding connects metal parts for safety and proper fault clearing."],["QB-04925","Wiring & Color Codes","Category 5e cable supports speeds up to?","- Cat5e supports up to 1 Gbps.",""],["QB-04926","Wiring & Color Codes","Category 6a supports 10 Gbps at what distance?","- Cat6a supports 10 Gbps at 100 meters.",""],["QB-04928","Wiring & Color Codes","Derating is required when:","Multiple conductors are bundled together","Bundling conductors reduces heat dissipation, requiring derating."],["QB-04929","Wiring & Color Codes","EMT shall be:","Reamed or otherwise finished to remove all rough edges","EMT must be reamed to remove rough edges that could damage conductor insulation."],["QB-04930","Wiring & Color Codes","Electrical tape is used for:","Insulation and identification","Electrical tape insulates and identifies conductors."],["QB-04931","Wiring & Color
